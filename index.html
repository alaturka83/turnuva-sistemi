<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnuva">
<meta name="application-name" content="Turnuva Merkezi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Turnuva Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef2ef;--card:#fff;--ink:#11201a;--mut:#5f6f66;--line:#dfe6e1;--soft:#f5f8f6;
  --pri:#0b3d2a;--pri2:#13693f;--pri3:#1f8a55;--acc:#f4c430;--red:#d64545;--live:#e11d48;--blue:#2563eb;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(10,40,25,.07);
  --fd:'Barlow Condensed','Noto Color Emoji',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Barlow,'Noto Color Emoji',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:calc(74px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);letter-spacing:.3px;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 30px}

/* HEADER */
#hdr{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#hdr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);pointer-events:none}
.tsec{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left;padding:4px;border-radius:12px;position:relative;z-index:1}
.tsec .tl{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;flex:none}
.tsec .tt{min-width:0}
.tsec b{display:block;font-family:var(--fd);font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsec small{opacity:.75;font-size:12.5px;display:flex;gap:6px;align-items:center}
.hsag{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.hbtn{height:38px;min-width:38px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:13px;font-weight:600}
.hbtn svg{width:20px;height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8;display:inline-block}
.dot.yerel{background:var(--acc)}

/* NAV */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--mut)}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--pri2)}
#nav button.on svg{stroke-width:2.4}
#nav .brand{display:none}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:228px}
  #hdr{padding-left:20px}
  #nav{top:0;bottom:0;right:auto;width:228px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:4px;box-shadow:none}
  #nav .brand{display:block;font-family:var(--fd);font-size:22px;color:var(--pri);padding:4px 10px 16px;font-weight:800}
  #nav .brand span{color:var(--pri3)}
  #nav .brand.kb{display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.1}
  #nav .brand.kb small{display:block;font-family:Barlow;font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
  #nav button{flex:none;flex-direction:row;gap:12px;font-size:15.5px;padding:11px 12px;justify-content:flex-start}
  #nav button.on{background:#e7f3ec}
  .wrap{padding:22px 24px 40px}
}

/* CARDS & COMMON */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;gap:8px}
.sec h2{font-size:21px}
.sec .lnk{color:var(--pri2);font-weight:600;font-size:14px}
.mut{color:var(--mut)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.btn.p{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn.a{background:var(--acc);border-color:var(--acc);color:#2a2100}
.btn.r{background:#fff;border-color:#f1c4c4;color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.blk{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.stp input{width:100%}
.stp button{flex:none}
@media(max-width:420px){.stp button{width:40px}}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}
.empty .big{font-size:46px;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.seg{display:inline-flex;background:#e2e9e4;border-radius:11px;padding:3px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.badge.live{background:var(--live);color:#fff}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.badge.hk{background:#fde8e8;color:var(--red)}
.badge.er{background:#fff4d6;color:#8a6400}
@keyframes pulse{50%{opacity:.25}}

/* LOGO */
.lg{display:inline-grid;place-items:center;flex:none;overflow:visible;line-height:1}
.lg img{width:100%;height:100%;object-fit:contain}

/* MATCH CARD */
.mac{display:block;width:100%;text-align:left;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px 12px;margin-bottom:10px}
.mac .mt{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:8px;gap:6px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tk{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.tk.ev{justify-content:flex-end;text-align:right}
.tk .tad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.kaz{font-weight:800}
.tk.kyb{color:var(--mut)}
.skor,.saat{font-family:var(--fd);font-size:26px;font-weight:800;min-width:74px;text-align:center;background:var(--soft);border-radius:10px;padding:2px 8px;letter-spacing:1px}
.saat{font-size:19px;color:var(--pri2);letter-spacing:0}
.skor.canli{background:var(--live);color:#fff}
.skor i{font-style:normal;opacity:.5;margin:0 2px}

/* HERO */
.hero{background:linear-gradient(135deg,#123f2c,#1b6b44);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border:2px solid rgba(255,255,255,.12);border-radius:50%}
.hero::after{content:"";position:absolute;right:48px;top:-40px;bottom:-40px;width:2px;background:rgba(255,255,255,.1)}
.hero h1{font-size:26px;line-height:1.05;position:relative}
.hero .hs{display:flex;gap:18px;margin-top:12px;position:relative;flex-wrap:wrap}
.hero .hs div{font-size:12px;opacity:.85}
.hero .hs b{display:block;font-family:var(--fd);font-size:24px;opacity:1}
.prog{height:7px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:12px;overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--acc);border-radius:9px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:12px;color:var(--mut);font-weight:700;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl .tkc{text-align:left;display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tbl .tkc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42vw}
.tbl .p{font-family:var(--fd);font-weight:800;font-size:18px}
.tbl .pos{width:30px;font-weight:700;color:var(--mut)}
.tbl tr.ilk .pos{color:#b88a00}
.tbl tr.ilk td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl .dt{display:none}
.tbl.detay .dt,.tblw.gen .dt{display:table-cell}
.tblw{overflow-x:auto;margin:0 -14px;padding:0 14px}
@media(min-width:700px){.tbl .dt{display:table-cell}.tbl .tkc span{max-width:none}}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:18px;height:18px;border-radius:5px;font-size:10.5px;font-style:normal;font-weight:800;color:#fff;display:grid;place-items:center}
.form .G{background:#16a34a}.form .B{background:#9ca3af}.form .M{background:#dc2626}

/* TEAM GRID */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--tc,#ccc)}
.tcard b{display:block;margin-top:8px;font-family:var(--fd);font-size:19px}
.thead{border-radius:18px;padding:18px;color:#fff;display:flex;gap:14px;align-items:center;margin-bottom:14px;position:relative;overflow:hidden}
.thead h1{font-size:28px}

/* PLAYER CARDS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pc{border-radius:14px;padding:10px 8px 9px;text-align:center;color:#2b1d00;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.12);overflow:hidden}
.pc.altin{background:linear-gradient(160deg,#fbe39a,#d9a92e 70%,#b98a1c)}
.pc.gumus{background:linear-gradient(160deg,#f1f4f6,#bcc6cc 70%,#99a5ad);color:#1e2a30}
.pc.bronz{background:linear-gradient(160deg,#f3cfae,#c98b58 70%,#a96d3e);color:#2e1708}
.pc .rt{position:absolute;left:8px;top:6px;font-family:var(--fd);font-weight:800;font-size:20px;line-height:1}
.pc .no{position:absolute;right:8px;top:7px;font-family:var(--fd);font-weight:700;font-size:14px;opacity:.75}
.pc .av{font-size:40px;margin:12px 0 2px}
.pc .pn{font-family:var(--fd);font-weight:700;font-size:16px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ps{display:flex;justify-content:center;gap:8px;font-size:11.5px;font-weight:700;margin-top:4px;opacity:.85}
.bigcard{width:250px;margin:4px auto 10px;padding:18px 16px 16px}
.bigcard .rt{font-size:38px;left:16px;top:14px}
.bigcard .no{font-size:20px;right:16px;top:16px}
.bigcard .av{font-size:86px;margin:26px 0 6px}
.bigcard .pn{font-size:26px}
.bigcard .tm{font-size:13px;font-weight:700;opacity:.8;margin-top:2px}
.bigcard .stt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;border-top:1px solid rgba(0,0,0,.15);padding-top:10px}
.bigcard .stt b{display:block;font-family:var(--fd);font-size:26px;line-height:1}
.bigcard .stt span{font-size:11px;font-weight:700;letter-spacing:.5px}

/* LISTS */
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.lst li:last-child{border-bottom:0}
.lst .n{width:24px;font-weight:700;color:var(--mut);text-align:center}
.lst .v{margin-left:auto;font-family:var(--fd);font-weight:800;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.tile b{display:block;font-family:var(--fd);font-size:28px;line-height:1.05}
.tile span{font-size:12.5px;color:var(--mut);font-weight:600}

/* FORMS */
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:#33443b}
.fld .hint{font-size:12.5px;color:var(--mut);margin-top:5px}
.inp{width:100%;height:48px;border:1px solid #cfd9d3;border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical}
.inp:focus{outline:2px solid var(--pri3);outline-offset:-1px;border-color:transparent}
.stp{display:flex;align-items:center;border:1px solid #cfd9d3;border-radius:12px;background:#fff;height:48px;overflow:hidden}
.stp button{width:48px;height:100%;font-size:22px;font-weight:700;color:var(--pri2);background:var(--soft)}
.stp input{flex:1;min-width:0;border:0;text-align:center;font-weight:700;font-size:18px;height:100%;background:transparent}
.stp input:focus{outline:none}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#cbd5cf;border-radius:30px;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--pri3)}
.sw input:checked+i::after{transform:translateX(20px)}
.gunler{display:flex;gap:6px;flex-wrap:wrap}
.gunler button{width:48px;height:42px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700}
.gunler button.on{background:var(--pri2);color:#fff;border-color:var(--pri2)}
.tagl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 12px;border-radius:10px;background:#e7f3ec;font-weight:700;color:var(--pri)}
.tag button{width:26px;height:26px;border-radius:8px;color:var(--red);font-size:18px}
.krl{list-style:none;margin:0;padding:0}
.krl li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14.5px;font-weight:600}
.krl li.off{opacity:.45}
.krl li .k{flex:1}
.krl li .no{width:22px;height:22px;border-radius:7px;background:var(--pri2);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.krl li button{width:34px;height:34px;border-radius:9px;background:var(--soft);font-weight:700}
.krl li.sabit{background:#e7f3ec}

/* WIZARD */
.wz-steps{display:flex;gap:4px;margin-bottom:14px}
.wz-steps i{flex:1;height:5px;border-radius:5px;background:#d4ddd7}
.wz-steps i.on{background:var(--pri3)}
.wz-head{margin-bottom:14px}
.wz-head small{color:var(--pri2);font-weight:700;font-size:13px}
.wz-head h1{font-size:28px}
.wz-foot{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));display:flex;gap:10px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
@media(min-width:900px){.wz-foot{bottom:0}}
.wz-foot .btn{flex:1}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trow .no{width:22px;color:var(--mut);font-weight:700;text-align:center;font-size:14px}
.trow .inp{flex:1}
.lgbtn{width:48px;height:48px;border-radius:12px;font-size:30px;flex:none;display:grid;place-items:center;overflow:hidden;background:#fff;border:1px solid var(--line)}
.lgbtn img{width:100%;height:100%;object-fit:contain}
.clr{width:48px;height:48px;border-radius:12px;border:1px solid #cfd9d3;padding:4px;background:#fff;flex:none}
.sumg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sumg div{background:var(--soft);border-radius:12px;padding:10px}
.sumg b{display:block;font-family:var(--fd);font-size:24px}
.sumg span{font-size:12.5px;color:var(--mut);font-weight:600}
.uyari{background:#fff4d6;border:1px solid #f1d68a;color:#6b4e00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.bilgi{background:#e7f3ec;border:1px solid #bfe0cc;color:#164d31;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* SHEET */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.ac{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(5,20,12,.5);animation:fi .2s}
#sheet>.pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));animation:su .25s ease-out}
#sheet .grab{width:44px;height:5px;border-radius:5px;background:#c5cfc9;margin:4px auto 10px}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
#sheet .sh h2{font-size:22px}
#sheet .x{width:38px;height:38px;border-radius:11px;background:#fff;font-size:20px;flex:none}
@media(min-width:700px){#sheet>.pn{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:560px;border-radius:20px;max-height:88vh;animation:fi .2s}}
@keyframes su{from{transform:translateY(100%)}}
@keyframes fi{from{opacity:0}}
.emg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.emg button{height:52px;border-radius:12px;background:#fff;font-size:28px;border:1px solid var(--line)}
.pbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pbtns button{min-height:58px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left;font-weight:700}
.pbtns button .a{font-size:26px}
.pbtns button small{display:block;font-weight:600;color:var(--mut);font-size:12px}

/* DETAIL */
.dsk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:6px 0 14px}
.dsk .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-family:var(--fd);font-size:18px;line-height:1.1}
.dsk .s{font-family:var(--fd);font-size:46px;font-weight:800;line-height:1}

.kt-btn{margin-left:auto;display:flex;gap:6px;flex:none}
.kt-btn button{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.12);color:#fff;font-size:17px}
.kt-sahne{position:relative;z-index:2;flex:1;min-height:0;margin:1.6vh 0 1vh}
.kt-sahne>section{position:absolute;inset:0;display:none}
#kuraT[data-faz=intro] .kt-intro,#kuraT[data-faz=fik] .kt-fik,#kuraT[data-faz=final] .kt-final{display:flex}
#kuraT[data-faz=cek] .kt-cek{display:grid}
.kt-intro{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1vh;animation:kYuk .8s ease-out}
@keyframes kYuk{from{transform:translateY(24px);opacity:0}}
.ki-logo{width:min(27vh,40vw);height:min(27vh,40vw);border-radius:50%;background:radial-gradient(circle,#fff,#e6eee8);display:grid;place-items:center;font-size:min(13vh,21vw);box-shadow:0 0 0 6px rgba(244,196,48,.65),0 0 70px rgba(244,196,48,.45);animation:logoGir 1.3s cubic-bezier(.2,1.4,.4,1)}
.ki-logo img{width:80%;height:80%;object-fit:contain}
#kuraT .lg img{object-fit:contain}
.ki-logo.resim{background:none}
.ki-logo.resim img{width:94%;height:94%}
@keyframes logoGir{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.ki-ust{font-weight:700;opacity:.8;letter-spacing:1px;margin-top:1.4vh}
.kt-intro h1{font-size:clamp(28px,6.2vh,66px);line-height:1}
.ki-alt,.kfin h1{background:linear-gradient(90deg,#f4c430,#fff6c8,#f4c430);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:parla 2.4s linear infinite}
.ki-alt{font-family:var(--fd);font-weight:800;letter-spacing:5px;font-size:clamp(16px,3.2vh,32px)}
@keyframes parla{to{background-position:-200% 0}}
.ki-bilgi{opacity:.78;font-size:14px}
.ki-sayac{font-family:var(--fd);font-weight:800;font-size:clamp(56px,15vh,150px);line-height:1;color:var(--acc);min-height:1em;margin-top:1vh;text-shadow:0 0 34px rgba(244,196,48,.6)}
.ki-sayac.yazi{font-size:clamp(34px,8vh,80px);letter-spacing:3px}
.ki-sayac.vur{animation:vur .9s ease-out}
@keyframes vur{0%{transform:scale(2.3);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.kt-cek{grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1.1fr);gap:3vw;align-items:center}
.kt-sol{display:flex;flex-direction:column;align-items:center;gap:1vh}
.kt-torba{position:relative;width:min(25vw,40vh);aspect-ratio:1;margin-bottom:13%;container-type:inline-size}
.kt-cam{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.32),rgba(255,255,255,.07) 45%,rgba(255,255,255,.03) 70%);border:3px solid rgba(255,255,255,.42);box-shadow:inset 0 -20px 44px rgba(0,0,0,.4),0 14px 44px rgba(0,0,0,.45),0 0 40px rgba(244,196,48,.15);overflow:hidden}
.kt-ayak{position:absolute;left:26%;right:26%;top:100%;height:10%;margin-top:-1%;background:linear-gradient(#e9be4a,#8a6410);border-radius:3px 3px 14px 14px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.kt-ayak::before{content:"";position:absolute;left:30%;right:30%;top:-34%;height:40%;background:linear-gradient(#c99a26,#e9be4a);border-radius:4px 4px 0 0}
.kt-parilti{position:absolute;left:14%;top:9%;width:30%;height:17%;border-radius:50%;background:rgba(255,255,255,.4);filter:blur(5px);transform:rotate(-30deg)}
.kt-top{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-size:11cqw;line-height:1;font-style:normal;box-shadow:inset -4px -6px 10px rgba(0,0,0,.35),inset 4px 4px 8px rgba(255,255,255,.55),0 3px 8px rgba(0,0,0,.3);animation:kar 1.4s ease-in-out infinite alternate;transition:opacity .35s,scale .35s}
.kt-top img,.kt-firla img{width:76%;height:76%;object-fit:contain}
.kt-top span,.kt-firla span{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.kt-torba.karis .kt-top{animation-duration:.42s}
.kt-top.cikti{opacity:0;scale:0}
@keyframes kar{to{transform:translate(var(--x),var(--y))}}
.kt-torba.salla{animation:salla .6s}
@keyframes salla{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.kt-firla{position:absolute;left:40.5%;top:0;width:19%;aspect-ratio:1;border-radius:50%;opacity:0;display:grid;place-items:center;overflow:hidden;font-size:11cqw;line-height:1;font-style:normal;box-shadow:inset -4px -6px 10px rgba(0,0,0,.35),inset 4px 4px 8px rgba(255,255,255,.6),0 0 26px rgba(255,255,255,.7);z-index:2}
.kt-firla.git{animation:firla .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes firla{0%{opacity:1;transform:translateY(60%) scale(.6)}55%{opacity:1;transform:translateY(-130%) scale(1.6)}100%{opacity:0;transform:translateY(-170%) scale(2.6)}}
.kt-sayac{font-family:var(--fd);font-weight:800;font-size:clamp(20px,3.6vh,36px);color:var(--acc)}
.kt-orta{display:flex;justify-content:center;perspective:1200px}
.kt-kart{--tc:#13693f;width:min(29vw,50vh,360px);aspect-ratio:3/4;border-radius:22px;background:linear-gradient(160deg,var(--tc),#06160e 130%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3vh;text-align:center;padding:16px;box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.28);position:relative;overflow:hidden}
.kt-kart::before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.2),transparent 28%);animation:don 4s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.kt-kart>*{position:relative}
.kt-kart.bos,.kt-kart.tamam{background:linear-gradient(160deg,#1d4d36,#0a2117)}
.kt-kart.bos span{font-family:var(--fd);font-size:min(16vh,120px);font-weight:800;opacity:.35}
.kt-kart.bekle span{animation:nabiz .45s ease-in-out infinite alternate;opacity:.75}
@keyframes nabiz{to{transform:scale(1.18)}}
.kt-kart.ac{animation:kartAc .8s cubic-bezier(.2,1.25,.4,1)}
@keyframes kartAc{0%{transform:rotateY(95deg) scale(.7);filter:brightness(2.6)}100%{transform:none;filter:none}}
.kt-kart.gidiyor{animation:kartGit .4s ease-in forwards}
@keyframes kartGit{to{transform:translateX(35%) scale(.55);opacity:0}}
.kk-no{font-size:12.5px;font-weight:800;letter-spacing:2.5px;opacity:.9}
.kk-no b{display:block;font-family:var(--fd);font-size:min(7.5vh,56px);line-height:1;color:var(--acc);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.kk-logo .lg{filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.kk-ad{font-family:var(--fd);font-weight:800;font-size:clamp(26px,5.6vh,54px);line-height:1;max-width:100%;overflow:hidden;overflow-wrap:normal;word-break:normal;text-shadow:0 3px 14px rgba(0,0,0,.35)}
.kk-td{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:14px;padding:7px 14px 7px 7px;text-align:left;max-width:100%}
.kk-td img,.kk-td>span{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.15);flex:none}
.kk-td div{min-width:0}
.kk-td small{display:block;font-size:10.5px;opacity:.85;font-weight:800;letter-spacing:1px}
.kk-td b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kk-tamam{font-size:64px;color:var(--acc);line-height:1}
.kk-alt{opacity:.8}
.kt-sag{display:flex;flex-direction:column;min-height:0;max-height:100%}
.kt-sag h3{font-family:var(--fd);font-size:20px;color:var(--acc);margin:0 0 8px}
.kt-slotlar{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:hidden;align-content:start}
.kt-slot{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.25);border-radius:10px;padding:5px 8px;min-height:36px;font-weight:700;font-size:14px;min-width:0}
.kt-slot>b{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:12px;flex:none}
.kt-slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt-slot.dolu{background:rgba(255,255,255,.14);border-style:solid;border-color:rgba(255,255,255,.35)}
.kt-slot.dolu>b{background:var(--acc);color:#2a2100}
.kt-slot.yeni{animation:slotGir .75s cubic-bezier(.2,1.4,.4,1)}
@keyframes slotGir{0%{transform:scale(1.45);box-shadow:0 0 0 7px rgba(244,196,48,.6)}100%{transform:none}}
.kt-fik{align-items:center;justify-content:center;perspective:1200px}
.kf-kart{width:min(740px,100%);max-height:100%;display:flex;flex-direction:column;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:2vh 2.4vw;backdrop-filter:blur(4px)}
.kf-kart.ac{animation:kfGir .5s ease-out}
@keyframes kfGir{from{transform:translateX(70px) rotateY(-14deg);opacity:0}}
.kf-bas{text-align:center;margin-bottom:1.2vh}
.kf-bas span{font-size:12px;letter-spacing:3px;opacity:.7;font-weight:800}
.kf-bas h2{font-family:var(--fd);font-size:clamp(32px,6.5vh,64px);color:var(--acc);line-height:1}
.kf-bas small{opacity:.85}
.kf-liste{display:flex;flex-direction:column;gap:.7vh;overflow:hidden;min-height:0;font-size:clamp(14px,2.4vh,23px)}
.kf-sat{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:.6vh 12px;font-weight:700;font-size:1em;animation:satGir .45s ease-out backwards}
@keyframes satGir{from{transform:translateY(16px) scale(.97);opacity:0}}
.kf-e,.kf-d{display:flex;align-items:center;gap:8px;min-width:0}
.kf-e{justify-content:flex-end}
.kf-ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kf-sat>b{font-family:var(--fd);color:var(--acc);min-width:3.2em;text-align:center}
.kf-bay{display:flex;justify-content:center;align-items:center;gap:6px;opacity:.85;font-size:14px;padding-top:4px;animation:satGir .45s ease-out backwards}
.kf-nok{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:1.4vh}
.kf-nok i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.kf-nok i.gec{background:rgba(244,196,48,.55)}
.kf-nok i.on{background:var(--acc);width:22px;border-radius:5px}
.kt-final{align-items:center;justify-content:center}
.kfin{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.8vh;animation:kYuk .7s ease-out}
.kfin-kupa{font-size:clamp(60px,13vh,130px);line-height:1.25;height:1.25em;margin-bottom:1.2vh;display:flex;align-items:center;justify-content:center;animation:kupa 1.2s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 0 30px rgba(244,196,48,.75))}
@keyframes kupa{from{transform:scale(0) rotate(-30deg)}}
.kfin h1{font-family:var(--fd);font-size:clamp(36px,8.5vh,84px);line-height:1}
.kfin-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kfin-chips span{background:rgba(255,255,255,.13);border-radius:999px;padding:6px 14px;font-weight:700}
.kfin-ilk{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 18px;max-width:100%}
.kfin-ilk small{display:block;opacity:.78;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.kfin-mac{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--fd);font-size:clamp(20px,3.6vh,32px);font-weight:800;flex-wrap:wrap}
.kfin-mac span{display:flex;align-items:center;gap:8px}
.kfin-mac b{color:var(--acc)}
.kfin-btn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.kt-alt{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;opacity:.92}
.kt-alt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.kt-bar{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
.kt-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4c430,#fff3b0);border-radius:5px}
.kt-sesac{position:absolute;z-index:6;left:50%;bottom:calc(44px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#0b3d2a;font-weight:800;font-size:15px;padding:13px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:nabizK 1.6s infinite;white-space:nowrap}
@media (max-aspect-ratio:1/1){
  .kt-canli{display:none}
  .kt-ust img{width:38px;height:38px}
  .kt-ub b{font-size:18px}
  .kt-btn button{width:36px;height:36px;font-size:15px}
  .kt-cek{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr);gap:2.2vh 4vw;align-items:start}
  .kt-sol{grid-column:1;grid-row:1;align-self:center}
  .kt-orta{grid-column:2;grid-row:1}
  .kt-sag{grid-column:1/-1;grid-row:2}
  .kt-torba{width:36vw}
  .kt-kart{width:min(54vw,40vh);padding:10px;gap:.8vh;border-radius:18px}
  .kk-logo .lg{width:min(76px,18vw)!important;height:min(76px,18vw)!important;font-size:min(64px,15vw)!important}
  .kk-ad{font-size:clamp(22px,4vh,40px)}
  .kk-no b{font-size:min(5.5vh,40px)}
  .kk-td{padding:5px 10px 5px 5px;gap:7px}.kk-td img,.kk-td>span{width:32px;height:32px;font-size:18px}.kk-td b{font-size:13px}.kk-td small{font-size:9px}
  .kt-slotlar{grid-template-columns:repeat(3,1fr);gap:5px}
  .kt-slot{font-size:12.5px;padding:4px 6px;min-height:32px;gap:5px}
  .kt-slot .lg{width:20px!important;height:20px!important;font-size:17px!important}
  .kt-sag h3{font-size:17px;margin-bottom:6px}
  .kf-kart{padding:2vh 3.4vw}
  .kf-sat{gap:6px;padding:.6vh 8px}
  .kf-sat .lg{width:24px!important;height:24px!important;font-size:20px!important}
}
.kurabekle .btn,.kfin-btn .btn{color:var(--ink)}
.kurabekle .btn.a,.kfin-btn .btn.a{color:#2a2100}
.kurabekle .inp{color:var(--ink)}
.kfin-btn .btn{min-width:150px}

#tv .tvb.sol{animation:tvsol .35s ease-out}

#tv .tvsk.vs{opacity:.45;background:none}

#tv .tvoad span{display:flex;align-items:center;gap:.3em;font-size:.72em;opacity:.75}
#tv .tvbos{opacity:.6;padding:.6em 0}

  if(ciftDevre){
    const k = turlar.length;
    for(let r=0; r<k; r++) turlar.push({maclar: turlar[r].maclar.map(m=>({ev:m.dep, dep:m.ev})), bay: turlar[r].bay});
  }
  return turlar;
}

function tatilSet(tatiller){
  const s = new Set();
  arr(tatiller).forEach(t=>{
    if(!t || !t.bas) return;
    const d = parseD(t.bas), son = parseD(t.bit || t.bas);
    let g = 0; while(d <= son && g < 400){ s.add(fmtD(d)); d.setDate(d.getDate()+1); g++; }
  });
  return s;
}

function oyunGunleri(basTarih, ayar, adet){
  const ok = new Set(arr(ayar.gunler).map(Number)), tatil = tatilSet(ayar.tatiller), out = [];
  if(!ok.size) return out;
  const d = parseD(basTarih);
  for(let i=0; i<3000 && out.length<adet; i++){
    const wd = d.getDay()===0 ? 7 : d.getDay(), s = fmtD(d);
    if(ok.has(wd) && !tatil.has(s)) out.push(s);
    d.setDate(d.getDate()+1);
  }
  return out;
}

/* Otomatik takvim. bekleyen: [{id,ev,dep}] (tur sırasıyla), dolu: zaten tarihi olan maçlar.
   Kurallar: seçili günler, tatiller hariç, saat dilimleri × saha sayısı, takım günde en fazla N maç,
   bir takımın maçları fikstür sırasını bozmaz. */
function planla(bekleyen, ayar, dolu, basTarih){
  const slotlar = arr(ayar.slotlar).slice().sort();
  const saha = Math.max(1, +ayar.sahaSayisi || 1);
  const gunMax = Math.max(1, +ayar.gunlukMacMax || 1);
  const atama = {}; let yerlesmeyen = 0;
  if(!slotlar.length){ bekleyen.forEach(m=>{ atama[m.id] = {tarih:null, saat:null, saha:null}; }); return {atama, yerlesmeyen:bekleyen.length, son:null, tasan:0}; }
  const kullan = {}, takimGun = {}, takimSon = {}, takimSlot = {};
  const isle = (m, tarih, saat) => {
    const k = tarih+'|'+saat; kullan[k] = (kullan[k]||0)+1;
    [m.ev, m.dep].forEach(t=>{
      takimGun[t+'|'+tarih] = (takimGun[t+'|'+tarih]||0)+1;
      takimSlot[t+'|'+k] = 1;
      if(!takimSon[t] || k > takimSon[t]) takimSon[t] = k;
    });
  };
  dolu.forEach(m=>{ if(m.tarih) isle(m, m.tarih, m.saat||'00:00'); });
  const gunler = oyunGunleri(basTarih, ayar, Math.max(60, bekleyen.length*2 + 40));
  let son = null, tasan = 0;
  for(const m of bekleyen){
    let yer = null;
    for(let gi=0; gi<gunler.length && !yer; gi++){
      const g = gunler[gi];
      if((takimGun[m.ev+'|'+g]||0) >= gunMax || (takimGun[m.dep+'|'+g]||0) >= gunMax) continue;
      for(const s of slotlar){
        const k = g+'|'+s;
        if((kullan[k]||0) >= saha) continue;
        if(takimSlot[m.ev+'|'+k] || takimSlot[m.dep+'|'+k]) continue;
        if((takimSon[m.ev] && k <= takimSon[m.ev]) || (takimSon[m.dep] && k <= takimSon[m.dep])) continue;
        yer = {tarih:g, saat:s, saha:(kullan[k]||0)+1}; break;
      }
    }
    if(yer){ isle(m, yer.tarih, yer.saat); atama[m.id] = yer; if(!son || yer.tarih > son) son = yer.tarih; if(ayar.bitis && yer.tarih > ayar.bitis) tasan++; }
    else { atama[m.id] = {tarih:null, saat:null, saha:null}; yerlesmeyen++; }
  }
  return {atama, yerlesmeyen, son, tasan};
}

const KRITERLER = {
  h2hPuan:'Aralarındaki maçlarda puan',
  h2hAv:'Aralarındaki maçlarda averaj',
  h2hGol:'Aralarındaki maçlarda atılan gol',
  av:'Genel averaj',
  gol:'Atılan gol sayısı',
  galibiyet:'Galibiyet sayısı',
  yg:'Yenilen gol (az olan üstte)'
};
const VARSAYILAN_KRITER = ['h2hPuan','h2hAv','av','gol','galibiyet'];

function istatHesap(ids, maclar, P){
  const set = new Set(ids), s = {};
  ids.forEach(id=>{ s[id] = {id,o:0,g:0,b:0,m:0,ag:0,yg:0,p:0,av:0}; });
  maclar.forEach(m=>{
    if(!set.has(m.ev) || !set.has(m.dep)) return;
    const e = s[m.ev], d = s[m.dep], eg = +m.evGol||0, dg = +m.depGol||0;
    e.o++; d.o++; e.ag+=eg; e.yg+=dg; d.ag+=dg; d.yg+=eg;
    if(eg>dg){ e.g++; d.m++; e.p+=P.g; d.p+=P.m; }
    else if(eg<dg){ d.g++; e.m++; d.p+=P.g; e.p+=P.m; }
    else { e.b++; d.b++; e.p+=P.b; d.p+=P.b; }
  });
  Object.values(s).forEach(x=>{ x.av = x.ag - x.yg; });
  return s;
}

/* Süper Lig tipi sıralama: önce puan, eşitlikte seçili kriterler sırayla (ikili kriterler yalnızca eşit takımlar arasında). */
function siralamaHesap(T){
  const ay = T.ayar || {};
  const P = {g:+(ay.puanG ?? 3), b:+(ay.puanB ?? 1), m:+(ay.puanM ?? 0)};
  const ids = Object.keys(T.takimlar || {});
  const oyn = Object.values(T.maclar || {}).filter(m=>m.durum==='bitti' || m.durum==='hukmen');
  const genel = istatHesap(ids, oyn, P);
  const kr = ['puan', ...arr(ay.kriterler || VARSAYILAN_KRITER).filter(k=>KRITERLER[k])];
  const ad = id => (T.takimlar[id] && T.takimlar[id].ad) || '';
  function sirala(grup, k){
    if(grup.length <= 1) return grup;
    if(k >= kr.length) return [...grup].sort((a,b)=>ad(a).localeCompare(ad(b),'tr'));
    const c = kr[k]; let deger;
    if(c.startsWith('h2h')){
      const mini = istatHesap(grup, oyn, P);
      deger = id => c==='h2hPuan' ? mini[id].p : c==='h2hAv' ? mini[id].av : mini[id].ag;
    } else {
      deger = id => { const x = genel[id]; return c==='puan'?x.p : c==='av'?x.av : c==='gol'?x.ag : c==='galibiyet'?x.g : c==='yg'?-x.yg : 0; };
    }
    const v = grup.map(id=>({id, v:deger(id)})).sort((a,b)=>b.v-a.v), out = [];
    let i = 0;
    while(i < v.length){
      let j = i; while(j < v.length && v[j].v === v[i].v) j++;
      const alt = v.slice(i,j).map(x=>x.id);
      out.push(...(alt.length>1 ? sirala(alt, k+1) : alt));
      i = j;
    }
    return out;
  }
  const sira = sirala(ids, 0);
  const sirali = oyn.slice().sort((a,b)=>((a.tarih||'')+(a.saat||'')+String(a.sira||0).padStart(4,'0')).localeCompare((b.tarih||'')+(b.saat||'')+String(b.sira||0).padStart(4,'0')));
  const form = {}; ids.forEach(id=>form[id]=[]);
  sirali.forEach(m=>{
    const eg = +m.evGol||0, dg = +m.depGol||0;
    if(form[m.ev]) form[m.ev].push(eg>dg?'G':eg<dg?'M':'B');
    if(form[m.dep]) form[m.dep].push(dg>eg?'G':dg<eg?'M':'B');
  });
  return sira.map(id=>({...genel[id], form: form[id].slice(-5)}));
}

/* ===================== ELEME / GRUPLAR + ELEME ===================== */
const USUL_AD = {lig:'Lig usulü', eleme:'Eleme usulü', grup:'Gruplar + eleme'};
const GRUP_HARF = 'ABCDEFGH';
function usulOf(T){ return (T && T.ayar && T.ayar.usul) || 'lig'; }
function ikiKuvvet(n){ let p = 1; while(p < n) p *= 2; return p; }
/* Standart ağaç yerleşimi: 1 ile en zayıf tohum en uzak noktalarda karşılaşır */
function tohumSira(P){ let a = [1]; while(a.length < P){ const m = a.length*2 + 1; a = a.flatMap(x=>[x, m - x]); } return a; }
function turAdiSay(k){ return k===2 ? 'Final' : k===4 ? 'Yarı Final' : k===8 ? 'Çeyrek Final' : 'Son ' + k; }
function grupDagit(ids, G){ const g = Array.from({length:G}, ()=>[]); ids.forEach((id, i)=>{ const r = Math.floor(i/G), k = i%G; g[r%2 ? G-1-k : k].push(id); }); return g; }
function grupLimit(n, a){
  const G = Math.max(2, Math.min(8, Math.floor(n/2), +a.grupSayisi || 2));
  const enAz = Math.floor(n/G), c = Math.max(1, Math.min(enAz, +a.grupCikan || 2));
  return {G, c, enAz};
}
/* Gruplardan çıkanların tohum sırası: 1.ler önde; 2.ler komşu grubun 1.si ile eşleşecek şekilde */
function grupGirenler(G, c){
  const L = i => GRUP_HARF[i], es = g => G % 2 === 0 ? (g ^ 1) : (g + 1) % G;
  const s = new Array(G*c);
  for(let g=0; g<G; g++) s[g] = `g:${L(g)}:1`;
  if(c >= 2) for(let k=0; k<G; k++) s[2*G - 1 - k] = `g:${L(es(k))}:2`;
  for(let p=3; p<=c; p++) for(let k=0; k<G; k++) s[(p-1)*G + k] = `g:${L(p%2 ? k : G-1-k)}:${p}`;
  return s;
}
/* Ağaç: girenler tohum sırasına göre kaynak listesi ('tk:id' veya 'g:A:1') */
function agacUret(girenler, a, turBas){
  const n = girenler.length, P = ikiKuvvet(Math.max(2, n)), R = Math.round(Math.log2(P)), ts = tohumSira(P);
  const esler = [], baylar = [];
  let kaynak = []; // bu turdaki her konumun kaynağı
  for(let i=0; i<P; i++) kaynak.push(ts[i] <= n ? girenler[ts[i]-1] : null);
  const bayVar = n < P, iki = +a.elemeMac === 2;
  for(let r=1; r<=R; r++){
    const say = P / 2**(r-1), sonraki = [];
    const tad = (r===1 && bayVar) ? '1. Tur' : turAdiSay(say);
    for(let j=0; j<say/2; j++){
      const A = kaynak[2*j], B = kaynak[2*j+1];
      if(!A || !B){ const x = A || B; sonraki.push(x); if(r===1 && x && x.startsWith('tk:')) baylar.push(x.slice(3)); continue; }
      const key = `e${r}-${j}`, fin = say===2;
      esler.push({key, tur:turBas + r - 1, slot:j, ev:A, dep:B, tad, tek: !iki || (fin && a.finalTek !== false)});
      sonraki.push('k:' + key);
    }
    kaynak = sonraki;
  }
  if(a.ucunculuk && R >= 2){
    const yari = esler.filter(e=>e.tur === turBas + R - 2);
    if(yari.length === 2) esler.push({key:'u3', tur:turBas + R - 1, slot:1, ev:'y:' + yari[0].key, dep:'y:' + yari[1].key, tad:'Üçüncülük Maçı', tek:true});
  }
  return {esler, baylar, R};
}
/* Tüm usuller için fikstür: {maclar, baylar, gruplar} */
function fiksturKur(sira, a){
  const u = a.usul || 'lig', maclar = {}, baylar = {}; let s = 0, gruplar = null;
  const ekle = o => { const id = 'm' + String(++s).padStart(3, '0'); maclar[id] = {durum:'planli', evGol:0, depGol:0, sira:s, ...o}; return id; };
  if(u === 'lig'){
    fiksturUret(sira, a.ligDevre===2, false).forEach((tr, ri)=>{ if(tr.bay) baylar['t'+(ri+1)] = tr.bay; tr.maclar.forEach(m=>ekle({tur:ri+1, ev:m.ev, dep:m.dep})); });
    return {maclar, baylar, gruplar};
  }
  let girenler, turBas = 1;
  if(u === 'grup'){
    const {G, c} = grupLimit(sira.length, a), gr = grupDagit(sira, G);
    gruplar = {}; gr.forEach((ids, gi)=>{ gruplar[GRUP_HARF[gi]] = ids; });
    const grT = gr.map(ids=>fiksturUret(ids, a.ligDevre===2, false)), R = Math.max(...grT.map(t=>t.length));
    for(let r=0; r<R; r++) gr.forEach((ids, gi)=>{ const tr = grT[gi][r]; if(!tr) return;
      if(tr.bay) (baylar['t'+(r+1)] = baylar['t'+(r+1)] || []).push(tr.bay);
      tr.maclar.forEach(m=>ekle({tur:r+1, asama:'grup', grup:GRUP_HARF[gi], ev:m.ev, dep:m.dep})); });
    girenler = grupGirenler(G, c); turBas = R + 1;
  } else girenler = sira.map(id=>'tk:' + id);
  const ag = agacUret(girenler, a, turBas);
  if(ag.baylar.length) baylar['t' + turBas] = ag.baylar;
  const coz = k => k && k.startsWith('tk:') ? k.slice(3) : null;
  const sirali = ag.esler.slice().sort((x, y)=>x.tur - y.tur || (x.key==='u3' ? -1 : y.key==='u3' ? 1 : x.slot - y.slot));
  const turlar = [...new Set(sirali.map(e=>e.tur))];
  turlar.forEach(t=>{
    const bu = sirali.filter(e=>e.tur===t);
    bu.forEach(e=>ekle({tur:e.tur, asama:'eleme', es:e.key, tad:e.tad, ...(e.tek ? {} : {bacak:1}), evK:e.ev, depK:e.dep, ev:coz(e.ev), dep:coz(e.dep)}));
    bu.filter(e=>!e.tek).forEach(e=>ekle({tur:e.tur, asama:'eleme', es:e.key, tad:e.tad, bacak:2, evK:e.dep, depK:e.ev, ev:coz(e.dep), dep:coz(e.ev)}));
  });
  return {maclar, baylar, gruplar};
}
/* Eleme turlarını sırayla planlar: her tur/bacak önceki turun son gününden sonra başlar */
function planAdim(m){ return m.asama === 'eleme' ? m.tur*10 + (m.bacak || 1) : 0; }
function planlaAkilli(bek, a, dolu, bas){
  if(!bek.some(m=>m.asama === 'eleme')) return planla(bek, a, dolu, bas);
  const out = {atama:{}, yerlesmeyen:0, son:null, tasan:0}, d = dolu.slice();
  const ekle = (lst, p) => { Object.assign(out.atama, p.atama); out.yerlesmeyen += p.yerlesmeyen; out.tasan += p.tasan; if(p.son && (!out.son || p.son > out.son)) out.son = p.son; lst.forEach(m=>d.push({...m, ...p.atama[m.id]})); };
  const on = bek.filter(m=>m.asama !== 'eleme');
  if(on.length) ekle(on, planla(on, a, d.filter(m=>m.ev && m.dep), bas));
  const adim = {}; bek.filter(m=>m.asama === 'eleme').forEach(m=>{ const k = planAdim(m); (adim[k] = adim[k] || []).push(m); });
  Object.keys(adim).map(Number).sort((x, y)=>x - y).forEach(k=>{
    let st = null; d.forEach(m=>{ if(m.tarih && planAdim(m) < k && (!st || m.tarih > st)) st = m.tarih; });
    const b = st && gunEkle(st, 1) > bas ? gunEkle(st, 1) : bas;
    const lst = adim[k].map(m=>({...m, ev:m.ev || m.id + '_e', dep:m.dep || m.id + '_d'}));
    ekle(adim[k], planla(lst, a, [], b));
  });
  return out;
}
/* Eşleşme sonuçları (tek maç ya da iki maç toplamı; beraberlikte yöneticinin seçtiği takım) */
function esSonuclari(T){
  const g = {}, out = {};
  Object.values(T.maclar || {}).forEach(m=>{ if(m.es) (g[m.es] = g[m.es] || []).push(m); });
  Object.entries(g).forEach(([k, ms])=>{
    ms.sort((x, y)=>(x.bacak || 1) - (y.bacak || 1));
    const A = ms[0].ev || null, B = ms[0].dep || null, r = {A, B, a:0, b:0, oynanan:0, bitti:false, kaz:null, kyb:null, berabere:false, ms};
    ms.forEach(m=>{ if(!(m.durum==='bitti' || m.durum==='hukmen' || m.durum==='canli')) return; r.oynanan++;
      const eg = +m.evGol || 0, dg = +m.depGol || 0; if(m.ev === A){ r.a += eg; r.b += dg; } else { r.a += dg; r.b += eg; } });
    if(A && B && ms.every(m=>m.durum==='bitti' || m.durum==='hukmen')){
      let kaz = r.a > r.b ? A : r.b > r.a ? B : null;
      const son = ms[ms.length-1];
      if(!kaz && (son.kazanan === A || son.kazanan === B)) kaz = son.kazanan;
      if(kaz){ r.bitti = true; r.kaz = kaz; r.kyb = kaz === A ? B : A; } else r.berabere = true;
    }
    out[k] = r;
  });
  return out;
}
function grupTablo(T, g){
  const ids = arr((T.gruplar || {})[g]), tk = {}; ids.forEach(id=>{ if(T.takimlar[id]) tk[id] = T.takimlar[id]; });
  const ms = {}; Object.entries(T.maclar || {}).forEach(([id, m])=>{ if(m.asama === 'grup' && m.grup === g) ms[id] = m; });
  return {sira: siralamaHesap({ayar:T.ayar, takimlar:tk, maclar:ms}), bitti: Object.values(ms).length > 0 && Object.values(ms).every(m=>m.durum==='bitti' || m.durum==='hukmen')};
}
/* Sonuçlara göre sonraki turların takımlarını doldurur; değişen eşleşmelerin eski sonuçlarını temizler */
function elemeIlerlet(T){
  if(usulOf(T) === 'lig') return {};
  const K = {maclar: kopya(T.maclar || {}), gruplar: T.gruplar, takimlar: T.takimlar, ayar: T.ayar}, up = {};
  for(let tur=0; tur<12; tur++){
    const es = esSonuclari(K), gc = {};
    const gs = g => gc[g] !== undefined ? gc[g] : (gc[g] = (()=>{ const x = grupTablo(K, g); return x.bitti ? x.sira.map(s=>s.id) : null; })());
    const coz = k => { if(!k) return null; const [t, x, y] = k.split(':');
      if(t === 'tk') return x; if(t === 'k') return (es[x] && es[x].kaz) || null; if(t === 'y') return (es[x] && es[x].kyb) || null;
      if(t === 'g'){ const l = gs(x); return (l && l[+y-1]) || null; } return null; };
    let degisti = false;
    Object.values(K.maclar).forEach(m=>{
      if(m.asama !== 'eleme') return;
      const ev = coz(m.evK), dep = coz(m.depK);
      if((m.ev || null) === ev && (m.dep || null) === dep) return;
      degisti = true; m.ev = ev; m.dep = dep;
      up[`maclar/${m.id}/ev`] = ev; up[`maclar/${m.id}/dep`] = dep;
      if(m.durum === 'bitti' || m.durum === 'hukmen' || m.kazanan){
        Object.assign(m, {durum: m.tarih ? 'planli' : 'ertelendi', evGol:0, depGol:0, kazanan:null});
        Object.assign(up, {[`maclar/${m.id}/durum`]:m.durum, [`maclar/${m.id}/evGol`]:0, [`maclar/${m.id}/depGol`]:0, [`maclar/${m.id}/olaylar`]:null, [`maclar/${m.id}/mvp`]:null, [`maclar/${m.id}/kazanan`]:null, [`maclar/${m.id}/kNot`]:null});
      }
    });
    if(!degisti) break;
  }
  return up;
}
function fiksturHazirla(sira, a, bas){
  const f = fiksturKur(sira, a);
  const bek = Object.entries(f.maclar).map(([id, m])=>({id, ev:m.ev, dep:m.dep, tur:m.tur, bacak:m.bacak, asama:m.asama}));
  const p = planlaAkilli(bek, a, [], bas);
  Object.entries(p.atama).forEach(([id, x])=>{ Object.assign(f.maclar[id], x); if(!x.tarih) f.maclar[id].durum = 'ertelendi'; });
  f.plan = p; return f;
}
function sampiyonId(T){
  if(usulOf(T) === 'lig'){
    const ms = Object.values(T.maclar || {}); if(!ms.length || !ms.every(m=>m.durum==='bitti' || m.durum==='hukmen')) return null;
    const s = siralamaHesap(T)[0]; return s ? s.id : null;
  }
  const es = esSonuclari(T), fin = Object.values(T.maclar || {}).filter(m=>m.asama === 'eleme' && m.es !== 'u3').sort((x, y)=>y.tur - x.tur)[0];
  return fin && es[fin.es] && es[fin.es].kaz || null;
}

const GUN_AD = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];

const Store = {
  mod:'yerel', db:null, auth:null, user:null, dinle:{},
  init(){
    if(FIREBASE_CONFIG && window.firebase){
      try{
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.database(); this.auth = firebase.auth(); this.mod = 'bulut';
        this.auth.onAuthStateChanged(u=>{ this.user = u; render(); });
        this.db.ref('.info/serverTimeOffset').on('value', sn=>{ sunucuFark = sn.val() || 0; });
      }catch(e){ console.error(e); this.mod = 'yerel'; }
    }
  },
  _ld(){ try{ return JSON.parse(localStorage.getItem('tm_veri') || '{}'); }catch(e){ return {}; } },
  _get(o,p){ return p.split('/').filter(Boolean).reduce((a,k)=>a==null?undefined:a[k], o); },
  _set(o,p,v){
    const k = p.split('/').filter(Boolean); let a = o;
    for(let i=0;i<k.length-1;i++){ if(typeof a[k[i]]!=='object' || a[k[i]]===null) a[k[i]] = {}; a = a[k[i]]; }
    if(v===null || v===undefined) delete a[k[k.length-1]]; else a[k[k.length-1]] = kopya(v);
  },
  _yay(){ const d = this._ld(); Object.values(this.dinle).forEach(x=>{ if(x.p!==undefined) x.cb(this._get(d,x.p) ?? null); }); },
  on(p, cb){
    const id = uid();
    if(this.mod==='bulut'){
      const ref = this.db.ref(KOK+'/'+p), f = s=>cb(s.val());
      ref.on('value', f, e=>{ console.error(e); toast('Veri okunamadı: '+e.message); });
      this.dinle[id] = {off:()=>ref.off('value', f)};
    } else {
      this.dinle[id] = {p, cb};
      setTimeout(()=>cb(this._get(this._ld(), p) ?? null));
    }
    return ()=>{ const x = this.dinle[id]; if(x && x.off) x.off(); delete this.dinle[id]; };
  },
  async update(obj){
    if(this.mod==='bulut'){
      const o = {}; for(const k in obj) o[k] = obj[k]==null ? null : kopya(obj[k]);
      try{ await this.db.ref(KOK).update(o); }
      catch(e){ toast(e.code==='PERMISSION_DENIED' ? 'Kaydedilemedi: yönetici girişi gerekli' : 'Kaydedilemedi: '+e.message); throw e; }
      return;
    }
    const d = this._ld(); for(const k in obj) this._set(d, k, obj[k]);
    try{ localStorage.setItem('tm_veri', JSON.stringify(d)); }catch(e){ toast('Yerel kayıt başarısız: depolama dolu olabilir'); }
    this._yay();
  },
  set(p, v){ return this.update({[p]:v}); },
  async oku(p){
    if(this.mod==='bulut'){ const sn = await this.db.ref(KOK + (p ? '/'+p : '')).once('value'); return sn.val(); }
    const d = this._ld(); return p ? (this._get(d, p) ?? null) : d;
  }
};

function turnuvaAc(tid){
  if(tOff) tOff(); tOff = null;
  S.tid = tid; S.T = null; S.fTur = null; S.fTakim = ''; A = null;
  try{ localStorage.setItem('tm_son', tid || ''); }catch(e){}
  if(!tid){ render(); return; }
  tOff = Store.on('t/'+tid, v=>{
    S.T = v ? normT(v) : null;
    if(!v && S.tid===tid){
      if(tOff) tOff(); tOff = null; S.tid = null;
      if(URLP.get('t')===tid){ URLP.delete('t'); toast('Bağlantıdaki turnuva bulunamadı'); }
      secimYap();
    }
    yenile();
  });
  render();
}
function normT(v){
  v.ayar = v.ayar || {}; v.takimlar = v.takimlar || {}; v.maclar = v.maclar || {}; v.baylar = v.baylar || {};
  if(v.gruplar){ const g = {}; Object.entries(v.gruplar).forEach(([k, x])=>{ g[k] = arr(x); }); v.gruplar = g; }
  const a = v.ayar;
  a.slotlar = arr(a.slotlar); a.gunler = arr(a.gunler).map(Number); a.tatiller = arr(a.tatiller);
  a.kriterler = a.kriterler ? arr(a.kriterler) : VARSAYILAN_KRITER.slice();
  Object.entries(v.takimlar).forEach(([id,t])=>{ t.id = id; t.oyuncular = t.oyuncular || {}; Object.entries(t.oyuncular).forEach(([pid,p])=>p.id=pid); });
  Object.entries(v.maclar).forEach(([id,m])=>{ m.id = id; m.olaylar = arr(m.olaylar); });
  return v;
}
function secimYap(){
  if(S.tid) return;
  const p = URLP.get('t');
  if(p){ turnuvaAc(p); return; }
  if(!S.listeGeldi || S.aktif===undefined) return;
  let son = null; try{ son = localStorage.getItem('tm_son'); }catch(e){}
  const keys = Object.keys(S.liste).sort((a,b)=>(S.liste[b].olusturma||0)-(S.liste[a].olusturma||0));
  const c = (son && S.liste[son]) ? son : (S.aktif && S.liste[S.aktif]) ? S.aktif : keys[0];
  if(c) turnuvaAc(c); else render();
}
function yenile(){
  const ae = document.activeElement;
  if(ae && $('#main').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) bekleyenRender = true;
  else render();
  if(canliId) canliRender();

  if($('#tv').classList.contains('ac')) tvRender();
  kuraKontrol();

    if(k.length){ ilerletIsl = true; const u2 = {}; k.forEach(x=>u2[tp(x)] = up[x]); Store.update(u2).catch(()=>{}).finally(()=>{ ilerletIsl = false; }); }
  }
}

const SIRA_EK = {1:'si', 2:'si', 3:'sü', 4:'sü', 5:'si', 6:'sı', 7:'si', 8:'si'};
function esBilgi(key){
  const ms = Object.values(S.T.maclar), m = ms.find(x=>x.es===key); if(!m) return {tad:'?', no:0};
  const ayni = [...new Set(ms.filter(x=>x.es && x.tad===m.tad && x.es!=='u3').map(x=>x.es))].sort((a, b)=>+a.split('-')[1] - +b.split('-')[1]);
  return {tad:m.tad, no: ayni.length > 1 ? ayni.indexOf(key) + 1 : 0};
}
function kaynakAd(k){
  if(!k) return 'Belli değil';
  const [t, x, y] = k.split(':');
  if(t==='tk') return takim(x).ad;
  if(t==='g') return `${x} Grubu ${y}.${SIRA_EK[y] || 'si'}`;
  const b = esBilgi(x); return `${b.tad}${b.no ? ' ' + b.no : ''} ${t==='y' ? 'mağlubu' : 'galibi'}`;
}
function mTk(m, yan){ const id = m[yan]; if(id) return takim(id); return {ad:kaynakAd(m[yan+'K']), logo:'❔', renk:'#94a3b8', oyuncular:{}, bos:true}; }
function turEtiket(m){
  if(m.asama==='eleme') return m.tad + (m.bacak ? ` · ${m.bacak}. maç` : '');
  if(m.asama==='grup') return `${m.grup} Grubu · ${m.tur}. Tur`;
  return `${m.tur}. Tur`;
}
function usulMetin(a, n){
  const u = a.usul || 'lig';
  if(u==='eleme') return 'eleme usulü' + (+a.elemeMac===2 ? ' (rövanşlı)' : '');
  if(u==='grup') return `${grupLimit(n, a).G} grup + eleme`;
  return `${a.ligDevre===2 ? 'çift' : 'tek'} devre lig usulü`;

function macListe(){

    const ka = (a.tarih||'9999-99-99')+(a.saat||'99:99')+String(a.sira||0).padStart(4,'0');
    const kb = (b.tarih||'9999-99-99')+(b.saat||'99:99')+String(b.sira||0).padStart(4,'0');
    return ka.localeCompare(kb);
  });

function oyuncuAd(p){
  if(!p) return 'Belirtilmemiş';
  const ad = (p.ad||'').trim();
  if(yonetici() || S.T.ayar.soyadKisalt===false) return ad;
  const parca = ad.split(/\s+/);
  if(parca.length < 2) return ad;
  return parca.slice(0,-1).join(' ')+' '+parca[parca.length-1][0].toLocaleUpperCase('tr')+'.';
}
function oyuncu(tkId, pid){ const t = S.T.takimlar[tkId]; return t && t.oyuncular[pid]; }
function logo(t, size=30){
  const fs = Math.round(size*.84);
  if(t.bos) return `<span class="lg lgbos" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.5)}px">?</span>`;
  if(t.logoImg) return `<span class="lg" style="width:${size}px;height:${size}px"><img src="${t.logoImg}" alt=""></span>`;
  return `<span class="lg" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(t.logo||'⚽')}</span>`;
}
function golcuListesi(){
  const g = {};
  Object.values(S.T.maclar).forEach(m=>{
    if(!(oynandi(m) || m.durum==='canli')) return;
    m.olaylar.forEach(o=>{
      if(o.t!=='g' || !o.p || !oyuncu(o.tk, o.p)) return;
      const k = o.tk+'|'+o.p; g[k] = g[k] || {tk:o.tk, p:o.p, gol:0}; g[k].gol++;
    });
  });
  return Object.values(g).sort((a,b)=>b.gol-a.gol || oyuncu(a.tk,a.p).ad.localeCompare(oyuncu(b.tk,b.p).ad,'tr'));
}
function mvpListesi(){
  const g = {};
  Object.values(S.T.maclar).forEach(m=>{ if(m.mvp && m.mvp.p && oyuncu(m.mvp.tk, m.mvp.p)){ const k = m.mvp.tk+'|'+m.mvp.p; g[k] = g[k] || {tk:m.mvp.tk, p:m.mvp.p, n:0}; g[k].n++; } });
  return Object.values(g).sort((a,b)=>b.n-a.n);
}
function oyuncuIstat(tk, pid){
  let gol = 0, mvp = 0;
  Object.values(S.T.maclar).forEach(m=>{
    if(oynandi(m) || m.durum==='canli') m.olaylar.forEach(o=>{ if(o.t==='g' && o.tk===tk && o.p===pid) gol++; });
    if(m.mvp && m.mvp.tk===tk && m.mvp.p===pid) mvp++;
  });
  const mac = Object.values(S.T.maclar).filter(m=>oynandi(m) && (m.ev===tk || m.dep===tk)).length;
  const rt = Math.min(99, 60 + gol*3 + mvp*5);
  return {gol, mvp, mac, rt, tier: rt>=80 ? 'altin' : rt>=70 ? 'gumus' : 'bronz'};
}

}

function macKart(m, opt={}){
  const e = mTk(m,'ev'), d = mTk(m,'dep'), oyn = oynandi(m) || m.durum==='canli';
  const eg = +m.evGol||0, dg = +m.depGol||0;

function bugunHtml(){

function esKutu(key, es){
  const r = es[key]; if(!r) return '';
  const m0 = r.ms[0], A = mTk(m0,'ev'), B = mTk(m0,'dep'), oyn = r.oynanan > 0;
  const hedef = (r.ms.find(m=>!oynandi(m)) || r.ms[r.ms.length-1]).id;
  const kA = r.kaz ? (r.kaz===r.A ? 'kaz' : 'kyb') : '', kB = r.kaz ? (r.kaz===r.B ? 'kaz' : 'kyb') : '';
  const sat = (t, sk, k) => `<div class="ag-t ${k}${t.bos?' bos':''}">${logo(t,20)}<span>${esc(t.ad)}</span><b>${oyn ? sk : ''}</b></div>`;
  const tarih = r.ms.map(m=>m.tarih).find(Boolean), canli = r.ms.some(m=>m.durum==='canli');
  let alt = canli ? '<i class="ag-cn">● Canlı</i>' : r.kaz && r.a===r.b ? esc(r.ms[r.ms.length-1].kNot || 'Beraberlikte belirlendi') : r.berabere ? '<i class="ag-uy">Kazanan seçilmedi</i>' : tarih && !r.kaz ? esc(tarih.split('-').reverse().slice(0,2).join('.') + (m0.saat ? ' · ' + m0.saat : '')) : '';
  if(r.ms.length > 1) alt += (alt ? ' · ' : '') + '2 maç';
  return `<button class="ag-es${r.kaz?' bitti':''}" onclick="macDetay('${hedef}')">${sat(A, r.a, kA)}${sat(B, r.b, kB)}${alt ? `<small>${alt}</small>` : ''}</button>`;
}
function sonrakiEs(key){
  const m = Object.values(S.T.maclar).find(x=>x.evK==='k:'+key || x.depK==='k:'+key);
  if(!m) return null; const b = esBilgi(m.es); return b.tad + (b.no ? ' ' + b.no : '');
}
function esKart(key, es, i, son){
  const r = es[key]; if(!r) return '';
  const m0 = r.ms[0], A = mTk(m0,'ev'), B = mTk(m0,'dep'), oyn = r.oynanan > 0, canli = r.ms.some(m=>m.durum==='canli');
  const hedef = (r.ms.find(m=>!oynandi(m)) || r.ms[r.ms.length-1]).id;
  const mz = r.ms.find(m=>!oynandi(m) && m.tarih) || r.ms.find(m=>m.tarih);
  const zaman = mz ? `${tarihYaz(mz.tarih)}${mz.saat ? ' · ' + mz.saat : ''}` : 'Tarih yok';
  const durum = canli ? '<span class="badge live">Canlı</span>' : r.kaz ? '<span class="badge">Bitti</span>' : r.berabere ? '<span class="badge er">Kazanan seçilecek</span>' : '';
  const sat = (t, sk, ben) => { const k = r.kaz ? (r.kaz===ben ? 'kaz' : 'kyb') : '';
    return `<div class="akt ${k}${t.bos ? ' bos' : ''}">${logo(t,28)}<span class="akad">${esc(t.ad)}</span>${k==='kaz' ? '<i class="akw">✓</i>' : ''}<b>${oyn ? sk : ''}</b></div>`; };
  const bacak = r.ms.length > 1 ? r.ms.map(m=>`${m.bacak}. maç ${oynandi(m) || m.durum==='canli' ? `<b>${m.ev===r.A ? m.evGol+'-'+m.depGol : m.depGol+'-'+m.evGol}</b>` : (m.tarih ? m.tarih.split('-').reverse().slice(0,2).join('.') : '—')}`).join(' · ') : '';
  const not = r.kaz && r.a===r.b ? esc(r.ms[r.ms.length-1].kNot || 'Beraberlikte belirlendi') : '';
  const nx = key==='u3' ? '' : son ? '🏆 Galibi şampiyon' : (x => x ? `Galibi → ${esc(x)}` : '')(sonrakiEs(key));
  const alt = [bacak, not, nx].filter(Boolean).join('<i>·</i>');
  return `<button class="ak${r.kaz ? ' bitti' : ''}${son ? ' fin' : ''}${key==='u3' ? ' u3' : ''}" onclick="macDetay('${hedef}')">
    <div class="akh"><span class="akn">${key==='u3' ? '🥉 ÜÇÜNCÜLÜK' : son ? '🏆 FİNAL' : 'MAÇ ' + (i+1)}</span><span class="akz">${esc(zaman)}</span>${durum}</div>
    ${sat(A, r.a, r.A)}${sat(B, r.b, r.B)}${alt ? `<div class="akf">${alt}</div>` : ''}</button>`;

function agacHtml(opt={}){
  const T = S.T, el = Object.values(T.maclar).filter(m=>m.asama==='eleme'); if(!el.length) return '';
  const es = esSonuclari(T), R = Math.max(...el.filter(m=>m.es!=='u3').map(m=>+m.es.slice(1).split('-')[0]));
  const sp = sampiyonId(T), u3 = es.u3;
  const tadR = r => (el.find(m=>m.es && m.es.startsWith(`e${r}-`)) || {}).tad || '';
  const keys = r => Object.keys(es).filter(k=>k.startsWith(`e${r}-`)).sort((a, b)=>+a.split('-')[1] - +b.split('-')[1]);
  const spHtml = sp ? `<div class="ag-sp">${logo(takim(sp),44)}<div><small>ŞAMPİYON</small><b>${esc(takim(sp).ad)}</b></div><span>🏆</span></div>` : '';
  const bayHucre = (r, j) => { const ust = es[`e${r+1}-${Math.floor(j/2)}`], m0 = ust && ust.ms[0], yan = j%2 ? 'dep' : 'ev', src = m0 && m0[yan+'K'];
    return src && !src.startsWith('k:') ? mTk(m0, yan) : null; };
  const mod = opt.mod || S.agMod || (window.innerWidth <= 600 ? 'tur' : 'agac');
  if(mod === 'tur'){
    const aktif = (()=>{ for(let r=1; r<=R; r++) if(keys(r).some(k=>!es[k].kaz)) return r; return R; })();
    const sec = Math.min(R, S.agTur || aktif);
    const step = Array.from({length:R}, (_, i)=>i+1).map(r=>{ const ks = keys(r), b = ks.filter(k=>es[k].kaz).length, tam = ks.length && b===ks.length;
      return `<button class="ags${r===sec ? ' on' : ''}${tam ? ' tam' : ''}" onclick="S.agTur=${r};render()"><b>${esc(tadR(r))}</b><small>${tam ? '✓ Tamamlandı' : `${b}/${ks.length} eşleşme`}</small></button>`; }).join('<i class="agok">›</i>');
    const ks = keys(sec), tarihler = ks.flatMap(k=>es[k].ms.map(m=>m.tarih)).filter(Boolean).sort();
    const baylar = []; for(let j=0; j<2**(R-sec); j++) if(!es[`e${sec}-${j}`]){ const t = bayHucre(sec, j); if(t) baylar.push(t); }
    const kartlar = ks.map((k, i)=>esKart(k, es, i, sec===R)).join('') + (u3 && sec===R ? esKart('u3', es, 0, false) : '');
    return `${spHtml}<div class="agstep">${step}</div>
      <div class="aghd"><div><h3>${esc(tadR(sec))}</h3><small>${ks.length} eşleşme${baylar.length ? ` · ${baylar.length} bay` : ''}${tarihler.length ? ` · ${tarihYaz(tarihler[0])}${tarihler.length > 1 && tarihler[tarihler.length-1] !== tarihler[0] ? ' – ' + tarihYaz(tarihler[tarihler.length-1]) : ''}` : ''}</small></div></div>
      ${baylar.length ? `<div class="agbay"><span>Bay geçenler</span>${baylar.map(t=>`<span class="agbc">${logo(t,20)}${esc(t.ad)}</span>`).join('')}<small>Doğrudan ${esc(tadR(sec+1))} turuna çıkar</small></div>` : ''}
      <div class="akgrid">${kartlar}</div>`;
  }
  let cols = '';
  for(let r=1; r<=R; r++){
    const cells = [];
    for(let j=0; j<2**(R-r); j++){
      const key = `e${r}-${j}`;
      if(es[key]){ cells.push(esKutu(key, es)); continue; }
      const t = bayHucre(r, j);
      cells.push(t ? `<div class="ag-es ag-bay"><div class="ag-t${t.bos?' bos':''}">${logo(t,20)}<span>${esc(t.ad)}</span></div><small>Bay · doğrudan üst tur</small></div>` : `<div class="ag-es ag-bos"></div>`);
    }
    cols += `<div class="ag-tur ${r===R?'fin':''}"><h3>${esc(tadR(r))}</h3><div class="ag-h">${cells.join('')}</div></div>`;
  }
  return `${spHtml}<div class="agac">${cols}</div>
    ${u3 ? `<div class="sec"><h2>Üçüncülük Maçı</h2></div><div class="ag-u3">${esKutu('u3', es)}</div>` : ''}`;
}

  const secenek = Object.values(S.T.takimlar).sort((a,b)=>(a.sira||0)-(b.sira||0)).map(t=>`<option value="${t.id}" ${tk===t.id?'selected':''}>${esc(t.ad)}</option>`).join('');

  if(S.fMod==='tur' && !tk){
    h += `<div class="chips">${Array.from({length:turSay},(_,i)=>i+1).map(t=>`<button class="chip ${S.fTur===t?'on':''}" onclick="S.fTur=${t};render()">${esc(turAdi(t))}</button>`).join('')}</div>`;
    const tm = ms.filter(m=>m.tur===S.fTur);
    const bay = bayListe(S.fTur), elemeTur = tm.some(m=>m.asama==='eleme');
    const yari = usul()==='lig' && S.T.ayar.ligDevre===2 && turSay>1 ? (S.fTur > turSay/2 ? 'İkinci yarı' : 'İlk yarı') : tm[0] && tm[0].asama==='grup' ? 'Grup maçları' : '';

function takimGridStil(n, cMin, hMax){
  if(window.innerWidth > 600 || !n) return '';
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const hd = ($('#hdr') || {}).offsetHeight || 46, nv = ($('#nav') || {}).offsetHeight || 60;
  const H = vh - hd - nv - 74, W = window.innerWidth - 20, G = 5;
  let sec = null;
  for(const c of [3, 4, 5, 6]){
    if(cMin && c < cMin) continue;
    const r = Math.ceil(n / c), h = Math.floor((H - (r - 1) * G) / r), w = (W - (c - 1) * G) / c;
    const minH = c === 3 ? 78 : c === 4 ? 70 : c === 5 ? 62 : 54;
    sec = {c, h:Math.min(h, Math.round(w * 1.3), 150, hMax || 999), w};
    if(h >= minH) break;
  }
  const lg = Math.max(18, Math.min(56, Math.round(sec.h * .38), Math.round(sec.w * .46)));
  const fs = sec.c === 3 ? 12.5 : sec.c === 4 ? 11 : sec.c === 5 ? 10 : 9.5;
  return `--c:${sec.c};--h:${Math.max(48, sec.h)}px;--lg:${lg}px;--fs:${fs}px`;
}
function istSigdir(){
  const tl = document.querySelector('.st-tl'); if(!tl || window.innerWidth > 600) return;
  const sat = tl.querySelectorAll('.st-tr'); if(!sat.length) return;
  tl.style.removeProperty('--rh'); tl.style.removeProperty('--rf');
  const ust = sat[0].getBoundingClientRect().top + window.scrollY;
  const sinir = $('#nav').getBoundingClientRect().top + window.scrollY - 14;
  const alt = sat[sat.length-1].getBoundingClientRect().bottom + window.scrollY;
  if(alt <= sinir) return;
  const rh = Math.max(17, Math.floor((sinir - ust) / sat.length) - 2);
  tl.style.setProperty('--rh', rh + 'px');
  tl.style.setProperty('--rf', Math.max(9.5, Math.min(12.5, rh * .52)).toFixed(1) + 'px');
}
function takimSigdir(){
  const g = document.querySelector('.tgrid.tgv'); if(!g || window.innerWidth > 600) return;
  const nav = $('#nav'), kartlar = g.querySelectorAll('.tcard'); if(!kartlar.length) return;
  for(let d=0; d<6; d++){
    const alt = kartlar[kartlar.length-1].getBoundingClientRect().bottom + window.scrollY;
    const sinir = nav.getBoundingClientRect().top + window.scrollY - 6;
    if(alt <= sinir) break;
    const c = +getComputedStyle(g).getPropertyValue('--c') || 3, h = parseFloat(getComputedStyle(g).getPropertyValue('--h')) || 90;
    const r = Math.ceil(kartlar.length / c), yeniH = Math.floor(h - (alt - sinir) / r) - 1;
    const minH = c === 3 ? 72 : c === 4 ? 64 : c === 5 ? 56 : 48;
    g.setAttribute('style', yeniH >= minH ? takimGridStil(kartlar.length, c, yeniH) : takimGridStil(kartlar.length, c + 1));
  }
  g.classList.toggle('tdgizle', parseFloat(getComputedStyle(g).getPropertyValue('--h')) < 66);
}
