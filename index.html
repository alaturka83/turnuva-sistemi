function tdGorsel(t, size){
  const td = t.td || {};
  if(td.foto) return `<img class="pfoto" src="${td.foto}" style="width:${size}px;height:${size}px" alt="">`;
  return `<span class="pav" style="font-size:${Math.round(size*.7)}px">👔</span>`;
}
async function takimKaydet(tk){
  const ad = $('#tAd').value.trim(); if(!ad){ toast('Takım adı girin'); return; }
  const tdAd = $('#tdAd').value.trim();
  await Store.update({[tp(`takimlar/${tk}/td`)]:(tdAd || window._tdFoto) ? {ad:tdAd, foto:window._tdFoto||null} : null, [tp(`takimlar/${tk}/ad`)]:ad, [tp(`takimlar/${tk}/renk`)]:$('#tRenk').value, [tp(`takimlar/${tk}/logo`)]:window._tl.logo, [tp(`takimlar/${tk}/logoImg`)]:window._tl.logoImg});
  sheetKapat(); toast('Takım güncellendi');
}

/* ===================== İSTATİSTİK ===================== */
function istatistikHtml(){
  const T = S.T, ms = Object.values(T.maclar), oyn = ms.filter(oynandi), sa = skorAd(), sak = sa.toLocaleLowerCase('tr');
  const sira = siralamaHesap(T), sek = S.iSek || 'genel';
  const gol = oyn.reduce((s,m)=>s+(+m.evGol||0)+(+m.depGol||0),0);
  const yuzde = ms.length ? Math.round(oyn.length/ms.length*100) : 0;
  const bos = t => `<div class="st-bos"><span>📊</span>${t}</div>`;
  const tab = `<div class="st-tab">${[['genel','Genel'],['oyuncu','Oyuncular'],['takim','Takımlar']].map(([k,t])=>`<button class="${sek===k?'on':''}" onclick="S.iSek='${k}';render()">${t}</button>`).join('')}</div>`;
  let h = `<div class="sec" style="margin-top:4px"><h2>İstatistikler</h2><button class="ibtn" title="İndir" onclick="indirMenu('istatistik')">⬇️</button></div>${tab}`;

  if(sek==='genel'){
    let fark = null, cokGol = null;
    oyn.filter(m=>m.durum==='bitti').forEach(m=>{
      const f = Math.abs((+m.evGol||0)-(+m.depGol||0)), tg = (+m.evGol||0)+(+m.depGol||0);
      if(!fark || f > fark.f) fark = {f, m};
      if(!cokGol || tg > cokGol.g) cokGol = {g:tg, m};
    });
    const seri = {}; Object.keys(T.takimlar).forEach(id=>seri[id] = {en:0, su:0});
    oyn.slice().sort((a,b)=>((a.tarih||'')+(a.saat||'')).localeCompare((b.tarih||'')+(b.saat||''))).forEach(m=>{
      const eg = +m.evGol||0, dg = +m.depGol||0;
      [[m.ev, eg>dg],[m.dep, dg>eg]].forEach(([id,k])=>{ const s = seri[id]; if(!s) return; s.su = k ? s.su+1 : 0; if(s.su > s.en) s.en = s.su; });
    });
    const enSeri = Object.entries(seri).sort((a,b)=>b[1].en-a[1].en)[0];
    const ogr = sira.filter(s=>s.o);
    const enGol = [...ogr].sort((a,b)=>b.ag-a.ag || b.p-a.p)[0];
    const enSav = [...ogr].sort((a,b)=>a.yg/a.o-b.yg/b.o || b.p-a.p)[0];
    const kral = golcuListesi()[0], mvp1 = mvpListesi()[0];
    const kucuk = (t, ad) => `<span class="st-km">${logo(t,22)}<span>${esc(ad || t.ad)}</span></span>`;
    const macSat = m => `<span class="st-km">${logo(mTk(m,'ev'),18)}<span>${esc(mTk(m,'ev').ad)}</span></span><b class="st-skr">${m.evGol}-${m.depGol}</b><span class="st-km">${logo(mTk(m,'dep'),18)}<span>${esc(mTk(m,'dep').ad)}</span></span>`;
    const kart = (ik, bas, deger, alt, renk) => `<div class="st-rk" style="--rc:${renk}"><div class="st-rk-u"><span class="st-ik">${ik}</span><small>${bas}</small></div><div class="st-rk-d">${deger}</div><div class="st-rk-a">${alt}</div></div>`;
    h += `<div class="st-ozet">
      <div class="st-o"><span>⚽</span><b>${oyn.length}<small>/${ms.length}</small></b><em>Oynanan maç</em></div>
      <div class="st-o"><span>🥅</span><b>${gol}</b><em>Toplam ${esc(sak)}</em></div>
      <div class="st-o"><span>📈</span><b>${oyn.length ? (gol/oyn.length).toFixed(1) : '0'}</b><em>Maç başı ${esc(sak)}</em></div>
      <div class="st-o"><span>⚖️</span><b>${ms.filter(m=>m.durum==='hukmen').length}</b><em>Hükmen maç</em></div></div>
      <div class="card st-ilerle"><div class="row" style="justify-content:space-between"><b>Turnuva ilerlemesi</b><span class="mut small">%${yuzde}</span></div><div class="st-bar big"><i style="width:${yuzde}%"></i></div><div class="small mut">${ms.length - oyn.length} maç kaldı</div></div>`;
    if(!oyn.length) return h + bos('Maçlar oynandıkça rekorlar ve öne çıkanlar burada görünecek.');
    h += `<div class="sec"><h2>Öne çıkanlar</h2></div><div class="st-rgrid">
      ${kral ? kart('👑', esc(sa)+' kralı', `<span class="st-km">${oyuncuGorsel(oyuncu(kral.tk,kral.p),24)}<span>${esc(oyuncuAd(oyuncu(kral.tk,kral.p)))}</span></span>`, `<b>${kral.gol}</b> ${esc(sak)} · ${esc(takim(kral.tk).ad)}`, '#f4c430') : ''}
      ${mvp1 ? kart('⭐', 'Maçın oyuncusu', `<span class="st-km">${oyuncuGorsel(oyuncu(mvp1.tk,mvp1.p),24)}<span>${esc(oyuncuAd(oyuncu(mvp1.tk,mvp1.p)))}</span></span>`, `<b>${mvp1.n}</b> kez seçildi`, '#8b5cf6') : ''}
      ${enGol ? kart('🔥', 'En golcü takım', kucuk(takim(enGol.id)), `<b>${enGol.ag}</b> ${esc(sak)} · maç başı ${(enGol.ag/enGol.o).toFixed(1)}`, '#ef4444') : ''}
      ${enSav ? kart('🛡️', 'En iyi savunma', kucuk(takim(enSav.id)), `maç başı <b>${(enSav.yg/enSav.o).toFixed(1)}</b> yenilen`, '#2563eb') : ''}
      ${enSeri && enSeri[1].en > 1 ? kart('🚀', 'En uzun galibiyet serisi', kucuk(takim(enSeri[0])), `<b>${enSeri[1].en}</b> maç üst üste`, '#16a34a') : ''}
      ${fark && fark.f > 0 ? kart('💥', 'En farklı skor', `<span class="st-msat">${macSat(fark.m)}</span>`, `${fark.f} ${esc(sak)} fark · ${fark.m.tur}. tur`, '#f97316') : ''}
      ${cokGol && cokGol.g > 0 ? kart('🎯', 'En gollü maç', `<span class="st-msat">${macSat(cokGol.m)}</span>`, `toplam <b>${cokGol.g}</b> ${esc(sak)}`, '#0891b2') : ''}
    </div>`;
    return h;
  }

  if(sek==='oyuncu'){
    const g = golcuListesi(), mv = mvpListesi();
    const podyum = (liste, deg) => {
      if(!liste.length) return '';
      const sira3 = [liste[1], liste[0], liste[2]];
      return `<div class="st-pod">${sira3.map((x,k)=>{ if(!x) return '<div class="st-pd bos"></div>'; const p = oyuncu(x.tk,x.p), t = takim(x.tk), yer = [2,1,3][k];
        return `<button class="st-pd y${yer}" onclick="oyuncuAc('${x.tk}','${x.p}')"><div class="st-pd-av">${oyuncuGorsel(p, yer===1 ? 58 : 46)}<i>${yer}</i></div><b>${esc(oyuncuAd(p))}</b><span class="st-km">${logo(t,14)}<span>${esc(t.ad)}</span></span><div class="st-pd-b"><strong>${deg(x)}</strong></div></button>`; }).join('')}</div>`;
    };
    const liste = (l, deg, max, bas) => l.length > bas ? `<div class="card st-lst">${l.slice(bas, 15).map((x,i)=>{ const p = oyuncu(x.tk,x.p), t = takim(x.tk);
      return `<button class="st-sat" onclick="oyuncuAc('${x.tk}','${x.p}')"><span class="st-n">${i+bas+1}</span>${oyuncuGorsel(p,30)}<div class="st-sm"><b>${esc(oyuncuAd(p))}</b><span class="st-km">${logo(t,13)}<span>${esc(t.ad)}</span></span><div class="st-bar"><i style="width:${Math.round(deg(x)/max*100)}%"></i></div></div><strong>${deg(x)}</strong></button>`; }).join('')}</div>` : '';
    h += `<div class="sec"><h2>👑 ${esc(sa)} Krallığı</h2></div>` + (g.length ? podyum(g, x=>x.gol) + liste(g, x=>x.gol, g[0].gol, 3) : bos(`Canlı maç ekranında ${esc(sak)} atan oyuncu seçildikçe burada listelenir.`));
    h += `<div class="sec"><h2>⭐ Maçın Oyuncusu</h2></div>` + (mv.length ? podyum(mv, x=>x.n) + liste(mv, x=>x.n, mv[0].n, 3) : bos('Maç bitirilirken “Maçın Oyuncusu” seçildikçe burada listelenir.'));
    return h;
  }

  // Takımlar: tek sıkı liste, ölçüt seçilerek
  const ogr = sira.filter(s=>s.o);
  if(!ogr.length) return h + bos('Maçlar oynandıkça takım istatistikleri burada görünecek.');
  const tk = S.iTk || 'hucum', mxP = +(T.ayar.puanG ?? 3) || 3;
  const OL = {
    hucum:{ad:'Hücum', acik:`Attığı ${sak}`, sir:(a,b)=>b.ag-a.ag || b.p-a.p, d:s=>s.ag, f:s=>String(s.ag), r:'a'},
    savunma:{ad:'Savunma', acik:`Maç başı yediği ${sak} (az olan üstte)`, sir:(a,b)=>a.yg/a.o-b.yg/b.o || b.p-a.p, d:s=>s.yg/s.o, f:s=>(s.yg/s.o).toFixed(1), r:'y'},
    oran:{ad:'Galibiyet %', acik:'<span class="st-lej"><i class="g"></i>galibiyet <i class="b"></i>beraberlik <i class="m"></i>yenilgi</span>', sir:(a,b)=>b.g/b.o-a.g/a.o || b.p-a.p, f:s=>'%'+Math.round(s.g/s.o*100)},
    puan:{ad:'Puan ort.', acik:'Maç başına alınan puan', sir:(a,b)=>b.p/b.o-a.p/a.o || b.p-a.p, d:s=>s.p/s.o, f:s=>(s.p/s.o).toFixed(2), r:'p'}
  }, o = OL[tk];
  const liste = [...ogr].sort(o.sir), mx = o.d ? Math.max(.0001, ...liste.map(o.d)) : 1;
  h += `<div class="st-chip">${Object.entries(OL).map(([k,v])=>`<button class="${tk===k?'on':''}" onclick="S.iTk='${k}';render()">${v.ad}</button>`).join('')}</div>
    <div class="card st-tl"><div class="st-tl-b">${o.acik}</div>
    ${liste.map((s,i)=>{ const t = takim(s.id);
      const bar = tk==='oran'
        ? `<div class="st-yig"><i class="g" style="width:${s.g/s.o*100}%"></i><i class="b" style="width:${s.b/s.o*100}%"></i><i class="m" style="width:${s.m/s.o*100}%"></i></div>`
        : `<div class="st-bar ${o.r}"><i style="width:${(tk==='puan' ? o.d(s)/mxP : o.d(s)/mx)*100}%"></i></div>`;
      const yp = tk==='oran' ? `--g:${(s.g/s.o*100).toFixed(1)}%;--gb:${((s.g+s.b)/s.o*100).toFixed(1)}%` : `--p:${((tk==='puan' ? o.d(s)/mxP : o.d(s)/mx)*100).toFixed(1)}%`;
      return `<button class="st-tr t-${tk}" style="${yp}" onclick="takimAc('${s.id}')"><span class="st-n">${i+1}</span>${logo(t,18)}<span class="st-tr-ad">${esc(t.ad)}</span>${bar}<b>${o.f(s)}</b></button>`; }).join('')}
</div>`;
  return h;
}

/* ===================== MAÇ DETAY ===================== */
let detayId = null, HS = {ev:0, dep:0}, detayPanel = '';
function macDetay(id){ detayId = id; detayPanel = ''; const m = S.T.maclar[id]; HS = {ev:+m.evGol||0, dep:+m.depGol||0}; macDetayRender(true); }
function macDetayRender(ilk){
  const m = S.T && S.T.maclar[detayId]; if(!m){ sheetKapat(); return; }
  const e = mTk(m,'ev'), d = mTk(m,'dep'), oyn = oynandi(m) || m.durum==='canli', ad = yonetici();
  const olay = m.olaylar.filter(o=>o.t==='g').map(o=>{ const p = oyuncu(o.tk,o.p), dep = o.tk===m.dep;
    return `<div class="olay ${dep?'dep':''}"><span>⚽</span><span><b>${esc(p?oyuncuAd(p):'Belirtilmemiş')}</b> ${o.dk?`<span class="mut small">${o.dk}'</span>`:''}</span></div>`; }).join('');
  const mvp = m.mvp && oyuncu(m.mvp.tk, m.mvp.p);
  let panel = '';
  if(detayPanel==='skor') panel = `<div class="card"><b>Hızlı skor girişi</b><p class="small mut" style="margin:4px 0 10px">Golcü seçmeden sadece sonucu kaydeder.</p>
      <div class="grid2"><div><div class="small mut" style="text-align:center;margin-bottom:4px">${esc(e.ad)}</div><div class="stp"><button onclick="hsD('ev',-1)">−</button><input id="hsev" type="number" inputmode="numeric" value="${HS.ev}" oninput="HS.ev=+this.value||0"><button onclick="hsD('ev',1)">+</button></div></div>
      <div><div class="small mut" style="text-align:center;margin-bottom:4px">${esc(d.ad)}</div><div class="stp"><button onclick="hsD('dep',-1)">−</button><input id="hsdep" type="number" inputmode="numeric" value="${HS.dep}" oninput="HS.dep=+this.value||0"><button onclick="hsD('dep',1)">+</button></div></div></div>
      <button class="btn p blk" style="margin-top:12px" onclick="hizliKaydet()">Sonucu kaydet</button></div>`;
  if(detayPanel==='tarih'){
    const sl = arr(S.T.ayar.slotlar);
    panel = `<div class="card"><b>Tarih / saat değiştir</b>
      <div class="grid2" style="margin-top:10px"><input class="inp" type="date" id="dtT" value="${m.tarih||bugun()}"><input class="inp" type="time" id="dtS" value="${m.saat||sl[0]||'12:00'}" list="slotlist"></div>
      <datalist id="slotlist">${sl.map(s=>`<option value="${s}">`).join('')}</datalist>
      ${S.T.ayar.sahaSayisi>1?`<select class="inp" id="dtH" style="margin-top:10px">${Array.from({length:+S.T.ayar.sahaSayisi},(_,i)=>`<option value="${i+1}" ${+m.saha===i+1?'selected':''}>Eş zamanlı maç ${i+1}</option>`).join('')}</select>`:''}
      <button class="btn p blk" style="margin-top:10px" onclick="tarihKaydet()">Kaydet</button></div>`;
  }
  if(detayPanel==='hukmen') panel = `<div class="card"><b>Hükmen sonuç</b><p class="small mut" style="margin:4px 0 10px">Kazanan takıma ${S.T.ayar.hukmenSkor ?? 3}-0 galibiyet yazılır.</p>
      <div class="grid2"><button class="btn" onclick="hukmen('ev')">${esc(e.ad)} kazandı</button><button class="btn" onclick="hukmen('dep')">${esc(d.ad)} kazandı</button></div></div>`;
  const kr0 = oynandi(m) ? esKarari(m) : null, bos = !m.ev || !m.dep;
  let karar = '';
  if(kr0 && kr0.A && kr0.B && kr0.a===kr0.b && kr0.ms.every(oynandi)){
    const iki = kr0.ms.length > 1, A = takim(kr0.A), B = takim(kr0.B);
    karar = `<div class="card karar ${m.kazanan ? '' : 'bekl'}"><b>${m.kazanan ? '✅ Tur atlayan: ' + esc(takim(m.kazanan).ad) : '⚖️ ' + (iki ? 'Toplam skor' : 'Maç') + ' berabere — tur atlayan takımı seçin'}</b>
      ${m.kNot ? `<div class="small mut" style="margin-top:2px">${esc(m.kNot)}</div>` : ''}
      ${ad ? `<div class="grid2" style="margin-top:10px"><button class="btn ${m.kazanan===kr0.A?'p':''}" onclick="kazananSec('${kr0.A}')">${esc(A.ad)}</button><button class="btn ${m.kazanan===kr0.B?'p':''}" onclick="kazananSec('${kr0.B}')">${esc(B.ad)}</button></div>
      <input class="inp" id="kNot" style="margin-top:8px" placeholder="Nasıl belirlendi? (ör. Penaltılar 4-3, uzatma, ek oyun)" value="${esc(m.kNot||'')}">` : ''}</div>`;
  }
  const toplamBilgi = kr0 && kr0.ms.length > 1 ? `<div class="mut small" style="text-align:center;margin:-4px 0 8px">İki maç toplamı: <b>${esc(takim(kr0.A).ad)} ${kr0.a} - ${kr0.b} ${esc(takim(kr0.B).ad)}</b></div>` : '';
  const html = `<div class="sh"><h2>${esc(turEtiket(m))}</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="mut small" style="text-align:center">${m.tarih?tarihYaz(m.tarih,true):'Tarih belirsiz'}${m.saat?' · '+m.saat:''}${S.T.ayar.sahaSayisi>1&&m.saha?' · '+esc(mTk(m,'ev').ad)+' sahası':''}</div>
    <div class="dsk"><div class="t">${logo(e,54)}${esc(e.ad)}<span class="mut small" style="font-family:Barlow">Ev sahibi</span></div>
      <div class="s">${oyn?`${m.evGol} - ${m.depGol}`:'<span style="font-size:26px;color:var(--mut)">VS</span>'}</div>
      <div class="t">${logo(d,54)}${esc(d.ad)}<span class="mut small" style="font-family:Barlow">Deplasman</span></div></div>
    <div style="text-align:center;margin-bottom:10px">${m.durum==='canli'?'<span class="badge live">Canlı</span>':m.durum==='hukmen'?'<span class="badge hk">Hükmen</span>':m.durum==='ertelendi'?'<span class="badge er">Ertelendi</span>':m.durum==='bitti'?'<span class="badge">Maç sonu</span>':'<span class="badge">Oynanmadı</span>'}</div>
    ${toplamBilgi}${karar}
    ${olay ? `<div class="card" style="padding:6px 14px">${olay}</div>` : ''}
    ${mvp ? `<div class="card row">${oyuncuGorsel(mvp,40)}<div><div class="small mut">⭐ Maçın Oyuncusu</div><b>${esc(oyuncuAd(mvp))}</b> <span class="mut small">· ${esc(takim(m.mvp.tk).ad)}</span></div></div>`:''}
    ${ad && bos ? `<div class="bilgi">Bu eşleşmenin takımları önceki sonuçlara göre belli olacak. Takımlar belli olunca skor girilebilir.</div><div class="acts"><button class="btn" onclick="detayPanel=detayPanel==='tarih'?'':'tarih';macDetayRender()">📅 Tarih/saat</button></div>${panel}` : ''}
    ${ad && !bos ? `<button class="btn a blk" style="height:56px;font-size:18px;margin-bottom:8px" onclick="canliAc('${m.id}')">${m.durum==='canli'?'🔴 Canlı maça dön':oynandi(m)?'✏️ Canlı ekranda düzenle':'▶ Maçı başlat (canlı)'}</button>
      <div class="acts">
        <button class="btn" onclick="detayPanel=detayPanel==='skor'?'':'skor';HS={ev:+S.T.maclar[detayId].evGol||0,dep:+S.T.maclar[detayId].depGol||0};macDetayRender()">⚡ Hızlı skor</button>
        <button class="btn" onclick="detayPanel=detayPanel==='tarih'?'':'tarih';macDetayRender()">📅 Tarih/saat</button>
        <button class="btn" onclick="ertele()">⏸ Ertele</button>
        <button class="btn" onclick="detayPanel=detayPanel==='hukmen'?'':'hukmen';macDetayRender()">⚖️ Hükmen</button>
        <button class="btn" style="grid-column:1/-1" onclick="cikti('foy','pdf',{mid:'${m.id}'})">📝 Maç föyü (PDF)</button>
        ${oyn ? `<button class="btn r" style="grid-column:1/-1" onclick="sonucSifirla()">Sonucu sıfırla</button>`:''}
      </div>${panel}` : ''}`;
  sheet(html, ilk ? null : true);
}
function hsD(k, d){ HS[k] = Math.max(0, HS[k]+d); $('#hs'+k).value = HS[k]; }
async function kazananSec(id){
  const m = S.T.maclar[detayId], not = ($('#kNot') && $('#kNot').value.trim()) || null;
  await Store.update({[mp(m.id,'kazanan')]:id, [mp(m.id,'kNot')]:not}); toast(takim(id).ad + ' tur atladı');
}
async function hizliKaydet(){
  const m = S.T.maclar[detayId];
  await Store.update({[mp(m.id,'evGol')]:HS.ev, [mp(m.id,'depGol')]:HS.dep, [mp(m.id,'durum')]:'bitti', [mp(m.id,'tarih')]:m.tarih||bugun()});
  detayPanel = ''; toast('Sonuç kaydedildi');
}
async function tarihKaydet(){
  const t = $('#dtT').value, s = $('#dtS').value; if(!t){ toast('Tarih seçin'); return; }
  const m = S.T.maclar[detayId];
  const up = {[mp(m.id,'tarih')]:t, [mp(m.id,'saat')]:s||null, [mp(m.id,'saha')]:$('#dtH') ? +$('#dtH').value : 1};
  if(m.durum==='ertelendi') up[mp(m.id,'durum')] = 'planli';
  await Store.update(up); detayPanel = ''; toast('Tarih güncellendi');
}
async function ertele(){
  const m = S.T.maclar[detayId];
  if(oynandi(m) && !confirm('Bu maçın sonucu silinip ertelenecek. Emin misiniz?')) return;
  await Store.update({[mp(m.id,'durum')]:'ertelendi', [mp(m.id,'tarih')]:null, [mp(m.id,'saat')]:null, [mp(m.id,'saha')]:null, [mp(m.id,'evGol')]:0, [mp(m.id,'depGol')]:0, [mp(m.id,'olaylar')]:null, [mp(m.id,'mvp')]:null});
  toast('Maç ertelendi');
}
async function hukmen(k){
  const m = S.T.maclar[detayId], hs = +(S.T.ayar.hukmenSkor ?? 3);

/* ===================== CANLI MAÇ ===================== */
let canliId = null, krTick = null;
function canliAc(mid){
  sheetKapat(); canliId = mid;
  const m = S.T.maclar[mid];
  if(m.durum!=='canli') Store.update({[mp(mid,'durum')]:'canli', [mp(mid,'tarih')]:m.tarih||bugun()});
  $('#canli').classList.add('ac'); document.body.style.overflow = 'hidden';
  canliRender(); clearInterval(krTick); krTick = setInterval(krYaz, 500);
}
function canliKapat(){ canliId = null; clearInterval(krTick); $('#canli').classList.remove('ac'); document.body.style.overflow = ''; }
function kr(mid){ try{ return JSON.parse(localStorage.getItem('tm_kr_'+mid)) || {gecen:0, bas:null, devre:1}; }catch(e){ return {gecen:0, bas:null, devre:1}; } }
function krKaydet(mid, k){ try{ localStorage.setItem('tm_kr_'+mid, JSON.stringify(k)); }catch(e){} }
function krMs(k){ return k.gecen + (k.bas ? Date.now()-k.bas : 0); }
function krYaz(){
  if(!canliId) return; const k = kr(canliId), ms = krMs(k), el = $('#krono'); if(!el) return;
  const sure = (+S.T.ayar.sure||0)*60000, s = Math.floor(ms/1000);
  el.textContent = pad(Math.floor(s/60))+':'+pad(s%60);
  el.classList.toggle('bitti', sure>0 && ms>=sure);
}
function krBas(){ const k = kr(canliId); if(k.bas){ k.gecen += Date.now()-k.bas; k.bas = null; } else k.bas = Date.now(); krKaydet(canliId,k); canliRender(); }
function krDevre(){ const k = kr(canliId), max = +S.T.ayar.macDevre||1; if(k.devre>=max){ toast('Son devre'); return; } k.devre++; k.gecen = 0; k.bas = null; krKaydet(canliId,k); canliRender(); }
function krSifir(){ if(!confirm('Süre sıfırlansın mı?')) return; krKaydet(canliId,{gecen:0,bas:null,devre:1}); canliRender(); }
function canliDk(){ const k = kr(canliId); return Math.floor(krMs(k)/60000)+1 + (k.devre-1)*(+S.T.ayar.sure||0); }
function canliRender(){
  if(!canliId || !S.T) return; const m = S.T.maclar[canliId]; if(!m){ canliKapat(); return; }
  const e = mTk(m,'ev'), d = mTk(m,'dep'), k = kr(canliId), maxD = +S.T.ayar.macDevre||1, sa = skorAd();
  const ol = m.olaylar.map((o,i)=>({o,i})).filter(x=>x.o.t==='g').reverse().map(({o,i})=>{ const p = oyuncu(o.tk,o.p), dep = o.tk===m.dep;
    return `<div class="olay ${dep?'dep':''}"><span>⚽</span><span>${o.dk?o.dk+"' ":''}<b>${esc(p?oyuncuAd(p):'Belirtilmemiş')}</b> <span style="opacity:.6">${esc(takim(o.tk).kisa||takim(o.tk).ad)}</span></span><button onclick="olaySil(${i})">✕</button></div>`; }).join('');
  $('#canli').innerHTML = `
    <div class="ct"><button class="x" onclick="canliKapat()">← Geri</button><span class="badge live">Canlı</span><span class="small" style="opacity:.7">${m.tur}. Tur</span></div>
    ${+S.T.ayar.sure ? `<div class="krono"><button onclick="krSifir()">↺</button><b id="krono">00:00</b><button onclick="krBas()">${k.bas?'⏸':'▶'}</button></div>
    <div class="ldv">${maxD>1?`${k.devre}. devre / ${maxD} · `:''}${S.T.ayar.sure} dk ${maxD>1&&k.devre<maxD?` · <button style="color:var(--acc);font-weight:700" onclick="krDevre()">Sonraki devre →</button>`:''}</div>` : ''}
    <div class="lsk">
      <div class="t">${logo(e,62)}${esc(e.ad)}<button class="golb" style="background:${esc(e.renk)}" onclick="golSec('${m.ev}')">+ ${esc(sa.toLocaleUpperCase('tr'))}</button></div>
      <div class="s">${m.evGol||0}<span style="opacity:.4">:</span>${m.depGol||0}</div>
      <div class="t">${logo(d,62)}${esc(d.ad)}<button class="golb" style="background:${esc(d.renk)}" onclick="golSec('${m.dep}')">+ ${esc(sa.toLocaleUpperCase('tr'))}</button></div>
    </div>
    <div class="lolay">${ol || `<div class="olay" style="opacity:.6;justify-content:center;border:0">Henüz ${esc(sa.toLowerCase())} yok</div>`}</div>
    <button class="btn a blk" style="height:58px;font-size:19px;margin-top:12px" onclick="macBitir()">🏁 Maçı bitir</button>`;
  krYaz();
}
function golSec(tk){
  const t = takim(tk), oy = Object.values(t.oyuncular).sort((a,b)=>(+a.no||99)-(+b.no||99));
  if(!oy.length){ golEkle(tk, null); return; }
  sheet(`<div class="sh"><h2>${logo(t,28)} ${esc(skorAd())} kimden?</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="pbtns">${oy.map(p=>`<button onclick="golEkle('${tk}','${p.id}')"><span class="a">${oyuncuGorsel(p,36)}</span><span>${esc(oyuncuAd(p))}<small>${p.no?'#'+esc(p.no):''}</small></span></button>`).join('')}
    <button onclick="golEkle('${tk}',null)"><span class="a">❔</span><span>Belirtilmemiş</span></button></div>`);
}
async function golEkle(tk, pid){
  sheetKapat();
  const m = S.T.maclar[canliId], ol = [...m.olaylar, {t:'g', tk, p:pid||null, dk:+S.T.ayar.sure ? canliDk() : null}];
  const evG = (+m.evGol||0) + (tk===m.ev?1:0), depG = (+m.depGol||0) + (tk===m.dep?1:0);
  if(navigator.vibrate) navigator.vibrate(60);
  await Store.update({[mp(m.id,'olaylar')]:ol, [mp(m.id,'evGol')]:evG, [mp(m.id,'depGol')]:depG});
}
async function olaySil(i){
  const m = S.T.maclar[canliId], o = m.olaylar[i]; if(!o) return;
  if(!confirm('Bu '+skorAd().toLowerCase()+' silinsin mi?')) return;
  const ol = m.olaylar.filter((_,j)=>j!==i);
  await Store.update({[mp(m.id,'olaylar')]:ol.length?ol:null, [mp(m.id,'evGol')]:Math.max(0,(+m.evGol||0)-(o.tk===m.ev?1:0)), [mp(m.id,'depGol')]:Math.max(0,(+m.depGol||0)-(o.tk===m.dep?1:0))});
}
function macBitir(){
  const m = S.T.maclar[canliId], e = mTk(m,'ev'), d = mTk(m,'dep');
  const oy = [...Object.values(e.oyuncular).map(p=>({p,tk:m.ev})), ...Object.values(d.oyuncular).map(p=>({p,tk:m.dep}))];
  sheet(`<div class="sh"><h2>🏁 Maçı bitir · ${m.evGol||0}-${m.depGol||0}</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    ${oy.length ? `<p class="mut small" style="margin-top:0">⭐ Maçın oyuncusunu seçin:</p><div class="pbtns">${oy.map(x=>`<button onclick="bitirKaydet('${x.tk}','${x.p.id}')"><span class="a">${oyuncuGorsel(x.p,36)}</span><span>${esc(oyuncuAd(x.p))}<small>${esc(takim(x.tk).ad)}</small></span></button>`).join('')}</div>` : ''}
    <button class="btn p blk" style="margin-top:12px" onclick="bitirKaydet()">${oy.length?'Seçmeden bitir':'Maçı bitir'}</button>`);
}
async function bitirKaydet(tk, pid){
  const m = S.T.maclar[canliId];
  await Store.update({[mp(m.id,'durum')]:'bitti', [mp(m.id,'mvp')]:pid?{tk,p:pid}:null});
  const k = kr(m.id); if(k.bas){ k.gecen += Date.now()-k.bas; k.bas = null; krKaydet(m.id,k); }
  sheetKapat(); canliKapat(); toast('Maç sonucu kaydedildi');
  setTimeout(()=>{ const x = S.T.maclar[m.id], r = x && esKarari(x); if(r && r.berabere && !x.kazanan) macDetay(m.id); }, 400);
}

const obj = p => p==='w' ? W.ayar : A;
function stepper(p, key, min, max){
  const v = obj(p)[key];
  return `<div class="stp"><button onclick="stpD('${p}','${key}',-1,${min},${max})">−</button><input type="number" inputmode="numeric" data-${p}="${key}" data-num value="${esc(v)}"><button onclick="stpD('${p}','${key}',1,${min},${max})">+</button></div>`;
}
function stpD(p, key, d, min, max){ const o = obj(p); o[key] = Math.min(max, Math.max(min, (+o[key]||0)+d)); if(p==='w' && key==='takimSayisi') wTakimSay(); render(); }
function gunSecici(p){ const g = arr(obj(p).gunler); return `<div class="gunler">${[1,2,3,4,5,6,7].map(n=>`<button class="${g.includes(n)?'on':''}" onclick="gunTog('${p}',${n})">${GUN_AD[n%7]}</button>`).join('')}</div>`; }
function gunTog(p, n){ const o = obj(p), g = arr(o.gunler); o.gunler = g.includes(n) ? g.filter(x=>x!==n) : [...g, n].sort(); render(); }
function slotEditor(p){
  const s = arr(obj(p).slotlar).slice().sort();
  return `<div class="tagl">${s.map(x=>`<span class="tag">${x}<button onclick="slotSil('${p}','${x}')">×</button></span>`).join('') || '<span class="mut small">Henüz saat eklenmedi.</span>'}</div>

}
function slotEkle(p){ const v = $('#slot_'+p).value; if(!v) return; const o = obj(p); const s = arr(o.slotlar); if(!s.includes(v)) s.push(v); o.slotlar = s.sort(); render(); }
function slotSil(p, v){ const o = obj(p); o.slotlar = arr(o.slotlar).filter(x=>x!==v); render(); }
function tatilEditor(p){
  const t = arr(obj(p).tatiller);
  return `${t.map((x,i)=>`<div class="tag" style="display:flex;justify-content:space-between;margin-bottom:6px;height:auto;padding:6px 6px 6px 12px"><span>${esc(x.ad||'Tatil')} · ${tarihYaz(x.bas)}${x.bit&&x.bit!==x.bas?' – '+tarihYaz(x.bit):''}</span><button onclick="tatilSil('${p}',${i})">×</button></div>`).join('')}
    <div class="grid2" style="margin-top:6px"><input class="inp" type="date" id="tb_${p}"><input class="inp" type="date" id="tt_${p}"></div>
    <div class="row" style="margin-top:8px"><input class="inp" id="ta_${p}" placeholder="Açıklama (ör. Ara tatil)"><button class="btn" onclick="tatilEkle('${p}')">+ Ekle</button></div>
    <div class="hint">Tek gün için yalnızca ilk tarihi seçin.</div>`;
}
function tatilEkle(p){ const b = $('#tb_'+p).value; if(!b){ toast('Başlangıç tarihi seçin'); return; } let t = $('#tt_'+p).value || b; if(t<b) t = b; const o = obj(p); o.tatiller = [...arr(o.tatiller), {bas:b, bit:t, ad:$('#ta_'+p).value.trim()}]; render(); }
function tatilSil(p, i){ const o = obj(p); o.tatiller = arr(o.tatiller).filter((_,j)=>j!==i); render(); }
function kriterEditor(p){
  const o = obj(p); const sec = arr(o.kriterler); const kapali = Object.keys(KRITERLER).filter(k=>!sec.includes(k));
  return `<ul class="krl"><li class="sabit"><span class="no">★</span><span class="k">Puan (her zaman ilk)</span></li>
    ${sec.map((k,i)=>`<li><span class="no">${i+1}</span><span class="k">${KRITERLER[k]}</span><button onclick="krT('${p}',${i},-1)">↑</button><button onclick="krT('${p}',${i},1)">↓</button><button onclick="krK('${p}','${k}')" style="color:var(--red)">−</button></li>`).join('')}
    ${kapali.map(k=>`<li class="off"><span class="k">${KRITERLER[k]}</span><button onclick="krK('${p}','${k}')" style="color:var(--pri2)">+</button></li>`).join('')}</ul>
    <div class="hint">Süper Lig'de puan eşitliğinde önce takımların kendi aralarındaki maçlara bakılır. Son çare olarak takım adı sırası kullanılır.</div>`;
}
function krT(p, i, d){ const o = obj(p), a = arr(o.kriterler), j = i+d; if(j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; o.kriterler = a; render(); }
function krK(p, k){ const o = obj(p), a = arr(o.kriterler); o.kriterler = a.includes(k) ? a.filter(x=>x!==k) : [...a, k]; render(); }
function toggle(p, key, label, hint){
  const v = obj(p)[key] !== false;
  return `<div class="tog"><div><b style="font-size:15px">${label}</b>${hint?`<div class="hint small mut">${hint}</div>`:''}</div><label class="sw"><input type="checkbox" ${v?'checked':''} onchange="obj('${p}')['${key}']=this.checked"><i></i></label></div>`;
}

const ADIMLAR = ['Genel bilgiler','Takımlar','Kurallar ve puanlama','Fikstür','Takvim','Özet ve kura'];
function wizardBaslat(){
  const tur = 'Çivi Futbolu', p = TURLER[tur];
  W = {adim:0, takimlar:[], ayar:{
    ad:'', tur, logo:'🏆', aciklama:'', skorAd:p.skorAd, kadro:p.kadro, sahada:p.sahada, sure:p.sure, macDevre:p.macDevre,
    puanG:3, puanB:1, puanM:0, hukmenSkor:3, kriterler:VARSAYILAN_KRITER.slice(),
    ligDevre:1, kura:'rastgele', baslangic:bugun(), bitis:gunEkle(bugun(), 42), gunler:[1,2,3,4,5],
    slotlar:['12:30','13:00'], sahaSayisi:1, gunlukMacMax:1, tatiller:[], soyadKisalt:true, takimSayisi:8,
    usul:'lig', elemeMac:1, finalTek:true, ucunculuk:false, grupSayisi:2, grupCikan:2
  }};
  wTakimSay(); S.view = 'olustur'; window.scrollTo(0,0); render();
}
function wTakimSay(){
  const n = Math.max(2, Math.min(40, +W.ayar.takimSayisi||2)); W.ayar.takimSayisi = n;
  while(W.takimlar.length < n){ const i = W.takimlar.length; W.takimlar.push({ad:'', renk:RENK[i%RENK.length], logo:TAKIM_LOGO[i%TAKIM_LOGO.length], logoImg:null}); }
  W.takimlar.length = n;
}
function wTurDegis(v){ W.ayar.tur = v; const p = TURLER[v]; if(p) Object.assign(W.ayar, {skorAd:p.skorAd, kadro:p.kadro, sahada:p.sahada, sure:p.sure, macDevre:p.macDevre}); render(); }
function wHizliDoldur(){
  const sev = $('#hSev').value.trim(), sb = $('#hSub').value.trim().toLocaleUpperCase('tr');
  let harfler = [];
  const m = sb.match(/^([A-ZÇĞİÖŞÜ])\s*-\s*([A-ZÇĞİÖŞÜ])$/);
  const ALF = 'ABCDEFGHIJKLMNOPRSTUVYZ';
  if(m){ const a = ALF.indexOf(m[1]), b = ALF.indexOf(m[2]); for(let i=a;i<=b;i++) harfler.push(ALF[i]); }
  else harfler = sb.split(/[\s,;]+/).filter(Boolean).flatMap(x=>x.length>1 && !/\d/.test(x) ? x.split('') : [x]);
  if(!harfler.length){ toast('Şubeleri girin (ör. A-F veya A,B,C)'); return; }
  const isimler = [];
  sev.split(/[\s,;]+/).filter(Boolean).forEach(s=>harfler.forEach(h=>isimler.push(`${s}-${h}`)));
  if(!sev) harfler.forEach(h=>isimler.push(h));
  W.ayar.takimSayisi = Math.min(40, isimler.length); wTakimSay();
  isimler.slice(0,40).forEach((ad,i)=>W.takimlar[i].ad = ad);
  render(); toast(isimler.length+' takım dolduruldu');
}
function wTopluUygula(){
  const satir = $('#wToplu').value.split(/\r?\n/).map(x=>x.replace(/^\s*\d+[.)\-]\s+/, '').trim()).filter(Boolean);
  const ad = []; satir.forEach(x=>{ if(!ad.some(y=>y.toLocaleLowerCase('tr')===x.toLocaleLowerCase('tr'))) ad.push(x); });
  if(ad.length < 2){ toast('En az 2 takım adı yazın'); return; }
  if(ad.length > 40){ toast('En fazla 40 takım eklenebilir'); return; }
  W.ayar.takimSayisi = ad.length; wTakimSay();
  ad.forEach((x,i)=>{ W.takimlar[i].ad = x; });
  render(); toast(ad.length + ' takım eklendi' + (satir.length > ad.length ? ' (tekrar edenler atlandı)' : ''));
}
function wKarisikSus(){ const r = karistir(RENK.slice()), l = karistir(TAKIM_LOGO.slice()); W.takimlar.forEach((t,i)=>{ t.renk = r[i%r.length]; if(!t.logoImg) t.logo = l[i%l.length]; }); render(); }

function wHata(){
  const a = W.ayar;
  if(W.adim===0 && !a.ad.trim()) return 'Turnuva adını girin.';
  if(W.adim===1){
    const ad = W.takimlar.map(t=>t.ad.trim());
    if(ad.some(x=>!x)) return 'Tüm takımlara isim verin.';

  const f = canli ? {maclar:{}, baylar:{}, gruplar:null} : fiksturHazirla(a.kura!=='sirali' ? karistir(ids.slice()) : ids, a, a.baslangic);

async function yenidenPlanla(tur){
  const bas = $('#ypBas').value || bugun();
  const ayar = S.T.ayar, ms = macListe();
  const bek = ms.filter(m=>tur==='ertelenen' ? (!m.tarih && !oynandi(m) && m.durum!=='canli') : (!oynandi(m) && m.durum!=='canli' && (!m.tarih || m.tarih>=bas || m.durum==='ertelendi'))).sort((a,b)=>a.tur-b.tur || a.sira-b.sira);
  if(!bek.length){ toast('Planlanacak maç yok'); return; }
  if(!confirm(`${bek.length} maç ${tarihYaz(bas,true)} tarihinden itibaren yeniden planlanacak. Devam edilsin mi?`)) return;
  const ids = new Set(bek.map(m=>m.id));
  const dolu = ms.filter(m=>!ids.has(m.id) && m.tarih);
  const p = planlaAkilli(bek.map(m=>({id:m.id, ev:m.ev, dep:m.dep, tur:m.tur, bacak:m.bacak, asama:m.asama})), ayar, dolu, bas);
  const up = {};
  Object.entries(p.atama).forEach(([id,x])=>{ up[mp(id,'tarih')] = x.tarih; up[mp(id,'saat')] = x.saat; up[mp(id,'saha')] = x.saha; up[mp(id,'durum')] = x.tarih ? 'planli' : 'ertelendi'; });
  await Store.update(up);
  toast(`${bek.length - p.yerlesmeyen} maç planlandı${p.tasan?`, ${p.tasan} maç bitiş tarihini aşıyor`:''}`);
}

async function tamYedekYukle(mod){

  const t = d.t || {}, liste = d.liste || {};
  Object.keys(t).forEach(id=>{ if(!liste[id]){ const a = (t[id] && t[id].ayar) || {}; liste[id] = {ad:a.ad||'Turnuva', tur:a.tur||'', logo:a.logo||'🏆', olusturma:t[id].olusturma||Date.now()}; } });

    if(mod==='degistir'){
      if(prompt('Mevcut tüm veriler silinecek. Onaylamak için DEĞİŞTİR yazın:') !== 'DEĞİŞTİR'){ toast('İptal edildi'); return; }
      sheetKapat();
      if(tOff) tOff(); tOff = null; S.tid = null; S.T = null;
      await Store.update({t:Object.keys(t).length ? t : null, liste:Object.keys(liste).length ? liste : null, kurum:d.kurum && Object.keys(d.kurum).length ? d.kurum : null, aktif:d.aktif && t[d.aktif] ? d.aktif : (Object.keys(t)[0] || null)});
      try{ localStorage.removeItem('tm_son'); }catch(e){}
      S.view = 'ayarlar'; secimYap(); render();
      toast('Sistem yedekten geri yüklendi');
    } else {
      sheetKapat();
      const up = {}; let n = 0;
      Object.keys(t).forEach(id=>{
        const yeni = S.liste[id] ? 't'+uid() : id;
        const l = Object.assign({}, liste[id]); if(yeni !== id) l.ad = (l.ad||'Turnuva') + ' (yedek)';
        up['t/'+yeni] = t[id]; up['liste/'+yeni] = l; n++;
      });
      const k = S.kurum || {};
      if(!k.ad && d.kurum && Object.keys(d.kurum).length) up.kurum = d.kurum;
      if(!S.aktif && d.aktif && t[d.aktif] && !S.liste[d.aktif]) up.aktif = d.aktif;

      render(); toast(`${n} turnuva eklendi`);

  }catch(e){ console.error(e); }
  finally{ _yedek = null; }

/* Logonun kenarlarına bağlı beyaz zemini şeffaf yapar; logonun içindeki beyazlara dokunmaz */
function beyazTemizle(url){
  return new Promise((res, rej)=>{
    const img = new Image(); img.onerror = rej;
    img.onload = ()=>{
      const W = img.naturalWidth, H = img.naturalHeight, c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, W, H), p = d.data, gor = new Uint8Array(W*H);
      const beyaz = i => p[i*4+3] > 0 && p[i*4] > 226 && p[i*4+1] > 226 && p[i*4+2] > 226;
      const q = []; let say = 0;
      for(let k=0; k<W; k++) q.push(k, (H-1)*W + k);
      for(let k=0; k<H; k++) q.push(k*W, k*W + W - 1);
      while(q.length){
        const i = q.pop(); if(gor[i]) continue; gor[i] = 1;
        if(!beyaz(i)) continue;
        p[i*4+3] = 0; say++;
        const px = i % W, py = (i / W) | 0;
        if(px > 0) q.push(i-1); if(px < W-1) q.push(i+1); if(py > 0) q.push(i-W); if(py < H-1) q.push(i+W);
      }
      for(let i=0; i<W*H; i++){
        if(p[i*4+3] === 0) continue;
        const px = i % W;
        const kom = (px > 0 && p[(i-1)*4+3] === 0) || (px < W-1 && p[(i+1)*4+3] === 0) || (i-W >= 0 && p[(i-W)*4+3] === 0) || (i+W < W*H && p[(i+W)*4+3] === 0);
        if(kom){ const m = Math.min(p[i*4], p[i*4+1], p[i*4+2]); if(m > 185) p[i*4+3] = Math.round(255 * (255 - m) / 70); }
      }
      x.putImageData(d, 0, 0);
      res({url:c.toDataURL('image/png'), oran:say / (W*H)});
    };
    img.src = url;
  });
}

/* Logo standartlaştırma: kırpmadan — beyaz zemin temizlenir, boş kenarlar atılır,
   oran korunarak şeffaf kare tuvale ortalanır. Her boyuttaki logo aynı ölçüde ve tam görünür. */
function resimYukle(src){ return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; }); }
function dosyaOku(f){ return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
async function logoStandart(file, boy = 256){
  let img = await resimYukle(await dosyaOku(file));
  // 1) Çok büyük görselleri işlenebilir boyuta indir (oran korunur)
  const k = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
  let c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
  let x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
  // 2) Kenara bağlı beyaz zemini şeffaf yap
  try{ const r = await beyazTemizle(c.toDataURL('image/png')); if(r.oran > .005){ img = await resimYukle(r.url); x.clearRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0); } }catch(e){}
  // 3) Boş (şeffaf) kenarları bul ve at
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for(let y=0; y<c.height; y++) for(let xx=0; xx<c.width; xx++){
    if(d[(y*c.width + xx)*4 + 3] > 12){ if(xx < x0) x0 = xx; if(xx > x1) x1 = xx; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  }
  if(x1 < 0){ x0 = 0; y0 = 0; x1 = c.width - 1; y1 = c.height - 1; }
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  // 4) Oranı bozmadan şeffaf kareye ortala (küçük iç boşlukla)
  const o = document.createElement('canvas'); o.width = o.height = boy;
  const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high';
  const ic = boy * .92, s = Math.min(ic / w, ic / h);
  const dw = Math.round(w * s), dh = Math.round(h * s);
  ox.drawImage(c, x0, y0, w, h, Math.round((boy - dw) / 2), Math.round((boy - dh) / 2), dw, dh);
  return o.toDataURL('image/png');
}
function gorselKucult(file, size, tip='image/jpeg', q=.82){
  return new Promise((res, rej)=>{
    const r = new FileReader(); r.onerror = rej;
    r.onload = ()=>{ const img = new Image(); img.onerror = rej; img.onload = ()=>{
      const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
      if(tip==='image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0,0,size,size); }
      const k = Math.min(img.width, img.height);
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, (img.width-k)/2, (img.height-k)/2, k, k, 0, 0, size, size);
      res(c.toDataURL(tip, q));
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

async function excelYaz(dosya, sayfalar){
  await kutuphane('xls');
  const k = S.kurum || {}, a = S.T.ayar, wb = XLSX.utils.book_new();
  const cz = {style:'thin', color:{rgb:'C9D3CC'}}, brd = {top:cz, bottom:cz, left:cz, right:cz};
  const adlar = new Set();
  sayfalar.forEach(sf=>{
    const n = sf.kolonlar.length;
    const aoa = [[k.ad || a.ad], [(k.ad ? a.ad + '  ·  ' : '') + sf.baslik], ['Oluşturma: ' + simdiYaz() + (k.egitimYili ? '   ·   ' + k.egitimYili + ' Eğitim-Öğretim Yılı' : '')], []];
    aoa.push(sf.kolonlar.map(c=>c.ad));
    sf.satirlar.forEach(r=>aoa.push(r.map(hv)));
    if(!sf.satirlar.length) aoa.push(['Kayıt yok']);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [0,1,2].map(r=>({s:{r, c:0}, e:{r, c:Math.max(0, n-1)}}));

async function pdfYaz(baslik, govde, opt, dosya){
  await kutuphane('pdf');
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const k = S.kurum || {};
  const el = document.createElement('div'); el.className = 'pdfd';
  el.innerHTML = (baslik ? pdfBaslik(baslik, opt.meta) : '') + govde + (opt.imza ? pdfImza() : '')
    + (k.pdfNot || k.web ? `<div class="pnot">${esc([k.pdfNot, k.web].filter(Boolean).join('  ·  '))}</div>` : '');
  const kap = document.createElement('div'); kap.className = 'pdfkap'; kap.appendChild(el);
  document.body.appendChild(kap);
  // Tek sayfa: içerik A4 yüksekliğini biraz aşıyorsa belgeyi genişletip orantılı küçült
  const SAYFA_H = 718 * 274 / 190;
  let gen = 718;
  if(opt.tek){
    for(let d=0; d<4; d++){
      const h = el.scrollHeight;
      if(h <= SAYFA_H * gen / 718) break;
      gen = Math.min(718 * 1.75, Math.ceil(718 * h / SAYFA_H) + 2);
      el.style.width = gen + 'px'; kap.style.width = gen + 'px';
    }
  }
  try{
    await html2pdf().set({
      margin:[10, 10, 13, 10], filename:dosya + '.pdf',
      image:{type:'jpeg', quality:.96},
      html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', width:gen, windowWidth:Math.max(gen, window.innerWidth), scrollX:0, scrollY:0, x:0, y:0},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak:opt.tek ? {mode:[]} : {mode:['css', 'legacy'], avoid:['tr', '.pc', '.blok', 'h3', '.ozet', '.imza']}
    }).from(el).toPdf().get('pdf').then(pdf=>{
      const n = pdf.internal.getNumberOfPages(), w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
      for(let i=1; i<=n; i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(130); pdf.text('Sayfa ' + i + ' / ' + n, w - 10, h - 6, {align:'right'}); }
    }).save();
  } finally { kap.remove(); }
}

const BGM = {
  a:null, ses:.16, acik:(()=>{ try{ return localStorage.getItem('tm_bgm') !== '0'; }catch(e){ return true; } })(),
  hazir(){ if(this.a) return this.a; const a = new Audio('fon-muzik.mp3'); a.loop = true; a.preload = 'none'; a.volume = this.ses; a.addEventListener('play', ()=>this.ciz()); a.addEventListener('pause', ()=>this.ciz()); this.a = a; return a; },
  caliyor(){ return !!(this.a && !this.a.paused); },
  baslat(){
    if(!this.acik || (typeof KT!=='undefined' && KT.acik) || document.hidden) return;
    const a = this.hazir(); clearInterval(a._f); a.volume = 0;
    const p = a.play(); if(p && p.catch) p.catch(()=>{});
    let v = 0; a._f = setInterval(()=>{ v = Math.min(this.ses, v + .02); a.volume = v; if(v >= this.ses) clearInterval(a._f); }, 120);
    this.ciz();
  },
  dur(){ if(!this.a) return; const a = this.a; clearInterval(a._f); a.pause(); this.ciz(); },
  tog(){ this.acik = !this.acik; try{ localStorage.setItem('tm_bgm', this.acik ? '1' : '0'); }catch(e){} this.acik ? this.baslat() : this.dur(); toast(this.acik ? '🎵 Fon müziği açık' : 'Fon müziği kapalı'); this.ciz(); },
  ciz(){
    let b = document.getElementById('bgmBtn');

  }
};
(function(){

/* ===================== CANLI KURA TÖRENİ ===================== */
/* Tören, sunucu saatine bağlı tek bir zaman çizelgesidir: kura.baslangic + geçen süre.
   Herkes aynı anı görür; sonradan katılan kaldığı yerden izler. */
let sunucuFark = 0;
const simdiMs = () => Date.now() + sunucuFark;

/* ---------- Ses motoru (Web Audio, dosya gerektirmez) ---------- */
const Ses = {
  c:null, g:null, acik:false, pad:null, _buf:null,
  hazir(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
      if(!this.c){ this.c = new AC(); this.g = this.c.createGain(); this.g.gain.value = .6; this.g.connect(this.c.destination); }
      if(this.c.state === 'suspended') this.c.resume();
      this.acik = true; return true;
    }catch(e){ return false; }
  },
  kapat(){ this.padDur(); this.acik = false; },
  _osc(f, t, d, tip, v, hedef){
    const c = this.c, o = c.createOscillator(), g = c.createGain();
    o.type = tip || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(hedef || this.g); o.start(t); o.stop(t + d + .05); return o;
  },
  _gur(t, d, v, f, q, tip){
    const c = this.c;
    if(!this._buf){ const b = c.createBuffer(1, c.sampleRate, c.sampleRate), x = b.getChannelData(0); for(let i=0;i<x.length;i++) x[i] = Math.random()*2 - 1; this._buf = b; }
    const s = c.createBufferSource(); s.buffer = this._buf;
    const fl = c.createBiquadFilter(); fl.type = tip || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(this.g); s.start(t, Math.random()*.5); s.stop(t + d + .05);
    return {fl, g};
  },
  _bando(f, t, d, v){
    const c = this.c, o = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.linearRampToValueAtTime(2600, t + .08);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .03); g.gain.setValueAtTime(v, t + d*.7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(lp); lp.connect(g); g.connect(this.g); o.start(t); o.stop(t + d + .05);
  },
  calis(ad){
    if(!this.acik || !this.c) return;
    const t = this.c.currentTime + .01;
    try{
      if(ad==='bip') this._osc(880, t, .18, 'sine', .3);

const LT = {map:{}, key:{}, n:0};

/* ---------- Zaman çizelgesi ---------- */
function turGrup(T){
  const g = {}; Object.values(T.maclar || {}).forEach(m=>{ (g[m.tur] = g[m.tur] || []).push(m); });
  return Object.keys(g).map(Number).sort((a,b)=>a-b).map(t=>({tur:t, maclar:g[t].sort((a,b)=>(a.sira||0)-(b.sira||0)), bay:(v => v==null ? null : typeof v==='string' ? [v] : arr(v))((T.baylar || {})['t'+t])}));
}
function kuraPlan(T){
  const sira = arr(T.kura && T.kura.sira).filter(id=>T.takimlar[id]);
  const n = sira.length, D = n > 16 ? 2200 : n > 10 ? 2600 : 3000;
  const INTRO = 5400, cekBit = INTRO + n*D;
  const turlar = turGrup(T).filter(tr=>tr.maclar.every(m=>m.ev && m.dep)), R = turlar.length;
  const GR = T.gruplar ? 5600 : 0, F = cekBit + 2200, F2 = F + GR, T1 = Math.max(4200, 1600 + (turlar[0] ? turlar[0].maclar.length : 0)*300), TX = R > 16 ? 950 : R > 8 ? 1300 : 1800;
  const finale = F2 + (R ? T1 + (R-1)*TX : 0) + 300;
  return {sira, n, D, INTRO, cekBit, turlar, R, F, F2, GR, T1, TX, finale, son:finale + 9000};
}
function kuraOlaylar(P){
  const o = [], ek = (t, f) => o.push({t, f});
  ek(0, h=>ktIntro(h));
  [1700, 2700, 3700].forEach((t,k)=>ek(t, h=>ktSayac(3-k, h)));
  ek(4700, h=>ktSayac(0, h));
  ek(P.INTRO, h=>ktCekimBasla(h));
  P.sira.forEach((id, i)=>{ const t0 = P.INTRO + i*P.D; ek(t0, h=>ktTopFirla(i, h)); ek(t0 + 850, h=>ktKartAc(i, h)); ek(t0 + P.D - 420, h=>ktYerles(i, h)); });
  ek(P.cekBit + 300, h=>ktCekimBitti(h));
  if(P.GR) ek(P.F, h=>ktGruplar(h));
  P.turlar.forEach((tr, r)=>ek(r===0 ? P.F2 : P.F2 + P.T1 + (r-1)*P.TX, h=>ktTur(r, h)));
  ek(P.finale, h=>ktFinal(h));
  return o.sort((a,b)=>a.t - b.t);
}

/* ---------- Oynatıcı ---------- */
const KT = {acik:false, P:null, olay:[], idx:0, t0:0, raf:null, baslangic:null, tekrar:false};
function kuraKontrol(){
  const k = S.T && S.T.kura;

}
function kuraGoster(gecen, tekrar){

/* ---------- Kura fanusu: gerçek karışım fiziği ---------- */
function ktFizikKur(P, cap, rnd){
  const r = cap/2, R = .5 - .03 - r;
  KT.fz = {r, R, son:0, toplar:P.sira.map((_, i)=>{
    const ang = rnd(i,1)*Math.PI*2, d = Math.sqrt(rnd(i,2))*R*.9;
    return {el:document.getElementById('ktTop'+i), x:.5 + Math.cos(ang)*d, y:.5 + Math.sin(ang)*d*.6 + R*.35, vx:0, vy:0, a:rnd(i,3)*360, cik:false};

function ktFizik(now){

  const W = torba.clientWidth; if(!W) { F.son = now; return; }
  let dt = F.son ? (now - F.son)/1000 : 0; F.son = now; if(dt <= 0) return; dt = Math.min(dt, 1/30);
  const karis = torba.classList.contains('karis'), T = F.toplar.filter(b=>!b.cik), r = F.r, R = F.R;
  for(const b of T){
    b.vy += 2.4*dt;                                   // yerçekimi
    if(karis){                                        // alttan üfleyen hava + girdap
      if(b.y > .5) b.vy -= (6 + Math.random()*5)*dt;
      b.vx += ((Math.random()-.5)*9 + (.5 - b.y)*3.2)*dt;
      b.vy += (b.x - .5)*2.2*dt;
    }
    const sp = Math.hypot(b.vx, b.vy), mx = karis ? 2.3 : 1.6; if(sp > mx){ b.vx *= mx/sp; b.vy *= mx/sp; }
    b.vx *= karis ? .998 : .985; b.vy *= karis ? .998 : .985;
    b.x += b.vx*dt; b.y += b.vy*dt;
    const dx = b.x - .5, dy = b.y - .5, d = Math.hypot(dx, dy);
    if(d > R){ const nx = dx/d, ny = dy/d; b.x = .5 + nx*R; b.y = .5 + ny*R; const vn = b.vx*nx + b.vy*ny; if(vn > 0){ b.vx -= 1.75*vn*nx; b.vy -= 1.75*vn*ny; } }
  }
  for(let i=0;i<T.length;i++) for(let j=i+1;j<T.length;j++){
    const a = T[i], b = T[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-4;
    if(d < 2*r){ const nx = dx/d, ny = dy/d, o = (2*r - d)/2; a.x -= nx*o; a.y -= ny*o; b.x += nx*o; b.y += ny*o;
      const rv = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny; if(rv < 0){ const k = -.9*rv; a.vx -= k*nx; a.vy -= k*ny; b.vx += k*nx; b.vy += k*ny; } }
  }
  const px = r*2*W;
  for(const b of T){ b.a += b.vx*dt*420; b.el.style.transform = `translate(${(b.x*W - px/2).toFixed(1)}px,${(b.y*W - px/2).toFixed(1)}px) rotate(${b.a.toFixed(0)}deg)`; }
}

function ktUcur(top, t){

    {transform:tr((cx + kx)/2, Math.min(c.bottom, ky) - s*.4, (1.2 + son)/2), offset:.7},
    {transform:tr(kx, ky, son), offset:1}
  ], {duration:820, easing:'cubic-bezier(.3,.6,.4,1)', fill:'forwards'});
  ani.onfinish = () => { const f = u.animate([{opacity:1}, {opacity:0, transform:tr(kx, ky, son*1.25)}], {duration:260, fill:'forwards'}); f.onfinish = () => u.remove(); };
}
function ktKartAc(i, h){
  const t = takim(KT.P.sira[i]), td = t.td || {}, kart = $('#ktKart');
  kart.style.setProperty('--tc', t.renk);
  kart.className = 'kt-kart' + (h ? '' : ' ac');
  kart.innerHTML = `<div class="kk-no">KURA NO<b>${i+1}</b></div><div class="kk-logo">${ktLogo(t,104)}</div><div class="kk-ad">${esc(t.ad)}</div>
    ${td.ad ? `<div class="kk-td">${td.foto ? `<img src="${td.foto}" alt="">` : '<span>👔</span>'}<div><small>TEKNİK DİREKTÖR</small><b>${esc(td.ad)}</b></div></div>` : ''}`;
  ktAdSigdir(kart.querySelector('.kk-ad'));
  if(!h) Ses.calis('ding');
}
function ktAdSigdir(el){
  if(!el) return; el.style.fontSize = '';
  let f = parseFloat(getComputedStyle(el).fontSize);
  while(f > 11 && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1)){ f -= 1; el.style.fontSize = f + 'px'; }
}
function ktYerles(i, h){
  const t = takim(KT.P.sira[i]), s = $('#ktSlot'+i); if(!s) return;
  s.className = 'kt-slot dolu' + (h ? '' : ' yeni');
  s.innerHTML = `<b>${i+1}</b>${ktLogo(t,24)}<span>${esc(t.ad)}</span>`;
  ktSigdir();
  if(!h){ Ses.calis('yerles'); const kart = $('#ktKart'); if(kart) kart.classList.add('gidiyor'); }
}
function ktCekimBitti(h){
  $('#ktTorba').classList.remove('karis');
  const kart = $('#ktKart'); kart.className = 'kt-kart tamam' + (h ? '' : ' ac'); kart.style.removeProperty('--tc');
  kart.innerHTML = `<div class="kk-tamam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.3 4.3L19 7.2"/></svg></div><div class="kk-tt">Kura tamamlandı</div><div class="kk-alt">Fikstür açıklanıyor<i>.</i><i>.</i><i>.</i></div>`;
  ktDurum('Kura tamamlandı'); if(!h) Ses.calis('akor');
}
function ktTur(r, h){
  ktFaz('fik');
  const P = KT.P, tr = P.turlar[r], ilk = r===0;
  const tarihler = [...new Set(tr.maclar.map(m=>m.tarih).filter(Boolean))].sort();
  const gec = j => h ? 0 : (ilk ? 350 + j*280 : j*60);
  $('#ktFik').innerHTML = `<div class="kf-kart ${h ? '' : 'ac'}">
    <div class="kf-bas"><span>${usul()==='lig' ? `FİKSTÜR · ${P.R} TUR` : usul()==='grup' ? `GRUP MAÇLARI · ${P.R} TUR` : 'EŞLEŞMELER'}</span><h2>${esc(turAdi(tr.tur).toLocaleUpperCase('tr'))}</h2><small>${tarihler.length ? tarihYaz(tarihler[0], true) + (tarihler.length > 1 ? ' – ' + tarihYaz(tarihler[tarihler.length-1]) : '') : ''}</small></div>
    <div class="kf-liste">${tr.maclar.map((m, j)=>{ const e = mTk(m,'ev'), d = mTk(m,'dep');
      return `<div class="kf-sat" style="animation-delay:${gec(j)}ms"><span class="kf-e"><span class="kf-ad">${esc(e.ad)}</span>${ktLogo(e,30)}</span><b>${m.saat ? esc(m.saat) : 'VS'}</b><span class="kf-d">${ktLogo(d,30)}<span class="kf-ad">${esc(d.ad)}</span></span></div>`; }).join('')}
      ${tr.bay && tr.bay.length ? `<div class="kf-bay" style="animation-delay:${gec(tr.maclar.length)}ms">${tr.bay.map(b=>`${ktLogo(takim(b),22)} ${esc(takim(b).ad)}`).join(' · ')} ${tr.maclar.some(m=>m.asama==='eleme') ? '<b>BAY</b> · doğrudan üst tur' : 'bu tur <b>BAY</b>'}</div>` : ''}</div>
    <div class="kf-nok">${P.turlar.map((_, k)=>`<i class="${k < r ? 'gec' : k===r ? 'on' : ''}"></i>`).join('')}</div></div>`;
  ktDurum(usul()==='eleme' ? `Eşleşmeler açıklanıyor · ${turAdi(tr.tur)}` : `Fikstür açıklanıyor · ${r+1}. tur / ${P.R}`);
  ktSigdir();
  if(!h) Ses.calis(ilk ? 'whoosh' : 'tik');
}
function ktGruplar(h){
  ktFaz('fik');
  const G = S.T.gruplar || {}, ks = Object.keys(G).sort();
  $('#ktFik').innerHTML = `<div class="kf-kart kg ${h ? '' : 'ac'}"><div class="kf-bas"><span>KURA SONUCU</span><h2>GRUPLAR</h2></div>
    <div class="kg-izg" style="--gs:${ks.length}">${ks.map((g, gi)=>`<div class="kg-g" style="animation-delay:${h ? 0 : 300 + gi*260}ms"><h3>${g} GRUBU</h3>${arr(G[g]).map(id=>{ const t = takim(id); return `<div class="kg-t">${ktLogo(t,24)}<span>${esc(t.ad)}</span></div>`; }).join('')}</div>`).join('')}</div></div>`;
  ktDurum('Gruplar belli oldu');
  ktSigdir();
  if(!h) Ses.calis('whoosh');
}
function ktFinal(h){
  ktFaz('final');
  const P = KT.P, ms = macListe(), ilk = ms.find(m=>m.tarih), top = ms.length;
  $('#ktFinal').innerHTML = `<div class="kfin"><div class="kfin-kupa">🏆</div><h1>${usul()==='eleme' ? 'EŞLEŞMELER HAZIR' : 'FİKSTÜR HAZIR'}</h1>
    <div class="kfin-chips"><span>${P.n} takım</span>${usul()==='lig' ? `<span>${P.R} tur</span>` : usul()==='grup' ? `<span>${Object.keys(S.T.gruplar||{}).length} grup</span>` : `<span>${new Set(ms.filter(m=>m.asama==='eleme').map(m=>m.tur)).size} tur</span>`}<span>${top} maç</span></div>
    ${ilk ? `<div class="kfin-ilk"><small>İLK MAÇ · ${tarihYaz(ilk.tarih, true)}${ilk.saat ? ' · ' + esc(ilk.saat) : ''}</small>
      <div class="kfin-mac"><span>${esc(mTk(ilk,'ev').ad)} ${ktLogo(mTk(ilk,'ev'),38)}</span><b>VS</b><span>${ktLogo(mTk(ilk,'dep'),38)} ${esc(mTk(ilk,'dep').ad)}</span></div></div>` : ''}
    <div class="kfin-btn"><button class="btn a" onclick="kuraKapat();S.view='fikstur';S.fTur=null;S.fTakim='';render()">📅 Fikstürü gör</button><button class="btn" onclick="kuraGoster(0,true)">↺ Tekrar izle</button></div></div>`;
  ktDurum('Fikstür hazır · İyi şanslar!');
  if(!h){ Ses.calis('fanfar'); ktKonfeti(); setTimeout(()=>Ses.padDur(true), 2500); }
  else Ses.padDur();
  if(yonetici() && !KT.tekrar && S.T.kura && S.T.kura.durum === 'cekiliyor') Store.set(tp('kura/durum'), 'bitti').catch(()=>{});
}
function ktKonfeti(){
  const c = $('#ktKonfeti'); if(!c) return;
  const x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const renk = ['#f4c430', '#ffffff', '#1f8a55', '#e63946', '#2563eb', '#f59e0b', '#7c3aed'];
  const p = Array.from({length:200}, ()=>({x:Math.random()*W, y:-Math.random()*H*.7, w:6 + Math.random()*7, h:9 + Math.random()*10, vy:2.2 + Math.random()*3.8, vx:-1.6 + Math.random()*3.2, r:Math.random()*6, vr:-.2 + Math.random()*.4, c:renk[Math.floor(Math.random()*renk.length)]}));
  const bas = performance.now();
  (function ciz(t){
    if(!KT.acik) return;
    const g = t - bas; x.clearRect(0, 0, W, H);
    p.forEach(q=>{ q.x += q.vx + Math.sin((g + q.y)/300)*.6; q.y += q.vy; q.r += q.vr; x.save(); x.translate(q.x, q.y); x.rotate(q.r); x.globalAlpha = Math.max(0, 1 - g/7000); x.fillStyle = q.c; x.fillRect(-q.w/2, -q.h/2, q.w, q.h); x.restore(); });
    if(g < 7000) requestAnimationFrame(ciz); else x.clearRect(0, 0, W, H);
  })(bas);
}

/* ---------- Başlatma ve bekleme ekranı ---------- */
async function kuraBaslat(){
  if(!yonetici() || !S.T) return;
  const T = S.T, ids = Object.values(T.takimlar).sort((a,b)=>(a.sira||0)-(b.sira||0)).map(t=>t.id);
  if(ids.length < 2){ toast('En az 2 takım gerekli'); return; }
  if(!confirm('Canlı kura töreni şimdi başlasın mı?\nBağlantıyı açık tutan herkes töreni aynı anda izleyecek.')) return;
  Ses.hazir();
  const sira = karistir(ids.slice()), a = T.ayar;
  const bas = (a.baslangic && a.baslangic > bugun()) ? a.baslangic : bugun();
  const f = fiksturHazirla(sira, a, bas), maclar = f.maclar, baylar = f.baylar;
  try{ localStorage.removeItem('tm_kuraKapat'); }catch(e){}
  await Store.update({[tp('maclar')]:maclar, [tp('baylar')]:Object.keys(baylar).length ? baylar : null, [tp('gruplar')]:f.gruplar || null,
    [tp('kura')]:{durum:'cekiliyor', sira, planlanan:(T.kura && T.kura.planlanan) || null, baslangic:Store.mod==='bulut' ? {'.sv':'timestamp'} : Date.now()}});
  S.fTur = null;
}
async function kuraHazirla(){
  if(!confirm('Mevcut fikstür silinecek ve turnuva canlı kura törenine hazırlanacak. Devam edilsin mi?')) return;
  await Store.update({[tp('maclar')]:null, [tp('baylar')]:null, [tp('gruplar')]:null, [tp('kura')]:{durum:'bekliyor'}});
  S.view = 'bugun'; S.fTur = null; render(); toast('Turnuva kura törenine hazır');
}
async function kuraPlanKaydet(){
  const v = $('#kuraPlan').value;
  await Store.set(tp('kura/planlanan'), v ? new Date(v).getTime() : null);
  toast(v ? 'Tören saati duyuruldu' : 'Tören saati kaldırıldı');
}
function geriYaz(ms){ const s = Math.floor(ms/1000), g = Math.floor(s/86400), sa = Math.floor(s%86400/3600), d = Math.floor(s%3600/60), sn = s%60; return (g ? g+' gün ' : '') + pad(sa)+':'+pad(d)+':'+pad(sn); }
function yerelTS(ms){ const d = new Date(ms); return fmtD(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function geriSeg(ms){
  if(ms <= 0) return '<div class="kb2-hazir">Tören birazdan başlıyor</div>';
  const s = Math.floor(ms/1000), g = Math.floor(s/86400), sa = Math.floor(s%86400/3600), d = Math.floor(s%3600/60), sn = s%60;
  const k = (v, e) => `<div><b>${pad(v)}</b><small>${e}</small></div>`;
  return (g ? k(g, 'GÜN') : '') + k(sa, 'SAAT') + k(d, 'DAKİKA') + k(sn, 'SANİYE');
}
function kuraBekleKart(){
  const k = S.T && S.T.kura; if(!k || k.durum !== 'bekliyor' || Object.keys(S.T.maclar).length) return '';
  const pl = k.planlanan, ts = Object.values(S.T.takimlar), a = S.T.ayar, kr = S.kurum || {};
  return `<div class="kurabekle kb2">
    <div class="kb2-ust">${kr.logoImg ? kurumLogo(30) : ''}<span class="kb2-canli"><i></i>CANLI KURA TÖRENİ</span></div>
    <h2>${esc(a.ad)}</h2>
    <div class="kb2-alt">${ts.length} takım · ${usulMetin(a, ts.length)}${a.aciklama ? ' · ' + esc(a.aciklama) : ''}</div>
    ${pl ? `<div class="kb2-tarih">📅 ${new Date(pl).toLocaleString('tr-TR', {day:'numeric', month:'long', weekday:'long', hour:'2-digit', minute:'2-digit'})}</div>
      <div class="kb2-sayac" id="kuraGeri" data-t="${pl}">${geriSeg(pl - simdiMs())}</div>` : `<div class="kb2-tarih kb2-yok">Tören saati henüz duyurulmadı</div>`}
    <div class="kb2-takim">${ts.map(t=>`<span title="${esc(t.ad)}">${logo(t,24)}</span>`).join('')}</div>
    <div class="kb2-bilgi">🔊 Tören başlayınca bu ekran kendiliğinden açılır</div>
    ${yonetici() ? `<div class="kb2-yon">
      <div class="kb2-plan"><input class="inp" type="datetime-local" id="kuraPlan" value="${pl ? yerelTS(pl) : ''}"><button class="btn" onclick="kuraPlanKaydet()">Saati duyur</button></div>
      <button class="btn a blk kb2-bas" onclick="kuraBaslat()">🎬 Kura törenini başlat</button></div>` : ''}
  </div>`;
}
setInterval(()=>{ const el = document.getElementById('kuraGeri'); if(!el) return; el.innerHTML = geriSeg(+el.dataset.t - simdiMs()); }, 1000);


/* ===================== UYGULAMA OLARAK YÜKLE ===================== */
let kurIstem = null;
const kurulu = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const iosMu = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); kurIstem = e; if(S.view==='bugun' || S.view==='ayarlar') render(); });
window.addEventListener('appinstalled', ()=>{ kurIstem = null; toast('Uygulama yüklendi'); render(); });
function kurKart(ayarda){
  if(kurulu()) return '';
  if(!ayarda){ try{ if(localStorage.getItem('tm_kurGizle')) return ''; }catch(e){} }
  return `<div class="card kurkart"><img src="icon-192.png" alt="" onerror="this.style.display='none'"><div style="flex:1;min-width:0"><b>Uygulama olarak ekleyin</b><div class="small mut">Telefonun ana ekranında ya da bilgisayarda kendi simgesiyle açılır.</div></div>
    <div class="kurb"><button class="btn sm p" onclick="uygulamaKur()">📲 Ekle</button>${ayarda ? '' : `<button class="btn sm" onclick="try{localStorage.setItem('tm_kurGizle','1')}catch(e){};render()">Gizle</button>`}</div></div>`;
}
async function uygulamaKur(){
  if(kurIstem){ kurIstem.prompt(); try{ await kurIstem.userChoice; }catch(e){} kurIstem = null; render(); return; }
  const ios = iosMu();
  sheet(`<div class="sh"><h2>📲 Uygulama olarak ekle</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="card"><b>iPhone / iPad (Safari)</b><ol class="kurl"><li>Alttaki <b>Paylaş</b> simgesine (kutudan çıkan ok ⬆️) dokunun.</li><li><b>Ana Ekrana Ekle</b> seçin.</li><li>Sağ üstte <b>Ekle</b> deyin.</li></ol></div>
    <div class="card"><b>Android (Chrome)</b><ol class="kurl"><li>Sağ üstteki <b>⋮</b> menüye dokunun.</li><li><b>Uygulamayı yükle</b> ya da <b>Ana ekrana ekle</b> seçin.</li></ol></div>
    <div class="card"><b>Bilgisayar (Chrome / Edge)</b><ol class="kurl"><li>Adres çubuğunun sağındaki <b>yükle</b> simgesine (ekran + ok) tıklayın.</li><li>Ya da menüden <b>Uygulamayı yükle</b> / <b>Uygulamalar → Bu siteyi uygulama olarak yükle</b> seçin.</li></ol></div>
    <p class="small mut">Bu seçenekler yayın adresinde (https) görünür; bilgisayardan dosya olarak açınca çıkmaz.</p>`);
}
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ===================== BAŞLAT ===================== */
Store.init();
Store.on('liste', v=>{ S.liste = v || {}; S.listeGeldi = true; secimYap(); yenile(); });
Store.on('aktif', v=>{ S.aktif = v || null; secimYap(); });
Store.on('kurum', v=>{ S.kurum = v || {}; yenile(); });
if(URLP.get('tv')==='1') setTimeout(()=>{ if(S.T) tvAc(); }, 1500);
render();
</script>
