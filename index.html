<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Turnuva Merkezi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef2ef;--card:#fff;--ink:#11201a;--mut:#5f6f66;--line:#dfe6e1;--soft:#f5f8f6;
  --pri:#0b3d2a;--pri2:#13693f;--pri3:#1f8a55;--acc:#f4c430;--red:#d64545;--live:#e11d48;--blue:#2563eb;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(10,40,25,.07);
  --fd:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Barlow,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:calc(74px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);letter-spacing:.3px;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 30px}

/* HEADER */
#hdr{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#hdr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);pointer-events:none}
.tsec{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left;padding:4px;border-radius:12px;position:relative;z-index:1}
.tsec .tl{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;flex:none}
.tsec .tt{min-width:0}
.tsec b{display:block;font-family:var(--fd);font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsec small{opacity:.75;font-size:12.5px;display:flex;gap:6px;align-items:center}
.hsag{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.hbtn{height:38px;min-width:38px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:13px;font-weight:600}
.hbtn svg{width:20px;height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8;display:inline-block}
.dot.yerel{background:var(--acc)}

/* NAV */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--mut)}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--pri2)}
#nav button.on svg{stroke-width:2.4}
#nav .brand{display:none}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:228px}
  #hdr{padding-left:20px}
  #nav{top:0;bottom:0;right:auto;width:228px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 12px;gap:4px;box-shadow:none}
  #nav .brand{display:block;font-family:var(--fd);font-size:22px;color:var(--pri);padding:4px 10px 16px;font-weight:800}
  #nav .brand span{color:var(--pri3)}
  #nav .brand.kb{display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.1}
  #nav .brand.kb small{display:block;font-family:Barlow;font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
  #nav button{flex:none;flex-direction:row;gap:12px;font-size:15.5px;padding:11px 12px;justify-content:flex-start}
  #nav button.on{background:#e7f3ec}
  .wrap{padding:22px 24px 40px}
}

/* CARDS & COMMON */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;gap:8px}
.sec h2{font-size:21px}
.sec .lnk{color:var(--pri2);font-weight:600;font-size:14px}
.mut{color:var(--mut)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.btn.p{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn.a{background:var(--acc);border-color:var(--acc);color:#2a2100}
.btn.r{background:#fff;border-color:#f1c4c4;color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.blk{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.stp input{width:100%}
.stp button{flex:none}
@media(max-width:420px){.stp button{width:40px}}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}
.empty .big{font-size:46px;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.seg{display:inline-flex;background:#e2e9e4;border-radius:11px;padding:3px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.badge.live{background:var(--live);color:#fff}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.badge.hk{background:#fde8e8;color:var(--red)}
.badge.er{background:#fff4d6;color:#8a6400}
@keyframes pulse{50%{opacity:.25}}

/* LOGO */
.lg{display:inline-grid;place-items:center;border-radius:30%;flex:none;overflow:hidden;color:#fff;line-height:1}
.lg img{width:100%;height:100%;object-fit:cover}

/* MATCH CARD */
.mac{display:block;width:100%;text-align:left;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px 12px;margin-bottom:10px}
.mac .mt{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:8px;gap:6px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tk{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.tk.ev{justify-content:flex-end;text-align:right}
.tk .tad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.kaz{font-weight:800}
.tk.kyb{color:var(--mut)}
.skor,.saat{font-family:var(--fd);font-size:26px;font-weight:800;min-width:74px;text-align:center;background:var(--soft);border-radius:10px;padding:2px 8px;letter-spacing:1px}
.saat{font-size:19px;color:var(--pri2);letter-spacing:0}
.skor.canli{background:var(--live);color:#fff}
.skor i{font-style:normal;opacity:.5;margin:0 2px}

/* HERO */
.hero{background:linear-gradient(135deg,#123f2c,#1b6b44);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border:2px solid rgba(255,255,255,.12);border-radius:50%}
.hero::after{content:"";position:absolute;right:48px;top:-40px;bottom:-40px;width:2px;background:rgba(255,255,255,.1)}
.hero h1{font-size:26px;line-height:1.05;position:relative}
.hero .hs{display:flex;gap:18px;margin-top:12px;position:relative;flex-wrap:wrap}
.hero .hs div{font-size:12px;opacity:.85}
.hero .hs b{display:block;font-family:var(--fd);font-size:24px;opacity:1}
.prog{height:7px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:12px;overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--acc);border-radius:9px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:12px;color:var(--mut);font-weight:700;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl .tkc{text-align:left;display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tbl .tkc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42vw}
.tbl .p{font-family:var(--fd);font-weight:800;font-size:18px}
.tbl .pos{width:30px;font-weight:700;color:var(--mut)}
.tbl tr.ilk .pos{color:#b88a00}
.tbl tr.ilk td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl .dt{display:none}
.tbl.detay .dt,.tblw.gen .dt{display:table-cell}
.tblw{overflow-x:auto;margin:0 -14px;padding:0 14px}
@media(min-width:700px){.tbl .dt{display:table-cell}.tbl .tkc span{max-width:none}}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:18px;height:18px;border-radius:5px;font-size:10.5px;font-style:normal;font-weight:800;color:#fff;display:grid;place-items:center}
.form .G{background:#16a34a}.form .B{background:#9ca3af}.form .M{background:#dc2626}

/* TEAM GRID */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--tc,#ccc)}
.tcard b{display:block;margin-top:8px;font-family:var(--fd);font-size:19px}
.thead{border-radius:18px;padding:18px;color:#fff;display:flex;gap:14px;align-items:center;margin-bottom:14px;position:relative;overflow:hidden}
.thead h1{font-size:28px}

/* PLAYER CARDS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pc{border-radius:14px;padding:10px 8px 9px;text-align:center;color:#2b1d00;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.12);overflow:hidden}
.pc.altin{background:linear-gradient(160deg,#fbe39a,#d9a92e 70%,#b98a1c)}
.pc.gumus{background:linear-gradient(160deg,#f1f4f6,#bcc6cc 70%,#99a5ad);color:#1e2a30}
.pc.bronz{background:linear-gradient(160deg,#f3cfae,#c98b58 70%,#a96d3e);color:#2e1708}
.pc .rt{position:absolute;left:8px;top:6px;font-family:var(--fd);font-weight:800;font-size:20px;line-height:1}
.pc .no{position:absolute;right:8px;top:7px;font-family:var(--fd);font-weight:700;font-size:14px;opacity:.75}
.pc .av{font-size:40px;margin:12px 0 2px}
.pc .pn{font-family:var(--fd);font-weight:700;font-size:16px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ps{display:flex;justify-content:center;gap:8px;font-size:11.5px;font-weight:700;margin-top:4px;opacity:.85}
.bigcard{width:250px;margin:4px auto 10px;padding:18px 16px 16px}
.bigcard .rt{font-size:38px;left:16px;top:14px}
.bigcard .no{font-size:20px;right:16px;top:16px}
.bigcard .av{font-size:86px;margin:26px 0 6px}
.bigcard .pn{font-size:26px}
.bigcard .tm{font-size:13px;font-weight:700;opacity:.8;margin-top:2px}
.bigcard .stt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;border-top:1px solid rgba(0,0,0,.15);padding-top:10px}
.bigcard .stt b{display:block;font-family:var(--fd);font-size:26px;line-height:1}
.bigcard .stt span{font-size:11px;font-weight:700;letter-spacing:.5px}

/* LISTS */
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.lst li:last-child{border-bottom:0}
.lst .n{width:24px;font-weight:700;color:var(--mut);text-align:center}
.lst .v{margin-left:auto;font-family:var(--fd);font-weight:800;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.tile b{display:block;font-family:var(--fd);font-size:28px;line-height:1.05}
.tile span{font-size:12.5px;color:var(--mut);font-weight:600}

/* FORMS */
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:#33443b}
.fld .hint{font-size:12.5px;color:var(--mut);margin-top:5px}
.inp{width:100%;height:48px;border:1px solid #cfd9d3;border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical}
.inp:focus{outline:2px solid var(--pri3);outline-offset:-1px;border-color:transparent}
.stp{display:flex;align-items:center;border:1px solid #cfd9d3;border-radius:12px;background:#fff;height:48px;overflow:hidden}
.stp button{width:48px;height:100%;font-size:22px;font-weight:700;color:var(--pri2);background:var(--soft)}
.stp input{flex:1;min-width:0;border:0;text-align:center;font-weight:700;font-size:18px;height:100%;background:transparent}
.stp input:focus{outline:none}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:#cbd5cf;border-radius:30px;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--pri3)}
.sw input:checked+i::after{transform:translateX(20px)}
.gunler{display:flex;gap:6px;flex-wrap:wrap}
.gunler button{width:48px;height:42px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700}
.gunler button.on{background:var(--pri2);color:#fff;border-color:var(--pri2)}
.tagl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 12px;border-radius:10px;background:#e7f3ec;font-weight:700;color:var(--pri)}
.tag button{width:26px;height:26px;border-radius:8px;color:var(--red);font-size:18px}
.krl{list-style:none;margin:0;padding:0}
.krl li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14.5px;font-weight:600}
.krl li.off{opacity:.45}
.krl li .k{flex:1}
.krl li .no{width:22px;height:22px;border-radius:7px;background:var(--pri2);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.krl li button{width:34px;height:34px;border-radius:9px;background:var(--soft);font-weight:700}
.krl li.sabit{background:#e7f3ec}

/* WIZARD */
.wz-steps{display:flex;gap:4px;margin-bottom:14px}
.wz-steps i{flex:1;height:5px;border-radius:5px;background:#d4ddd7}
.wz-steps i.on{background:var(--pri3)}
.wz-head{margin-bottom:14px}
.wz-head small{color:var(--pri2);font-weight:700;font-size:13px}
.wz-head h1{font-size:28px}
.wz-foot{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));display:flex;gap:10px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
@media(min-width:900px){.wz-foot{bottom:0}}
.wz-foot .btn{flex:1}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.trow .no{width:22px;color:var(--mut);font-weight:700;text-align:center;font-size:14px}
.trow .inp{flex:1}
.lgbtn{width:48px;height:48px;border-radius:12px;font-size:24px;flex:none;display:grid;place-items:center;overflow:hidden}
.lgbtn img{width:100%;height:100%;object-fit:cover}
.clr{width:48px;height:48px;border-radius:12px;border:1px solid #cfd9d3;padding:4px;background:#fff;flex:none}
.sumg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sumg div{background:var(--soft);border-radius:12px;padding:10px}
.sumg b{display:block;font-family:var(--fd);font-size:24px}
.sumg span{font-size:12.5px;color:var(--mut);font-weight:600}
.uyari{background:#fff4d6;border:1px solid #f1d68a;color:#6b4e00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.bilgi{background:#e7f3ec;border:1px solid #bfe0cc;color:#164d31;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* SHEET */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.ac{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(5,20,12,.5);animation:fi .2s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));animation:su .25s ease-out}
#sheet .grab{width:44px;height:5px;border-radius:5px;background:#c5cfc9;margin:4px auto 10px}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
#sheet .sh h2{font-size:22px}
#sheet .x{width:38px;height:38px;border-radius:11px;background:#fff;font-size:20px;flex:none}
@media(min-width:700px){#sheet .pn{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:560px;border-radius:20px;max-height:88vh;animation:fi .2s}}
@keyframes su{from{transform:translateY(100%)}}
@keyframes fi{from{opacity:0}}
.emg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.emg button{height:52px;border-radius:12px;background:#fff;font-size:28px;border:1px solid var(--line)}
.pbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pbtns button{min-height:58px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left;font-weight:700}
.pbtns button .a{font-size:26px}
.pbtns button small{display:block;font-weight:600;color:var(--mut);font-size:12px}

/* DETAIL */
.dsk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:6px 0 14px}
.dsk .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-family:var(--fd);font-size:18px;line-height:1.1}
.dsk .s{font-family:var(--fd);font-size:46px;font-weight:800;line-height:1}
.olay{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.olay.dep{flex-direction:row-reverse;text-align:right}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* LIVE */

/* Lig usulü fikstür (çember yöntemi). Tek sayıda takımda her turda bir takım BAY geçer.
   Çift devrede ikinci yarı, ilk yarının ev/deplasman yer değiştirmiş aynasıdır. */
function fiksturUret(ids, ciftDevre, kura){
  let a = [...ids]; if(kura) karistir(a);
  if(a.length % 2) a.push(null);
  const n = a.length, turlar = [];
  for(let r=0; r<n-1; r++){
    const maclar = []; let bay = null;
    for(let i=0; i<n/2; i++){
      const x = a[i], y = a[n-1-i];
      if(x===null || y===null){ bay = x===null ? y : x; continue; }
      let ev = x, dep = y;
      if(i===0 ? r%2===1 : i%2===1){ ev = y; dep = x; }

    turlar.push({maclar, bay});
    a = [a[0], a[n-1], ...a.slice(1, n-1)];
  }
  // Ev sahibi dengesi: fazla iç saha maçı olan takımın maçını, eksik olanla yer değiştir
  const ev = {}, top = {};
  turlar.forEach(t=>t.maclar.forEach(m=>{ ev[m.ev]=(ev[m.ev]||0)+1; ev[m.dep]=ev[m.dep]||0; top[m.ev]=(top[m.ev]||0)+1; top[m.dep]=(top[m.dep]||0)+1; }));

function tatilSet(tatiller){

  });
  return s;

function oyunGunleri(basTarih, ayar, adet){
  const ok = new Set(arr(ayar.gunler).map(Number)), tatil = tatilSet(ayar.tatiller), out = [];

  const kullan = {}, takimGun = {}, takimSon = {}, takimSlot = {};
  const isle = (m, tarih, saat) => {
    const k = tarih+'|'+saat; kullan[k] = (kullan[k]||0)+1;
    [m.ev, m.dep].forEach(t=>{
      takimGun[t+'|'+tarih] = (takimGun[t+'|'+tarih]||0)+1;
      takimSlot[t+'|'+k] = 1;
      if(!takimSon[t] || k > takimSon[t]) takimSon[t] = k;
    });

  const gunler = oyunGunleri(basTarih, ayar, Math.max(60, bekleyen.length*2 + 40));
  let son = null, tasan = 0;
  for(const m of bekleyen){

    for(let gi=0; gi<gunler.length && !yer; gi++){
      const g = gunler[gi];
      if((takimGun[m.ev+'|'+g]||0) >= gunMax || (takimGun[m.dep+'|'+g]||0) >= gunMax) continue;
      for(const s of slotlar){
        const k = g+'|'+s;
        if((kullan[k]||0) >= saha) continue;
        if(takimSlot[m.ev+'|'+k] || takimSlot[m.dep+'|'+k]) continue;
        if((takimSon[m.ev] && k <= takimSon[m.ev]) || (takimSon[m.dep] && k <= takimSon[m.dep])) continue;
        yer = {tarih:g, saat:s, saha:(kullan[k]||0)+1}; break;
      }
    }
    if(yer){ isle(m, yer.tarih, yer.saat); atama[m.id] = yer; if(!son || yer.tarih > son) son = yer.tarih; if(ayar.bitis && yer.tarih > ayar.bitis) tasan++; }
    else { atama[m.id] = {tarih:null, saat:null, saha:null}; yerlesmeyen++; }
  }
  return {atama, yerlesmeyen, son, tasan};
}

const KRITERLER = {
  h2hPuan:'Aralarındaki maçlarda puan',
  h2hAv:'Aralarındaki maçlarda averaj',
  h2hGol:'Aralarındaki maçlarda atılan gol',
  av:'Genel averaj',
  gol:'Atılan gol sayısı',
  galibiyet:'Galibiyet sayısı',
  yg:'Yenilen gol (az olan üstte)'
};
const VARSAYILAN_KRITER = ['h2hPuan','h2hAv','av','gol','galibiyet'];

function istatHesap(ids, maclar, P){
  const set = new Set(ids), s = {};
  ids.forEach(id=>{ s[id] = {id,o:0,g:0,b:0,m:0,ag:0,yg:0,p:0,av:0}; });
  maclar.forEach(m=>{
    if(!set.has(m.ev) || !set.has(m.dep)) return;
    const e = s[m.ev], d = s[m.dep], eg = +m.evGol||0, dg = +m.depGol||0;
    e.o++; d.o++; e.ag+=eg; e.yg+=dg; d.ag+=dg; d.yg+=eg;
    if(eg>dg){ e.g++; d.m++; e.p+=P.g; d.p+=P.m; }
    else if(eg<dg){ d.g++; e.m++; d.p+=P.g; e.p+=P.m; }
    else { e.b++; d.b++; e.p+=P.b; d.p+=P.b; }
  });
  Object.values(s).forEach(x=>{ x.av = x.ag - x.yg; });
  return s;
}

/* Süper Lig tipi sıralama: önce puan, eşitlikte seçili kriterler sırayla (ikili kriterler yalnızca eşit takımlar arasında). */
function siralamaHesap(T){
  const ay = T.ayar || {};
  const P = {g:+(ay.puanG ?? 3), b:+(ay.puanB ?? 1), m:+(ay.puanM ?? 0)};
  const ids = Object.keys(T.takimlar || {});
  const oyn = Object.values(T.maclar || {}).filter(m=>m.durum==='bitti' || m.durum==='hukmen');
  const genel = istatHesap(ids, oyn, P);
  const kr = ['puan', ...arr(ay.kriterler || VARSAYILAN_KRITER).filter(k=>KRITERLER[k])];
  const ad = id => (T.takimlar[id] && T.takimlar[id].ad) || '';
  function sirala(grup, k){
    if(grup.length <= 1) return grup;
    if(k >= kr.length) return [...grup].sort((a,b)=>ad(a).localeCompare(ad(b),'tr'));
    const c = kr[k]; let deger;
    if(c.startsWith('h2h')){
      const mini = istatHesap(grup, oyn, P);
      deger = id => c==='h2hPuan' ? mini[id].p : c==='h2hAv' ? mini[id].av : mini[id].ag;
    } else {
      deger = id => { const x = genel[id]; return c==='puan'?x.p : c==='av'?x.av : c==='gol'?x.ag : c==='galibiyet'?x.g : c==='yg'?-x.yg : 0; };
    }
    const v = grup.map(id=>({id, v:deger(id)})).sort((a,b)=>b.v-a.v), out = [];
    let i = 0;
    while(i < v.length){
      let j = i; while(j < v.length && v[j].v === v[i].v) j++;
      const alt = v.slice(i,j).map(x=>x.id);
      out.push(...(alt.length>1 ? sirala(alt, k+1) : alt));
      i = j;
    }
    return out;
  }
  const sira = sirala(ids, 0);
  const sirali = oyn.slice().sort((a,b)=>((a.tarih||'')+(a.saat||'')+String(a.sira||0).padStart(4,'0')).localeCompare((b.tarih||'')+(b.saat||'')+String(b.sira||0).padStart(4,'0')));
  const form = {}; ids.forEach(id=>form[id]=[]);
  sirali.forEach(m=>{
    const eg = +m.evGol||0, dg = +m.depGol||0;
    if(form[m.ev]) form[m.ev].push(eg>dg?'G':eg<dg?'M':'B');
    if(form[m.dep]) form[m.dep].push(dg>eg?'G':dg<eg?'M':'B');
  });
  return sira.map(id=>({...genel[id], form: form[id].slice(-5)}));
}

const Store = {
  mod:'yerel', db:null, auth:null, user:null, dinle:{},
  init(){
    if(FIREBASE_CONFIG && window.firebase){
      try{
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.database(); this.auth = firebase.auth(); this.mod = 'bulut';
        this.auth.onAuthStateChanged(u=>{ this.user = u; render(); });
      }catch(e){ console.error(e); this.mod = 'yerel'; }
    }
  },
  _ld(){ try{ return JSON.parse(localStorage.getItem('tm_veri') || '{}'); }catch(e){ return {}; } },
  _get(o,p){ return p.split('/').filter(Boolean).reduce((a,k)=>a==null?undefined:a[k], o); },
  _set(o,p,v){
    const k = p.split('/').filter(Boolean); let a = o;
    for(let i=0;i<k.length-1;i++){ if(typeof a[k[i]]!=='object' || a[k[i]]===null) a[k[i]] = {}; a = a[k[i]]; }
    if(v===null || v===undefined) delete a[k[k.length-1]]; else a[k[k.length-1]] = kopya(v);
  },
  _yay(){ const d = this._ld(); Object.values(this.dinle).forEach(x=>{ if(x.p!==undefined) x.cb(this._get(d,x.p) ?? null); }); },
  on(p, cb){
    const id = uid();
    if(this.mod==='bulut'){
      const ref = this.db.ref(KOK+'/'+p), f = s=>cb(s.val());
      ref.on('value', f, e=>{ console.error(e); toast('Veri okunamadı: '+e.message); });
      this.dinle[id] = {off:()=>ref.off('value', f)};
    } else {
      this.dinle[id] = {p, cb};
      setTimeout(()=>cb(this._get(this._ld(), p) ?? null));
    }
    return ()=>{ const x = this.dinle[id]; if(x && x.off) x.off(); delete this.dinle[id]; };
  },
  async update(obj){
    if(this.mod==='bulut'){
      const o = {}; for(const k in obj) o[k] = obj[k]==null ? null : kopya(obj[k]);
      try{ await this.db.ref(KOK).update(o); }
      catch(e){ toast(e.code==='PERMISSION_DENIED' ? 'Kaydedilemedi: yönetici girişi gerekli' : 'Kaydedilemedi: '+e.message); throw e; }
      return;
    }
    const d = this._ld(); for(const k in obj) this._set(d, k, obj[k]);
    try{ localStorage.setItem('tm_veri', JSON.stringify(d)); }catch(e){ toast('Yerel kayıt başarısız: depolama dolu olabilir'); }
    this._yay();
  },
  set(p, v){ return this.update({[p]:v}); },
  async oku(p){
    if(this.mod==='bulut'){ const sn = await this.db.ref(KOK + (p ? '/'+p : '')).once('value'); return sn.val(); }
    const d = this._ld(); return p ? (this._get(d, p) ?? null) : d;
  }
};

  const a = v.ayar;

  a.kriterler = a.kriterler ? arr(a.kriterler) : VARSAYILAN_KRITER.slice();

  if(yonetici()) it.push(['ayarlar','Ayarlar']);
  const aktif = S.view==='takim' ? 'takimlar' : S.view==='turnuvaAyar' ? 'ayarlar' : S.view;
  const k = S.kurum || {};
  const brand = k.ad ? `<div class="brand kb">${kurumLogo(40)}<div><b>${esc(k.ad)}</b>${k.altBaslik?`<small>${esc(k.altBaslik)}</small>`:''}</div></div>` : `<div class="brand">Turnuva <span>Merkezi</span></div>`;

function git(v){
  S.view = v; window.scrollTo(0,0); render();
}
function bosHtml(){

/* ===================== BUGÜN ===================== */
function macKart(m, opt={}){
  const e = takim(m.ev), d = takim(m.dep), oyn = oynandi(m) || m.durum==='canli';
  const eg = +m.evGol||0, dg = +m.depGol||0;
  const kaz = oynandi(m) ? (eg>dg?'ev':dg>eg?'dep':'') : '';
  const orta = oyn ? `<div class="skor ${m.durum==='canli'?'canli':''}">${eg}<i>-</i>${dg}</div>` : `<div class="saat">${esc(m.saat||'--:--')}</div>`;
  let rozet = '';
  if(m.durum==='canli') rozet = '<span class="badge live">Canlı</span>';
  else if(m.durum==='hukmen') rozet = '<span class="badge hk">Hükmen</span>';
  else if(m.durum==='ertelendi') rozet = '<span class="badge er">Ertelendi</span>';
  else if(m.durum==='bitti') rozet = '<span class="badge">MS</span>';
  const ust = [opt.tarihYok ? '' : (m.tarih ? tarihYaz(m.tarih) : 'Tarih yok'), oyn && m.saat && !opt.tarihYok ? m.saat : '', `${m.tur}. Tur`, (S.T.ayar.sahaSayisi>1 && m.saha) ? `Saha ${m.saha}` : ''].filter(Boolean).join(' · ');
  return `<button class="mac" onclick="macDetay('${m.id}')">
    <div class="mt"><span>${ust}</span>${rozet}</div>
    <div class="mrow">
      <div class="tk ev ${kaz==='ev'?'kaz':kaz?'kyb':''}"><span class="tad">${esc(e.ad)}</span>${logo(e)}</div>
      ${orta}
      <div class="tk dep ${kaz==='dep'?'kaz':kaz?'kyb':''}">${logo(d)}<span class="tad">${esc(d.ad)}</span></div>
    </div></button>`;
}
function bugunHtml(){
  const ms = macListe(), bg = bugun(), T = S.T;
  const toplam = ms.length, oyn = ms.filter(oynandi).length;
  const canli = ms.filter(m=>m.durum==='canli');
  const bugunM = ms.filter(m=>m.tarih===bg && m.durum!=='canli');
  let sonraki = null;
  if(!bugunM.filter(m=>!oynandi(m)).length){
    const gel = ms.filter(m=>m.tarih && m.tarih>bg && m.durum==='planli');
    if(gel.length){ const g = gel[0].tarih; sonraki = {g, ms:gel.filter(m=>m.tarih===g)}; }
  }
  const son = ms.filter(oynandi).filter(m=>m.tarih!==bg).reverse().slice(0,4);
  const sira = siralamaHesap(T);
  const lider = sira[0] && sira[0].o ? takim(sira[0].id) : null;
  const golcu = golcuListesi()[0];
  const bitti = toplam && oyn===toplam;
  const kr = S.kurum || {};
  let h = `<div class="hero">
    ${kr.ad ? `<div class="hk">${kurumLogo(26)}<span>${esc(kr.ad)}</span></div>` : ''}
    <h1>${bitti && lider ? '🏆 Şampiyon: '+esc(lider.ad) : esc(T.ayar.ad)}</h1>
    <div class="hs">
      <div><b>${oyn}/${toplam}</b>Oynanan maç</div>
      <div><b>${lider ? esc(lider.ad) : '—'}</b>Lider</div>
      <div><b>${golcu ? golcu.gol : '—'}</b>${golcu ? esc(oyuncuAd(oyuncu(golcu.tk,golcu.p))) : 'Gol kralı'}</div>
    </div>
    <div class="prog"><i style="width:${toplam?Math.round(oyn/toplam*100):0}%"></i></div>
  </div>`;
  if(canli.length) h += `<div class="sec"><h2>🔴 Şu an oynanıyor</h2></div>` + canli.map(m=>macKart(m)).join('');
  h += `<div class="sec"><h2>Bugün · ${tarihYaz(bg)}</h2></div>`;
  h += bugunM.length ? bugunM.map(m=>macKart(m,{tarihYok:true})).join('') : `<div class="card empty small">Bugün planlanmış maç yok.</div>`;
  if(sonraki) h += `<div class="sec"><h2>Sıradaki maç günü</h2><span class="mut small">${tarihYaz(sonraki.g, true)}</span></div>` + sonraki.ms.map(m=>macKart(m,{tarihYok:true})).join('');
  const ert = ms.filter(m=>m.durum==='ertelendi' || (!m.tarih && !oynandi(m) && m.durum!=='canli'));
  if(ert.length && yonetici()) h += `<div class="uyari">⚠️ ${ert.length} maçın tarihi yok (ertelenmiş). Ayarlar → Takvim bölümünden yeniden planlayabilirsiniz.</div>`;
  if(son.length) h += `<div class="sec"><h2>Son sonuçlar</h2><button class="lnk" onclick="git('fikstur')">Tümü →</button></div>` + son.map(m=>macKart(m)).join('');
  if(sira.length) h += `<div class="sec"><h2>Puan durumu</h2><button class="lnk" onclick="git('tablo')">Tam tablo →</button></div><div class="card">${tabloTablo(sira.slice(0,5), false)}</div>`;
  return h;
}

/* ===================== PUAN TABLOSU ===================== */

    <th>#</th><th style="text-align:left">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th class="dt">A</th><th class="dt">Y</th><th>AV</th><th>P</th><th class="dt">Form</th>
  </tr></thead><tbody>${sira.map((s,i)=>{ const t = takim(s.id); return `<tr class="${i===0&&s.o?'ilk':''}" onclick="takimAc('${s.id}')">
    <td class="pos">${i+1}</td><td><div class="tkc">${logo(t,26)}<span>${esc(t.ad)}</span></div></td>
    <td>${s.o}</td><td>${s.g}</td><td>${s.b}</td><td>${s.m}</td><td class="dt">${s.ag}</td><td class="dt">${s.yg}</td>
    <td>${s.av>0?'+':''}${s.av}</td><td class="p">${s.p}</td>
    <td class="dt"><div class="form">${s.form.map(f=>`<i class="${f}">${f}</i>`).join('') || '<span class="mut">—</span>'}</div></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function tabloHtml(){
  const sira = siralamaHesap(S.T), a = S.T.ayar;
  const kr = arr(a.kriterler).filter(k=>KRITERLER[k]);
  return `<div class="sec" style="margin-top:4px"><h2>Puan Tablosu</h2>
    <div class="row" style="gap:6px"><div class="seg"><button class="${!S.tDetay?'on':''}" onclick="S.tDetay=false;render()">Kısa</button><button class="${S.tDetay?'on':''}" onclick="S.tDetay=true;render()">Detaylı</button></div><button class="ibtn" title="İndir" onclick="indirMenu('tablo')">⬇️</button></div></div>
    <div class="card">${tabloTablo(sira, S.tDetay)}</div>
    <div class="card small mut">
      <b style="color:var(--ink)">Puanlama:</b> Galibiyet ${a.puanG ?? 3} · Beraberlik ${a.puanB ?? 1} · Yenilgi ${a.puanM ?? 0}<br>
      <b style="color:var(--ink)">Puan eşitliğinde:</b> ${kr.map((k,i)=>`${i+1}) ${KRITERLER[k]}`).join(' · ') || 'takım adı'}<br>
      O: oynanan · G: galibiyet · B: beraberlik · M: mağlubiyet · A/Y: atılan/yenilen ${esc(skorAd().toLowerCase())} · AV: averaj · P: puan
    </div>`;
}

/* ===================== FİKSTÜR ===================== */
function fiksturHtml(){
  const ms = macListe(), turSay = Math.max(0, ...ms.map(m=>m.tur));
  if(S.fTur===null){ const ilk = ms.filter(m=>!oynandi(m)).sort((a,b)=>a.tur-b.tur)[0]; S.fTur = ilk ? ilk.tur : 1; }
  const tk = S.fTakim;
  const filtre = m => !tk || m.ev===tk || m.dep===tk;
  const secenek = Object.values(S.T.takimlar).sort((a,b)=>(a.sira||0)-(b.sira||0)).map(t=>`<option value="${t.id}" ${tk===t.id?'selected':''}>${esc(t.ad)}</option>`).join('');
  let h = `<div class="sec" style="margin-top:4px"><h2>Fikstür</h2>
    <div class="row" style="gap:6px"><div class="seg"><button class="${S.fMod==='tur'?'on':''}" onclick="S.fMod='tur';render()">Tur</button><button class="${S.fMod==='tarih'?'on':''}" onclick="S.fMod='tarih';render()">Tarih</button></div><button class="ibtn" title="İndir" onclick="indirMenu('fikstur')">⬇️</button></div></div>
    <select class="inp" style="margin-bottom:10px" onchange="S.fTakim=this.value;render()"><option value="">Tüm takımlar</option>${secenek}</select>`;
  if(S.fMod==='tur' && !tk){
    h += `<div class="chips">${Array.from({length:turSay},(_,i)=>i+1).map(t=>`<button class="chip ${S.fTur===t?'on':''}" onclick="S.fTur=${t};render()">${t}. Tur</button>`).join('')}</div>`;
    const tm = ms.filter(m=>m.tur===S.fTur);
    const bay = S.T.baylar['t'+S.fTur];
    const yari = S.T.ayar.ligDevre===2 && turSay>1 ? (S.fTur > turSay/2 ? 'İkinci yarı' : 'İlk yarı') : '';
    h += `<div class="sec"><h2>${S.fTur}. Tur</h2><span class="mut small">${yari}</span></div>`;
    h += tm.map(m=>macKart(m)).join('');
    if(bay) h += `<div class="card small row">${logo(takim(bay),26)}<span><b>${esc(takim(bay).ad)}</b> bu tur <b>BAY</b> geçiyor.</span></div>`;
  } else if(S.fMod==='tur'){
    for(let t=1; t<=turSay; t++){
      const tm = ms.filter(m=>m.tur===t && filtre(m));
      const bay = S.T.baylar['t'+t];
      h += `<div class="sec"><h2>${t}. Tur</h2></div>`;
      h += tm.map(m=>macKart(m)).join('');
      if(bay===tk) h += `<div class="card small">Bu tur <b>BAY</b>.</div>`;
    }
  } else {
    const gruplar = {};
    ms.filter(filtre).forEach(m=>{ const k = m.tarih || 'yok'; (gruplar[k] = gruplar[k] || []).push(m); });
    Object.keys(gruplar).forEach(k=>{
      h += `<div class="sec"><h2>${k==='yok' ? 'Tarihi belirsiz' : tarihYaz(k,true)}</h2>${k===bugun()?'<span class="badge live">Bugün</span>':''}</div>`;
      h += gruplar[k].map(m=>macKart(m,{tarihYok:k!=='yok'})).join('');
    });
  }
  return h;
}

/* ===================== TAKIMLAR & OYUNCULAR ===================== */

function takimAc(id){ S.takimId = id; S.view = 'takim'; window.scrollTo(0,0); render(); }

      ${st.form.length?`<div class="form" style="justify-content:flex-start;margin-top:6px">${st.form.map(f=>`<i class="${f}">${f}</i>`).join('')}</div>`:''}</div></div>
    ${ad ? `<div class="row" style="margin-bottom:6px;flex-wrap:wrap"><button class="btn sm" onclick="takimDuzenle('${t.id}')">✏️ Takımı düzenle</button><button class="btn sm" onclick="oyuncuForm('${t.id}')">+ Oyuncu</button><button class="btn sm" onclick="topluOyuncu('${t.id}')">📋 Toplu ekle</button><button class="btn sm" onclick="indirMenu('takim')">⬇️ Kadro / kartlar</button></div>` : ''}
    <div class="sec"><h2>Oyuncular</h2><span class="mut small">${oy.length}${kadro?' / '+kadro:''}</span></div>
    ${kadro && oy.length>kadro ? `<div class="uyari">Kadro sınırı ${kadro} oyuncu, bu takımda ${oy.length} oyuncu var.</div>`:''}
    ${oy.length ? `<div class="pgrid">${oy.map(p=>oyuncuKart(t,p)).join('')}</div>` : `<div class="card empty small">Henüz oyuncu eklenmedi.${ad?' “+ Oyuncu” ile ekleyebilirsiniz.':''}</div>`}
    <div class="sec"><h2>Maçları</h2></div>${ms.map(m=>macKart(m)).join('')}`;

function oyuncuKart(t, p){
  const s = oyuncuIstat(t.id, p.id);
  return `<button class="pc ${s.tier}" onclick="oyuncuAc('${t.id}','${p.id}')"><span class="rt">${s.rt}</span><span class="no">${p.no?'#'+esc(p.no):''}</span>
    <div class="av">${oyuncuGorsel(p,56)}</div><div class="pn">${esc(oyuncuAd(p))}</div>
    <div class="ps"><span>⚽ ${s.gol}</span><span>⭐ ${s.mvp}</span></div></button>`;
}
function oyuncuAc(tk, pid){
  const t = takim(tk), p = oyuncu(tk, pid); if(!p) return;
  const s = oyuncuIstat(tk, pid);
  sheet(`<div class="sh"><h2>Oyuncu Kartı</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="pc bigcard ${s.tier}"><span class="rt">${s.rt}</span><span class="no">${p.no?'#'+esc(p.no):''}</span>
      <div class="av">${oyuncuGorsel(p,112)}</div><div class="pn">${esc(oyuncuAd(p))}</div><div class="tm">${esc(t.ad)}</div>
      <div class="stt"><div><b>${s.gol}</b><span>${esc(skorAd().toLocaleUpperCase('tr'))}</span></div><div><b>${s.mvp}</b><span>MAÇIN OYU.</span></div><div><b>${s.mac}</b><span>MAÇ</span></div></div></div>
    <p class="mut small" style="text-align:center">Kart puanı ${skorAd().toLowerCase()} ve “Maçın Oyuncusu” seçimleriyle yükselir: 80+ altın, 70+ gümüş.</p>
    ${yonetici() ? `<div class="acts"><button class="btn" onclick="oyuncuForm('${tk}','${pid}')">✏️ Düzenle</button><button class="btn r" onclick="oyuncuSil('${tk}','${pid}')">Sil</button></div>`:''}`);
}
function oyuncuForm(tk, pid){
  const p = pid ? oyuncu(tk,pid) : {ad:'', no:'', avatar:AVATAR[Math.floor(Math.random()*AVATAR.length)]};
  window._av = p.avatar || '🧒'; window._foto = p.foto || null;
  sheet(`<div class="sh"><h2>${pid?'Oyuncuyu düzenle':'Oyuncu ekle'}</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="fotoalan"><span id="oFotoOn" class="fotoon">${p.foto?`<img src="${p.foto}">`:esc(window._av)}</span>
      <div><label class="btn sm" style="cursor:pointer">📷 Fotoğraf ekle<input type="file" accept="image/*" hidden onchange="oyuncuFotoSec(this)"></label>
      <button class="btn sm r" id="oFotoSil" style="${p.foto?'':'display:none'}" onclick="oyuncuFotoKaldir()">Kaldır</button>
      <div class="hint small mut" style="margin-top:6px">Kare kırpılır ve küçültülür. İzleyicide gösterim Ayarlar → Gizlilik'ten açılır.</div></div></div>
    <div class="fld"><label>Ad Soyad</label><input class="inp" id="oAd" value="${esc(p.ad)}" placeholder="Örn. Ali Yılmaz"></div>
    <div class="fld"><label>Forma numarası</label><input class="inp" id="oNo" type="number" inputmode="numeric" value="${esc(p.no)}"></div>
    <div class="fld"><label>Avatar <span class="mut small">(fotoğraf yoksa ya da gizliyse görünür)</span></label><div class="emg" id="oAv">${AVATAR.map(a=>`<button onclick="oyuncuAvSec(this,'${a}')" style="${a===window._av?'outline:3px solid var(--pri3)':''}">${a}</button>`).join('')}</div></div>
    <button class="btn p blk" onclick="oyuncuKaydet('${tk}','${pid||''}')">Kaydet</button>`);
  setTimeout(()=>{ const el = $('#oAd'); if(el && !pid) el.focus(); }, 250);
}
function oyuncuAvSec(btn, a){
  window._av = a; [...btn.parentNode.children].forEach(b=>b.style.outline=''); btn.style.outline = '3px solid var(--pri3)';
  if(!window._foto) $('#oFotoOn').textContent = a;
}
async function oyuncuFotoSec(inp){
  const f = inp.files[0]; if(!f) return;
  try{ window._foto = await gorselKucult(f, 240, 'image/jpeg', .82); $('#oFotoOn').innerHTML = `<img src="${window._foto}">`; $('#oFotoSil').style.display = ''; }
  catch(e){ toast('Fotoğraf okunamadı'); }
}
function oyuncuFotoKaldir(){ window._foto = null; $('#oFotoOn').textContent = window._av; $('#oFotoSil').style.display = 'none'; }
async function oyuncuKaydet(tk, pid){
  const ad = $('#oAd').value.trim(); if(!ad){ toast('Ad soyad girin'); return; }
  const id = pid || 'p'+uid();
  await Store.set(tp(`takimlar/${tk}/oyuncular/${id}`), {ad, no:$('#oNo').value.trim(), avatar:window._av||'🧒', foto:window._foto||null});
  sheetKapat(); toast('Oyuncu kaydedildi');
}
async function oyuncuSil(tk, pid){
  if(!confirm('Bu oyuncu silinsin mi? Attığı goller skorlarda kalır ama gol krallığından çıkar.')) return;
  await Store.set(tp(`takimlar/${tk}/oyuncular/${pid}`), null); sheetKapat();
}
function topluOyuncu(tk){
  sheet(`<div class="sh"><h2>Toplu oyuncu ekle</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="fld"><label>Her satıra bir öğrenci</label><textarea class="inp" id="toplu" placeholder="7 Ali Yılmaz&#10;10 Ayşe Demir&#10;Mehmet Kaya"></textarea>
    <div class="hint">Satır başındaki sayı forma numarası olarak alınır (isteğe bağlı). e-Okul listesinden kopyalayıp yapıştırabilirsiniz.</div></div>
    <button class="btn p blk" onclick="topluKaydet('${tk}')">Ekle</button>`);
}
async function topluKaydet(tk){
  const satir = $('#toplu').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!satir.length) return;
  const up = {}; let n = Object.keys(takim(tk).oyuncular).length;
  satir.forEach(s=>{
    const m = s.match(/^(\d+)[\s.\-)]+(.+)$/);
    const no = m ? m[1] : String(++n), ad = (m ? m[2] : s).replace(/\s+/g,' ');
    up[tp(`takimlar/${tk}/oyuncular/p${uid()}`)] = {ad, no, avatar:AVATAR[Math.floor(Math.random()*AVATAR.length)]};
  });
  await Store.update(up); sheetKapat(); toast(satir.length+' oyuncu eklendi');
}

/* ===================== CANLI MAÇ ===================== */
let canliId = null, krTick = null;
function canliAc(mid){
  sheetKapat(); canliId = mid;
  const m = S.T.maclar[mid];
  if(m.durum!=='canli') Store.update({[mp(mid,'durum')]:'canli', [mp(mid,'tarih')]:m.tarih||bugun()});
  $('#canli').classList.add('ac'); document.body.style.overflow = 'hidden';
  canliRender(); clearInterval(krTick); krTick = setInterval(krYaz, 500);
}
function canliKapat(){ canliId = null; clearInterval(krTick); $('#canli').classList.remove('ac'); document.body.style.overflow = ''; }
function kr(mid){ try{ return JSON.parse(localStorage.getItem('tm_kr_'+mid)) || {gecen:0, bas:null, devre:1}; }catch(e){ return {gecen:0, bas:null, devre:1}; } }
function krKaydet(mid, k){ try{ localStorage.setItem('tm_kr_'+mid, JSON.stringify(k)); }catch(e){} }
function krMs(k){ return k.gecen + (k.bas ? Date.now()-k.bas : 0); }
function krYaz(){
  if(!canliId) return; const k = kr(canliId), ms = krMs(k), el = $('#krono'); if(!el) return;
  const sure = (+S.T.ayar.sure||0)*60000, s = Math.floor(ms/1000);
  el.textContent = pad(Math.floor(s/60))+':'+pad(s%60);
  el.classList.toggle('bitti', sure>0 && ms>=sure);
}
function krBas(){ const k = kr(canliId); if(k.bas){ k.gecen += Date.now()-k.bas; k.bas = null; } else k.bas = Date.now(); krKaydet(canliId,k); canliRender(); }
function krDevre(){ const k = kr(canliId), max = +S.T.ayar.macDevre||1; if(k.devre>=max){ toast('Son devre'); return; } k.devre++; k.gecen = 0; k.bas = null; krKaydet(canliId,k); canliRender(); }
function krSifir(){ if(!confirm('Süre sıfırlansın mı?')) return; krKaydet(canliId,{gecen:0,bas:null,devre:1}); canliRender(); }
function canliDk(){ const k = kr(canliId); return Math.floor(krMs(k)/60000)+1 + (k.devre-1)*(+S.T.ayar.sure||0); }
function canliRender(){
  if(!canliId || !S.T) return; const m = S.T.maclar[canliId]; if(!m){ canliKapat(); return; }
  const e = takim(m.ev), d = takim(m.dep), k = kr(canliId), maxD = +S.T.ayar.macDevre||1, sa = skorAd();
  const ol = m.olaylar.map((o,i)=>({o,i})).filter(x=>x.o.t==='g').reverse().map(({o,i})=>{ const p = oyuncu(o.tk,o.p), dep = o.tk===m.dep;
    return `<div class="olay ${dep?'dep':''}"><span>⚽</span><span>${o.dk?o.dk+"' ":''}<b>${esc(p?oyuncuAd(p):'Belirtilmemiş')}</b> <span style="opacity:.6">${esc(takim(o.tk).kisa||takim(o.tk).ad)}</span></span><button onclick="olaySil(${i})">✕</button></div>`; }).join('');
  $('#canli').innerHTML = `
    <div class="ct"><button class="x" onclick="canliKapat()">← Geri</button><span class="badge live">Canlı</span><span class="small" style="opacity:.7">${m.tur}. Tur</span></div>
    ${+S.T.ayar.sure ? `<div class="krono"><button onclick="krSifir()">↺</button><b id="krono">00:00</b><button onclick="krBas()">${k.bas?'⏸':'▶'}</button></div>
    <div class="ldv">${maxD>1?`${k.devre}. devre / ${maxD} · `:''}${S.T.ayar.sure} dk ${maxD>1&&k.devre<maxD?` · <button style="color:var(--acc);font-weight:700" onclick="krDevre()">Sonraki devre →</button>`:''}</div>` : ''}
    <div class="lsk">
      <div class="t">${logo(e,62)}${esc(e.ad)}<button class="golb" style="background:${esc(e.renk)}" onclick="golSec('${m.ev}')">+ ${esc(sa.toLocaleUpperCase('tr'))}</button></div>
      <div class="s">${m.evGol||0}<span style="opacity:.4">:</span>${m.depGol||0}</div>
      <div class="t">${logo(d,62)}${esc(d.ad)}<button class="golb" style="background:${esc(d.renk)}" onclick="golSec('${m.dep}')">+ ${esc(sa.toLocaleUpperCase('tr'))}</button></div>
    </div>
    <div class="lolay">${ol || `<div class="olay" style="opacity:.6;justify-content:center;border:0">Henüz ${esc(sa.toLowerCase())} yok</div>`}</div>
    <button class="btn a blk" style="height:58px;font-size:19px;margin-top:12px" onclick="macBitir()">🏁 Maçı bitir</button>`;
  krYaz();
}
function golSec(tk){
  const t = takim(tk), oy = Object.values(t.oyuncular).sort((a,b)=>(+a.no||99)-(+b.no||99));
  if(!oy.length){ golEkle(tk, null); return; }
  sheet(`<div class="sh"><h2>${logo(t,28)} ${esc(skorAd())} kimden?</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    <div class="pbtns">${oy.map(p=>`<button onclick="golEkle('${tk}','${p.id}')"><span class="a">${oyuncuGorsel(p,36)}</span><span>${esc(oyuncuAd(p))}<small>${p.no?'#'+esc(p.no):''}</small></span></button>`).join('')}
    <button onclick="golEkle('${tk}',null)"><span class="a">❔</span><span>Belirtilmemiş</span></button></div>`);
}
async function golEkle(tk, pid){
  sheetKapat();
  const m = S.T.maclar[canliId], ol = [...m.olaylar, {t:'g', tk, p:pid||null, dk:+S.T.ayar.sure ? canliDk() : null}];
  const evG = (+m.evGol||0) + (tk===m.ev?1:0), depG = (+m.depGol||0) + (tk===m.dep?1:0);
  if(navigator.vibrate) navigator.vibrate(60);
  await Store.update({[mp(m.id,'olaylar')]:ol, [mp(m.id,'evGol')]:evG, [mp(m.id,'depGol')]:depG});
}
async function olaySil(i){
  const m = S.T.maclar[canliId], o = m.olaylar[i]; if(!o) return;
  if(!confirm('Bu '+skorAd().toLowerCase()+' silinsin mi?')) return;
  const ol = m.olaylar.filter((_,j)=>j!==i);
  await Store.update({[mp(m.id,'olaylar')]:ol.length?ol:null, [mp(m.id,'evGol')]:Math.max(0,(+m.evGol||0)-(o.tk===m.ev?1:0)), [mp(m.id,'depGol')]:Math.max(0,(+m.depGol||0)-(o.tk===m.dep?1:0))});
}
function macBitir(){
  const m = S.T.maclar[canliId], e = takim(m.ev), d = takim(m.dep);
  const oy = [...Object.values(e.oyuncular).map(p=>({p,tk:m.ev})), ...Object.values(d.oyuncular).map(p=>({p,tk:m.dep}))];
  sheet(`<div class="sh"><h2>🏁 Maçı bitir · ${m.evGol||0}-${m.depGol||0}</h2><button class="x" onclick="sheetKapat()">✕</button></div>
    ${oy.length ? `<p class="mut small" style="margin-top:0">⭐ Maçın oyuncusunu seçin:</p><div class="pbtns">${oy.map(x=>`<button onclick="bitirKaydet('${x.tk}','${x.p.id}')"><span class="a">${oyuncuGorsel(x.p,36)}</span><span>${esc(oyuncuAd(x.p))}<small>${esc(takim(x.tk).ad)}</small></span></button>`).join('')}</div>` : ''}
    <button class="btn p blk" style="margin-top:12px" onclick="bitirKaydet()">${oy.length?'Seçmeden bitir':'Maçı bitir'}</button>`);
}
async function bitirKaydet(tk, pid){
  const m = S.T.maclar[canliId];
  await Store.update({[mp(m.id,'durum')]:'bitti', [mp(m.id,'mvp')]:pid?{tk,p:pid}:null});
  const k = kr(m.id); if(k.bas){ k.gecen += Date.now()-k.bas; k.bas = null; krKaydet(m.id,k); }
  sheetKapat(); canliKapat(); toast('Maç sonucu kaydedildi');
}

/* ===================== SHEET ===================== */
function sheet(html, koru){

function tatilSil(p, i){ const o = obj(p); o.tatiller = arr(o.tatiller).filter((_,j)=>j!==i); render(); }
function kriterEditor(p){

function krT(p, i, d){ const o = obj(p), a = arr(o.kriterler), j = i+d; if(j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; o.kriterler = a; render(); }

function wTakimSay(){
  const n = Math.max(2, Math.min(40, +W.ayar.takimSayisi||2)); W.ayar.takimSayisi = n;
  while(W.takimlar.length < n){ const i = W.takimlar.length; W.takimlar.push({ad:'', renk:RENK[i%RENK.length], logo:TAKIM_LOGO[i%TAKIM_LOGO.length], logoImg:null}); }

function wHizliDoldur(){
  const sev = $('#hSev').value.trim(), sb = $('#hSub').value.trim().toLocaleUpperCase('tr');
  let harfler = [];
  const m = sb.match(/^([A-ZÇĞİÖŞÜ])\s*-\s*([A-ZÇĞİÖŞÜ])$/);
  const ALF = 'ABCDEFGHIJKLMNOPRSTUVYZ';
  if(m){ const a = ALF.indexOf(m[1]), b = ALF.indexOf(m[2]); for(let i=a;i<=b;i++) harfler.push(ALF[i]); }
  else harfler = sb.split(/[\s,;]+/).filter(Boolean).flatMap(x=>x.length>1 && !/\d/.test(x) ? x.split('') : [x]);
  if(!harfler.length){ toast('Şubeleri girin (ör. A-F veya A,B,C)'); return; }
  const isimler = [];
  sev.split(/[\s,;]+/).filter(Boolean).forEach(s=>harfler.forEach(h=>isimler.push(`${s}-${h}`)));
  if(!sev) harfler.forEach(h=>isimler.push(h));
  W.ayar.takimSayisi = Math.min(40, isimler.length); wTakimSay();
  isimler.slice(0,40).forEach((ad,i)=>W.takimlar[i].ad = ad);
  render(); toast(isimler.length+' takım dolduruldu');
}

function wHata(){
  const a = W.ayar;
  if(W.adim===0 && !a.ad.trim()) return 'Turnuva adını girin.';
  if(W.adim===1){
    const ad = W.takimlar.map(t=>t.ad.trim());
    if(ad.some(x=>!x)) return 'Tüm takımlara isim verin.';
    if(new Set(ad.map(x=>x.toLocaleLowerCase('tr'))).size !== ad.length) return 'Aynı isimde iki takım var.';
  }
  if(W.adim===4){
    if(!a.baslangic || !a.bitis) return 'Başlangıç ve bitiş tarihini seçin.';
    if(a.bitis < a.baslangic) return 'Bitiş tarihi başlangıçtan önce olamaz.';
    if(!arr(a.gunler).length) return 'En az bir oyun günü seçin.';
    if(!arr(a.slotlar).length) return 'En az bir maç saati ekleyin.';
  }
  return '';

  return {turSay:tr.length, macSay:bek.length, bay:W.takimlar.length%2===1, plan, gunSay, kapasite:gunSay*arr(a.slotlar).length*Math.max(1,+a.sahaSayisi||1)};

function kuraAnimasyon(takimlar){

    const ciz = l => { el.innerHTML = `<h1>🎲 Kura çekiliyor…</h1><div class="kl">${l.map(t=>`<div>${logo(t,28)}${esc(t.ad)}</div>`).join('')}</div>`; };
    const iv = setInterval(()=>{ ciz(karistir(takimlar.slice())); if(++n>14){ clearInterval(iv); el.querySelector('h1').textContent = '✅ Fikstür hazır!'; setTimeout(()=>{ el.classList.remove('ac'); res(); }, 900); } }, 130);

async function turnuvaOlustur(){
  const a = W.ayar, tid = 't'+uid();
  const takimlar = {}, ids = [];
  W.takimlar.forEach((t,i)=>{ const id = 'k'+uid(); ids.push(id); takimlar[id] = {ad:t.ad.trim(), renk:t.renk, logo:t.logo, logoImg:t.logoImg||null, sira:i, kisa:t.ad.trim().slice(0,12)}; });
  await kuraAnimasyon(W.takimlar);
  const turlar = fiksturUret(ids, a.ligDevre===2, a.kura!=='sirali');
  const maclar = {}, bek = [], baylar = {}; let sira = 0;
  turlar.forEach((tr,ri)=>{
    if(tr.bay) baylar['t'+(ri+1)] = tr.bay;
    tr.maclar.forEach(m=>{ const id = 'm'+String(++sira).padStart(3,'0'); maclar[id] = {tur:ri+1, ev:m.ev, dep:m.dep, durum:'planli', evGol:0, depGol:0, sira}; bek.push({id, ev:m.ev, dep:m.dep}); });
  });
  const plan = planla(bek, a, [], a.baslangic);
  Object.entries(plan.atama).forEach(([id,x])=>{ Object.assign(maclar[id], x); if(!x.tarih) maclar[id].durum = 'ertelendi'; });
  const ayar = kopya(a); delete ayar.takimSayisi;
  const T = {ayar, takimlar, maclar, baylar, olusturma:Date.now()};
  const up = {['t/'+tid]:T, ['liste/'+tid]:{ad:a.ad.trim(), tur:a.tur, logo:a.logo, olusturma:Date.now()}};
  if(!S.aktif || !S.liste[S.aktif]) up.aktif = tid;
  try{ await Store.update(up); }catch(e){ return; }
  W = null; S.view = 'bugun'; turnuvaAc(tid);
  toast('Turnuva oluşturuldu: '+bek.length+' maç planlandı');
}

async function yenidenPlanla(tur){
  const bas = $('#ypBas').value || bugun();
  const ayar = S.T.ayar, ms = macListe();
  const bek = ms.filter(m=>tur==='ertelenen' ? (!m.tarih && !oynandi(m) && m.durum!=='canli') : (!oynandi(m) && m.durum!=='canli' && (!m.tarih || m.tarih>=bas || m.durum==='ertelendi'))).sort((a,b)=>a.tur-b.tur || a.sira-b.sira);
  if(!bek.length){ toast('Planlanacak maç yok'); return; }
  if(!confirm(`${bek.length} maç ${tarihYaz(bas,true)} tarihinden itibaren yeniden planlanacak. Devam edilsin mi?`)) return;
  const ids = new Set(bek.map(m=>m.id));
  const dolu = ms.filter(m=>!ids.has(m.id) && m.tarih);
  const p = planla(bek.map(m=>({id:m.id, ev:m.ev, dep:m.dep})), ayar, dolu, bas);
  const up = {};
  Object.entries(p.atama).forEach(([id,x])=>{ up[mp(id,'tarih')] = x.tarih; up[mp(id,'saat')] = x.saat; up[mp(id,'saha')] = x.saha; up[mp(id,'durum')] = x.tarih ? 'planli' : 'ertelendi'; });
  await Store.update(up);
  toast(`${bek.length - p.yerlesmeyen} maç planlandı${p.tasan?`, ${p.tasan} maç bitiş tarihini aşıyor`:''}`);
}

      sheetKapat();
      if(tOff) tOff(); tOff = null; S.tid = null; S.T = null;
      await Store.update({t:Object.keys(t).length ? t : null, liste:Object.keys(liste).length ? liste : null, kurum:d.kurum && Object.keys(d.kurum).length ? d.kurum : null, aktif:d.aktif && t[d.aktif] ? d.aktif : (Object.keys(t)[0] || null)});

        const yeni = S.liste[id] ? 't'+uid() : id;
        const l = Object.assign({}, liste[id]); if(yeni !== id) l.ad = (l.ad||'Turnuva') + ' (yedek)';
        up['t/'+yeni] = t[id]; up['liste/'+yeni] = l; n++;
      });

function gorselKucult(file, size, tip='image/jpeg', q=.82){
  return new Promise((res, rej)=>{
    const r = new FileReader(); r.onerror = rej;
    r.onload = ()=>{ const img = new Image(); img.onerror = rej; img.onload = ()=>{
      const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
      if(tip==='image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0,0,size,size); }
      const k = Math.min(img.width, img.height);
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, (img.width-k)/2, (img.height-k)/2, k, k, 0, 0, size, size);
      res(c.toDataURL(tip, q));
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function fotoGorunur(p){ return !!(p && p.foto && (yonetici() || (S.kurum||{}).fotoGoster)); }

  return `<span class="pav" style="font-size:${Math.round(size*.78)}px">${esc((p && p.avatar) || '🧒')}</span>`;
}

/* ---------- Excel ---------- */
async function excelYaz(dosya, sayfalar){
  await kutuphane('xls');
  const k = S.kurum || {}, a = S.T.ayar, wb = XLSX.utils.book_new();
  const cz = {style:'thin', color:{rgb:'C9D3CC'}}, brd = {top:cz, bottom:cz, left:cz, right:cz};
  const adlar = new Set();
  sayfalar.forEach(sf=>{
    const n = sf.kolonlar.length;
    const aoa = [[k.ad || a.ad], [(k.ad ? a.ad + '  ·  ' : '') + sf.baslik], ['Oluşturma: ' + simdiYaz() + (k.egitimYili ? '   ·   ' + k.egitimYili + ' Eğitim-Öğretim Yılı' : '')], []];
    aoa.push(sf.kolonlar.map(c=>c.ad));
    sf.satirlar.forEach(r=>aoa.push(r.map(hv)));
    if(!sf.satirlar.length) aoa.push(['Kayıt yok']);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [0,1,2].map(r=>({s:{r, c:0}, e:{r, c:Math.max(0, n-1)}}));
    ws['!cols'] = sf.kolonlar.map(c=>({wch:c.w || 10}));
    ws['!rows'] = [{hpt:26}, {hpt:20}, {hpt:16}, {hpt:6}, {hpt:24}];
    const set = (r, c, st)=>{ const ref = XLSX.utils.encode_cell({r, c}); if(!ws[ref]) ws[ref] = {t:'s', v:''}; ws[ref].s = st; };
    set(0, 0, {font:{bold:true, sz:16, color:{rgb:'0B3D2A'}}, alignment:{vertical:'center'}});
    set(1, 0, {font:{bold:true, sz:12, color:{rgb:'13693F'}}});
    set(2, 0, {font:{italic:true, sz:9, color:{rgb:'6B7A71'}}});
    for(let c=0; c<n; c++) set(4, c, {font:{bold:true, sz:10, color:{rgb:'FFFFFF'}}, fill:{patternType:'solid', fgColor:{rgb:'13693F'}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:brd});
    sf.satirlar.forEach((row, i)=>{
      for(let c=0; c<n; c++){
        const kol = sf.kolonlar[c], st = {border:brd, alignment:{horizontal:kol.al || 'center', vertical:'center'}, font:{sz:10, bold:!!kol.b}};
        if(sf.vurgu && sf.vurgu.includes(i)) st.fill = {patternType:'solid', fgColor:{rgb:'FFF4CC'}};
        else if(i%2) st.fill = {patternType:'solid', fgColor:{rgb:'F3F7F4'}};
        set(5+i, c, st);
      }
    });
    if(sf.satirlar.length) ws['!autofilter'] = {ref:XLSX.utils.encode_range({s:{r:4, c:0}, e:{r:4+sf.satirlar.length, c:n-1}})};
    let ad = sf.ad.replace(/[\[\]:*?\/\\]/g, '').slice(0, 31), i = 2;
    while(adlar.has(ad)) ad = sf.ad.slice(0, 28) + ' ' + (i++);
    adlar.add(ad);
    XLSX.utils.book_append_sheet(wb, ws, ad);
  });
  XLSX.writeFile(wb, dosya + '.xlsx');
}
function vTablo(){
  const sira = siralamaHesap(S.T);
  return {ad:'Puan Tablosu', baslik:'Puan Tablosu', vurgu: sira[0] && sira[0].o ? [0] : [],
    kolonlar:[{ad:'Sıra', w:6}, {ad:'Takım', w:24, al:'left', b:1}, {ad:'O', w:6}, {ad:'G', w:6}, {ad:'B', w:6}, {ad:'M', w:6}, {ad:'Atılan', w:8}, {ad:'Yenilen', w:8}, {ad:'Averaj', w:8}, {ad:'Puan', w:8, b:1}, {ad:'Son 5 maç', w:14}],
    satirlar: sira.map((s, i)=>[i+1, takim(s.id).ad, s.o, s.g, s.b, s.m, s.ag, s.yg, s.av, s.p, s.form.join(' ')])};

function vFikstur(){
  const ms = Object.values(S.T.maclar).sort((a,b)=>a.tur-b.tur || ((a.tarih||'9')+(a.saat||'')).localeCompare((b.tarih||'9')+(b.saat||'')) || a.sira-b.sira);
  const saha = +S.T.ayar.sahaSayisi > 1;
  const kol = [{ad:'Tur', w:6}, {ad:'Tarih', w:12}, {ad:'Gün', w:11}, {ad:'Saat', w:8}];
  if(saha) kol.push({ad:'Saha', w:6});
  kol.push({ad:'Ev Sahibi', w:22, al:'right', b:1}, {ad:'Skor', w:9, b:1}, {ad:'Deplasman', w:22, al:'left', b:1}, {ad:'Durum', w:11}, {ad:'Maçın Oyuncusu', w:22, al:'left'});
  return {ad:'Fikstür', baslik:'Fikstür ve Sonuçlar', kolonlar:kol, satirlar: ms.map(m=>{
    const d = m.tarih ? parseD(m.tarih) : null, mvp = m.mvp && oyuncu(m.mvp.tk, m.mvp.p);
    const r = [m.tur + '. Tur', d ? d.toLocaleDateString('tr-TR') : '—', d ? GUN_UZUN[d.getDay()] : '', m.saat || ''];
    if(saha) r.push(m.saha || '');
    r.push(takim(m.ev).ad, (oynandi(m) || m.durum==='canli') ? `${m.evGol} - ${m.depGol}` : '-', takim(m.dep).ad, durumYaz(m), mvp ? oyuncuAd(mvp) : '');
    return r;
  })};

async function pdfYaz(baslik, govde, opt, dosya){

    await html2pdf().set({
      margin:[10, 10, 13, 10], filename:dosya + '.pdf',
      image:{type:'jpeg', quality:.96},
      html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', width:718, windowWidth:718, scrollX:0, scrollY:0},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},

      for(let i=1; i<=n; i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(130); pdf.text('Sayfa ' + i + ' / ' + n, w - 10, h - 6, {align:'right'}); }
    }).save();

}

      <div><h2>Sıradaki Maçlar</h2>${gel.map(m=>`<div style="font-size:1.8vh;opacity:.7;margin-top:1vh">${tarihYaz(m.tarih)}</div>${sat(m,false)}`).join('') || '<p style="opacity:.6">Planlanmış maç yok.</p>'}</div></div>`;
  }
  if(tvI===2){
    const g = golcuListesi().slice(0,8), mv = mvpListesi().slice(0,8);
    const sat = (x,v) => { const p = oyuncu(x.tk,x.p), t = takim(x.tk); return `<div class="tvm" style="grid-template-columns:auto 1fr auto">${oyuncuGorsel(p,46)}<div><b>${esc(oyuncuAd(p))}</b><div style="font-size:1.8vh;opacity:.7">${esc(t.ad)}</div></div><div class="s">${v}</div></div>`; };
    b = `<div class="tvcols"><div><h2>👑 ${esc(skorAd())} Krallığı</h2>${g.map(x=>sat(x,x.gol)).join('') || '<p style="opacity:.6">Henüz veri yok.</p>'}</div><div><h2>⭐ Maçın Oyuncusu</h2>${mv.map(x=>sat(x,x.n)).join('') || '<p style="opacity:.6">Henüz veri yok.</p>'}</div></div>`;
  }
  $('#tv').innerHTML = `<div class="tvh"><span style="font-size:5vh">${esc(S.T.ayar.logo||'🏆')}</span><h1>${esc(S.T.ayar.ad)}</h1><button class="x" onclick="tvKapat()">Kapat ✕</button></div>
    <div class="tvb">${b}</div><div class="tvdots">${[0,1,2].map(i=>`<i class="${i===tvI?'on':''}"></i>`).join('')}</div>`;
}

/* ===================== BAŞLAT ===================== */
Store.init();
Store.on('liste', v=>{ S.liste = v || {}; S.listeGeldi = true; secimYap(); yenile(); });
Store.on('aktif', v=>{ S.aktif = v || null; secimYap(); });
Store.on('kurum', v=>{ S.kurum = v || {}; yenile(); });
if(URLP.get('tv')==='1') setTimeout(()=>{ if(S.T) tvAc(); }, 1500);
render();
</script>
